<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Jarvis · Голосовой помощник</title>
  <style>
    /* ---------- RESET & GLOBAL ---------- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #080b12;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      color: #e8edf5;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      max-height: 900px;
      background: #0b0e16;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 60px rgba(0,0,0,0.8);
    }
    @media (min-width: 431px) {
      .app { border-radius: 44px; }
    }

    /* ---------- HEADER ---------- */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 12px;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .header .logo {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, #8aa3ff, #4a6aff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.3px;
    }
    .header .logo small {
      font-size: 12px;
      -webkit-text-fill-color: #6a7ba8;
      background: rgba(255,255,255,0.04);
      padding: 2px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .header-actions {
      display: flex;
      gap: 6px;
    }
    .header-actions button {
      background: rgba(255,255,255,0.04);
      border: none;
      color: #8e9fd3;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
    .header-actions button:hover { background: rgba(255,255,255,0.08); }

    /* ---------- MAIN CONTENT ---------- */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 8px 20px 12px;
      display: flex;
      flex-direction: column;
    }
    .main-content::-webkit-scrollbar { width: 3px; }
    .main-content::-webkit-scrollbar-thumb { background: #2a3150; border-radius: 8px; }

    /* ---------- CHAT VIEW ---------- */
    .chat-view { display: flex; flex-direction: column; height: 100%; }
    .chat-view .status-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 0 12px;
      flex-shrink: 0;
    }
    .chat-view .orb {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #4a6aff, #1f3a9f);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 600;
      color: #fff;
      box-shadow: 0 8px 32px rgba(74,106,255,0.25);
      transition: box-shadow 0.4s, transform 0.3s;
      position: relative;
      margin-bottom: 12px;
    }
    .chat-view .orb .pulse-ring {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px solid rgba(74,106,255,0.15);
      animation: ringPulse 2s infinite;
      pointer-events: none;
    }
    .chat-view .orb .pulse-ring:nth-child(2) { animation-delay: 0.6s; }
    .chat-view .orb .pulse-ring:nth-child(3) { animation-delay: 1.2s; }
    @keyframes ringPulse {
      0% { transform: scale(1); opacity:0.6; }
      100% { transform: scale(1.5); opacity:0; }
    }
    .chat-view .orb.listening {
      box-shadow: 0 0 0 0 rgba(74,106,255,0.6);
      animation: pulseGlow 1.5s infinite;
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 0 rgba(74,106,255,0.5); transform: scale(1); }
      50% { box-shadow: 0 0 0 30px rgba(74,106,255,0); transform: scale(1.04); }
      100% { box-shadow: 0 0 0 0 rgba(74,106,255,0); transform: scale(1); }
    }
    .chat-view .orb.speaking {
      box-shadow: 0 0 40px rgba(74,106,255,0.4);
    }
    .chat-view .orb .letter { z-index: 2; }
    .chat-view .status-text {
      font-size: 16px;
      font-weight: 500;
      color: #b0c4ff;
      margin-bottom: 2px;
    }
    .chat-view .status-sub {
      font-size: 13px;
      color: #6a7ba8;
      text-align: center;
      max-width: 280px;
      line-height: 1.4;
    }

    /* Transcript */
    .transcript {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0 8px;
      margin: 0 -4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .transcript-item {
      padding: 8px 12px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.5;
      animation: fadeItem 0.25s ease;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    @keyframes fadeItem {
      from { opacity:0; transform: translateY(6px); }
      to { opacity:1; transform: translateY(0); }
    }
    .transcript-item.user {
      background: rgba(74,106,255,0.08);
      border: 1px solid rgba(74,106,255,0.06);
      justify-content: flex-end;
    }
    .transcript-item.jarvis {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.04);
    }
    .transcript-item .icon { font-size: 18px; flex-shrink: 0; width: 28px; text-align: center; }
    .transcript-item .text { flex: 1; word-break: break-word; }
    .transcript-item .time { font-size: 11px; color: #5a6a8a; flex-shrink: 0; margin-left: 8px; align-self: center; }

    /* Input area */
    .input-area {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0 4px;
      border-top: 1px solid rgba(255,255,255,0.04);
      flex-shrink: 0;
    }
    .input-area input {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 40px;
      padding: 10px 16px;
      color: #eef3ff;
      font-size: 15px;
      outline: none;
      font-family: inherit;
      transition: border 0.2s;
    }
    .input-area input:focus { border-color: #4a6aff; }
    .input-area input::placeholder { color: #6a7ba8; }
    .input-area button {
      background: rgba(255,255,255,0.04);
      border: none;
      color: #b0c4ff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
    .input-area button:hover { background: rgba(255,255,255,0.08); }
    .input-area button:active { transform: scale(0.92); }
    .input-area .mic-btn.listening {
      background: #ff6b6b;
      color: white;
      box-shadow: 0 0 20px rgba(255,70,70,0.3);
      animation: micPulse 1.2s infinite;
    }
    @keyframes micPulse {
      0% { box-shadow: 0 0 0 0 rgba(255,70,70,0.4); }
      50% { box-shadow: 0 0 0 20px rgba(255,70,70,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,70,70,0); }
    }

    /* ---------- TODAY VIEW ---------- */
    .today-view { display: none; flex-direction: column; height: 100%; padding-top: 8px; }
    .today-view.active { display: flex; }
    .today-view .today-header {
      font-size: 28px;
      font-weight: 700;
      color: #eef3ff;
      margin-bottom: 4px;
    }
    .today-view .today-date {
      font-size: 14px;
      color: #6a7ba8;
      margin-bottom: 16px;
    }
    .today-view .today-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .today-view .today-item .check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #4a6aff;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .today-view .today-item .check.done {
      background: #4a6aff;
      border-color: #4a6aff;
    }
    .today-view .today-item .check.done::after {
      content: '✓';
      color: white;
      font-size: 14px;
    }
    .today-view .today-item .task-text {
      flex: 1;
      font-size: 15px;
      color: #eef3ff;
    }
    .today-view .today-item .task-text.done {
      text-decoration: line-through;
      color: #6a7ba8;
    }
    .today-view .today-item .task-delete {
      background: none;
      border: none;
      color: #6a7ba8;
      font-size: 18px;
      cursor: pointer;
    }
    .today-view .today-item .task-delete:hover { color: #ff6b6b; }
    .today-view .today-empty {
      color: #6a7ba8;
      font-size: 15px;
      text-align: center;
      padding: 40px 0;
      line-height: 1.6;
    }

    /* ---------- MEMORY VIEW ---------- */
    .memory-view { display: none; flex-direction: column; height: 100%; padding-top: 8px; }
    .memory-view.active { display: flex; }
    .memory-view .memory-header {
      font-size: 28px;
      font-weight: 700;
      color: #eef3ff;
      margin-bottom: 8px;
    }
    .memory-view .memory-search {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 30px;
      padding: 10px 16px;
      color: #eef3ff;
      font-size: 15px;
      outline: none;
      width: 100%;
      margin-bottom: 16px;
      font-family: inherit;
    }
    .memory-view .memory-search::placeholder { color: #6a7ba8; }
    .memory-view .memory-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 8px;
      font-size: 15px;
      color: #eef3ff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .memory-view .memory-item .mem-delete {
      background: none;
      border: none;
      color: #6a7ba8;
      font-size: 18px;
      cursor: pointer;
    }
    .memory-view .memory-item .mem-delete:hover { color: #ff6b6b; }
    .memory-view .memory-empty {
      color: #6a7ba8;
      font-size: 15px;
      text-align: center;
      padding: 40px 0;
      line-height: 1.6;
    }

    /* ---------- HISTORY VIEW ---------- */
    .history-view { display: none; flex-direction: column; height: 100%; padding-top: 8px; }
    .history-view.active { display: flex; }
    .history-view .history-header {
      font-size: 28px;
      font-weight: 700;
      color: #eef3ff;
      margin-bottom: 4px;
    }
    .history-view .history-sub {
      font-size: 14px;
      color: #6a7ba8;
      margin-bottom: 16px;
    }
    .history-view .history-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .history-view .history-item:hover { background: rgba(255,255,255,0.06); }
    .history-view .history-item .h-title {
      font-size: 15px;
      color: #eef3ff;
      font-weight: 500;
    }
    .history-view .history-item .h-date {
      font-size: 12px;
      color: #6a7ba8;
      margin-top: 2px;
    }
    .history-view .history-empty {
      color: #6a7ba8;
      font-size: 15px;
      text-align: center;
      padding: 40px 0;
      line-height: 1.6;
    }

    /* ---------- SETTINGS MODAL ---------- */
    .settings-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(20px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }
    .settings-overlay.active { display: flex; }
    .settings-modal {
      background: #141a26;
      border-radius: 32px;
      padding: 28px 24px;
      max-width: 400px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid rgba(255,255,255,0.04);
      box-shadow: 0 40px 80px rgba(0,0,0,0.8);
    }
    .settings-modal h2 {
      font-size: 22px;
      font-weight: 700;
      color: #eef3ff;
      margin-bottom: 20px;
    }
    .settings-modal .setting-group {
      margin-bottom: 18px;
    }
    .settings-modal .setting-group label {
      display: block;
      font-size: 13px;
      color: #96a7d9;
      margin-bottom: 4px;
    }
    .settings-modal .setting-group select,
    .settings-modal .setting-group input {
      width: 100%;
      padding: 10px 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      color: #eef3ff;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }
    .settings-modal .setting-group select option { background: #141a26; }
    .settings-modal .setting-group .range-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 0;
    }
    .settings-modal .setting-group .range-wrap input[type="range"] {
      flex: 1;
      accent-color: #4a6aff;
      background: transparent;
    }
    .settings-modal .setting-group .range-wrap span {
      color: #b0c4ff;
      font-size: 14px;
      min-width: 32px;
      text-align: center;
    }
    .settings-modal .setting-group .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
    }
    .settings-modal .setting-group .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #4a6aff;
    }
    .settings-modal .setting-group .checkbox-group label {
      margin: 0;
      font-size: 14px;
      color: #eef3ff;
      cursor: pointer;
    }
    .settings-modal .settings-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      justify-content: flex-end;
    }
    .settings-modal .settings-actions button {
      padding: 10px 22px;
      border: none;
      border-radius: 30px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }
    .settings-modal .settings-actions .btn-primary {
      background: #4a6aff;
      color: white;
    }
    .settings-modal .settings-actions .btn-primary:hover { background: #5a7aff; }
    .settings-modal .settings-actions .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: #b0c4ff;
    }
    .settings-modal .settings-actions .btn-secondary:hover { background: rgba(255,255,255,0.1); }

    /* ---------- BOTTOM NAV ---------- */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 0 12px;
      border-top: 1px solid rgba(255,255,255,0.04);
      flex-shrink: 0;
      background: #0b0e16;
    }
    .bottom-nav .nav-item {
      background: none;
      border: none;
      color: #6a7ba8;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      transition: 0.2s;
      padding: 4px 12px;
      font-family: inherit;
    }
    .bottom-nav .nav-item .nav-icon {
      font-size: 22px;
      line-height: 1;
    }
    .bottom-nav .nav-item.active {
      color: #b0c4ff;
    }
    .bottom-nav .nav-item.active .nav-icon {
      color: #4a6aff;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 430px) {
      .app { max-height: 100vh; }
      .header { padding: 12px 16px 8px; }
      .main-content { padding: 4px 16px 8px; }
      .chat-view .orb { width: 68px; height: 68px; font-size: 28px; }
      .input-area input { font-size: 14px; padding: 8px 14px; }
    }
  </style>
</head>
<body>
<div class="app" id="app">
  <!-- Header -->
  <div class="header">
    <div class="logo">Jarvis <small>3.4</small></div>
    <div class="header-actions">
      <button id="settingsBtn" aria-label="Настройки">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content" id="mainContent">
    <!-- Chat View -->
    <div class="chat-view" id="chatView">
      <div class="status-area">
        <div class="orb" id="orb">
          <div class="pulse-ring"></div>
          <div class="pulse-ring"></div>
          <div class="pulse-ring"></div>
          <span class="letter">J</span>
        </div>
        <div class="status-text" id="statusText">Нажмите на микрофон</div>
        <div class="status-sub" id="statusSub">Говорите, и я отвечу голосом</div>
      </div>
      <div class="transcript" id="transcript"></div>
      <div class="input-area">
        <input type="text" id="textInput" placeholder="Сообщение…" />
        <button class="mic-btn" id="micBtn" aria-label="Голосовой ввод">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 16c-2.206 0-4-1.794-4-4V6c0-2.206 1.794-4 4-4s4 1.794 4 4v6c0 2.206-1.794 4-4 4zm8-4h-2c0 3.309-2.691 6-6 6s-6-2.691-6-6H4c0 4.072 3.061 7.436 7 7.931V22h2v-2.069c3.939-.495 7-3.858 7-7.931z"/></svg>
        </button>
        <button id="sendBtn" aria-label="Отправить">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>

    <!-- Today View -->
    <div class="today-view" id="todayView">
      <div class="today-header">Today</div>
      <div class="today-date" id="todayDate"></div>
      <div id="todayList"></div>
    </div>

    <!-- Memory View -->
    <div class="memory-view" id="memoryView">
      <div class="memory-header">Memory</div>
      <input class="memory-search" id="memorySearch" placeholder="Search what Jarvis knows..." />
      <div id="memoryList"></div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <button class="nav-item active" data-view="chat">
      <span class="nav-icon">💬</span>
      <span>Jarvis</span>
    </button>
    <button class="nav-item" data-view="today">
      <span class="nav-icon">📅</span>
      <span>Today</span>
    </button>
    <button class="nav-item" data-view="memory">
      <span class="nav-icon">🧠</span>
      <span>Memory</span>
    </button>
  </div>
</div>

<!-- Settings Modal -->
<div class="settings-overlay" id="settingsModal">
  <div class="settings-modal">
    <h2>Settings</h2>
    <div class="setting-group">
      <label>Personality</label>
      <select id="personalitySelect">
        <option value="warm">Warm</option>
        <option value="professional">Professional</option>
        <option value="casual">Casual</option>
      </select>
    </div>
    <div class="setting-group">
      <label>Voice</label>
      <select id="voiceSelect">
        <option value="default">System voice</option>
        <option value="ru-RU">Russian (standard)</option>
        <option value="en-US">English (US)</option>
      </select>
    </div>
    <div class="setting-group">
      <label>Appearance</label>
      <select id="themeSelect">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
    </div>
    <div class="setting-group">
      <label>Language</label>
      <select id="langSelect">
        <option value="ru">Russian</option>
        <option value="en">English</option>
        <option value="es">Spanish</option>
      </select>
    </div>
    <div class="setting-group">
      <label>Temperature</label>
      <div class="range-wrap">
        <span>0.0</span>
        <input type="range" id="tempRange" min="0" max="200" value="70" />

  (function() {

    const GROQ_API_KEY = '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';
    const ENCRYPTED_OPENROUTER_KEY = 'c2stb3ItdjEtZTM0NTk1NWY1NGM2NTg1ZTA2OTBhMTkwNmE2ZmYyMzJmNjMxOWQyZGEwYjFmMjkzZjEyZWNmODMzMjFlZjYxMg==';
    function getOpenRouterKey() { try { return atob(ENCRYPTED_OPENROUTER_KEY); } catch(e) { return ''; } }
    const OPENROUTER_API_KEY = getOpenRouterKey();

    // ---------- ELEVENLABS ----------
    const ELEVENLABS_API_KEY = 'vk_c52f58be50aa90419a3972a0f22001a994b1b8a0be2db459f72c7066163ced5d';
    const JARVIS_VOICE_ID = 'ffe60175-1707-454f-9e2f-2b1fcd904192';

    // ---------- DOM ----------
    const orb = document.getElementById('orb');
    const statusText = document.getElementById('statusText');
    const statusSub = document.getElementById('statusSub');
    const transcript = document.getElementById('transcript');
    const textInput = document.getElementById('textInput');
    const micBtn = document.getElementById('micBtn');
    const sendBtn = document.getElementById('sendBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const settingsClose = document.getElementById('settingsClose');
    const settingsSave = document.getElementById('settingsSave');
    const providerSelect = document.getElementById('providerSelect');
    const modelSelect = document.getElementById('modelSelect');
    const personalitySelect = document.getElementById('personalitySelect');
    const voiceSelect = document.getElementById('voiceSelect');
    const themeSelect = document.getElementById('themeSelect');
    const langSelect = document.getElementById('langSelect');
    const tempRange = document.getElementById('tempRange');
    const tempValue = document.getElementById('tempValue');
    const memoryEnabled = document.getElementById('memoryEnabled');

    const navItems = document.querySelectorAll('.nav-item');
    const chatView = document.getElementById('chatView');
    const todayView = document.getElementById('todayView');
    const memoryView = document.getElementById('memoryView');
    const todayList = document.getElementById('todayList');
    const todayDate = document.getElementById('todayDate');

    const memorySearch = document.getElementById('memorySearch');

    // ---------- State ----------
    let isListening = false;
    let isProcessing = false;
    let recognition = null;
    let conversationHistory = [];
    let tasks = []; // { id, text, done }
    let memories = []; // { id, text }
    let config = {
      personality: 'warm',

      theme: 'dark',
      language: 'ru',
      temperature: 0.7,

      provider: 'openai',
      model: 'gpt-4o-mini'
    };

    const modelOptions = {
      openai: [
        { value: 'gpt-4o-mini', label: 'GPT-4o Mini' },
        { value: 'gpt-4o', label: 'GPT-4o' },
        { value: 'gpt-3.5-turbo', label: 'GPT-3.5 Turbo' },
      ],
      groq: [
        { value: 'llama3-70b-8192', label: 'Llama 3 70B' },
        { value: 'mixtral-8x7b-32768', label: 'Mixtral 8x7B' },
      ],
      openrouter: [
        { value: 'mistralai/mistral-7b-instruct:free', label: 'Mistral 7B' },
        { value: 'meta-llama/llama-3.1-8b-instruct:free', label: 'Llama 3.1 8B' },
        { value: 'anthropic/claude-3-haiku', label: 'Claude 3 Haiku' },
      ]
    };

    // ---------- Init ----------
    function init() {
      loadState();
      applyConfigUI();
      updateModelOptions();
      updateTodayDate();
      renderToday();
      renderMemory();
      initRecognition();
      addTranscript('jarvis', 'Здравствуйте, сер. Я Джарвис. Нажмите на микрофон или напишите сообщение.');
      // Set default view
      switchView('chat');
    }

    // ---------- State (localStorage) ----------
    function loadState() {
      try {
        const saved = localStorage.getItem('jarvis_config');
        if (saved) Object.assign(config, JSON.parse(saved));
        const tasksSaved = localStorage.getItem('jarvis_tasks');
        if (tasksSaved) tasks = JSON.parse(tasksSaved);
        const memSaved = localStorage.getItem('jarvis_memories');
        if (memSaved) memories = JSON.parse(memSaved);
        const histSaved = localStorage.getItem('jarvis_history');
        if (histSaved) conversationHistory = JSON.parse(histSaved);
      } catch(e) {}
    }

    function saveState() {
      localStorage.setItem('jarvis_config', JSON.stringify(config));
      localStorage.setItem('jarvis_tasks', JSON.stringify(tasks));
      localStorage.setItem('jarvis_memories', JSON.stringify(memories));
      localStorage.setItem('jarvis_history', JSON.stringify(conversationHistory));
    }

    // ---------- Config UI ----------
    function applyConfigUI() {
      personalitySelect.value = config.personality || 'warm';
      voiceSelect.value = config.voice || 'default';
      themeSelect.value = config.theme || 'dark';
      langSelect.value = config.language || 'ru';
      tempRange.value = Math.round((config.temperature || 0.7) * 100);
      tempValue.textContent = (config.temperature || 0.7).toFixed(1);
      memoryEnabled.checked = config.memory !== false;
      providerSelect.value = config.provider || 'openai';
      updateModelOptions();
      const models = modelOptions[config.provider] || [];
      if (models.some(m => m.value === config.model)) {
        modelSelect.value = config.model;
      } else if (models.length) {
        modelSelect.value = models[0].value;
        config.model = models[0].value;
      }
      applyTheme(config.theme);
    }

    function updateModelOptions() {
      const provider = providerSelect.value;
      const models = modelOptions[provider] || [];
      modelSelect.innerHTML = '';
      models.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.value;
        opt.textContent = m.label;
        modelSelect.appendChild(opt);
      });
      if (config.model && models.some(m => m.value === config.model)) {
        modelSelect.value = config.model;
      } else if (models.length) {
        modelSelect.value = models[0].value;
        config.model = models[0].value;
      }
    }

    function applyTheme(theme) {
      document.body.style.background = theme === 'light' ? '#f0f2f5' : '#080b12';
      document.querySelector('.app').style.background = theme === 'light' ? '#ffffff' : '#0b0e16';
      // можно добавить больше стилей для light, но для простоты оставляем
    }

    // ---------- Navigation ----------
    function switchView(view) {
      chatView.style.display = 'none';
      todayView.classList.remove('active');
      todayView.style.display = 'none';
      memoryView.classList.remove('active');
      memoryView.style.display = 'none';

      navItems.forEach(item => item.classList.remove('active'));

      if (view === 'chat') {
        chatView.style.display = 'flex';
        navItems[0].classList.add('active');
      } else if (view === 'today') {
        todayView.style.display = 'flex';
        todayView.classList.add('active');
        navItems[1].classList.add('active');
        renderToday();
      } else if (view === 'memory') {
        memoryView.style.display = 'flex';
        memoryView.classList.add('active');
        navItems[2].classList.add('active');
        renderMemory();
      }
    }

    navItems.forEach((item, idx) => {
      item.addEventListener('click', () => {
        const views = ['chat', 'today', 'memory'];
        switchView(views[idx]);
      });
    });

    // ---------- Today ----------
    function updateTodayDate() {
      const now = new Date();
      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      todayDate.textContent = now.toLocaleDateString('ru-RU', options).toUpperCase();
    }

    function renderToday() {
      todayList.innerHTML = '';
      if (tasks.length === 0) {
        todayList.innerHTML = `
          <div class="today-empty">
            Your to-dos and reminders show up here.<br>
            Just say it while talking — "remind me to send Sarah the report" — and Jarvis keeps track of it for you.
          </div>
        `;
        return;
      }
      tasks.forEach(task => {
        const div = document.createElement('div');
        div.className = 'today-item';
        const check = document.createElement('div');
        check.className = 'check' + (task.done ? ' done' : '');
        check.addEventListener('click', () => {
          task.done = !task.done;
          saveState();
          renderToday();
        });
        const text = document.createElement('span');
        text.className = 'task-text' + (task.done ? ' done' : '');
        text.textContent = task.text;
        const del = document.createElement('button');
        del.className = 'task-delete';
        del.textContent = '✕';
        del.addEventListener('click', () => {
          tasks = tasks.filter(t => t.id !== task.id);
          saveState();
          renderToday();
        });
        div.appendChild(check);
        div.appendChild(text);
        div.appendChild(del);
        todayList.appendChild(div);
      });
    }

    // ---------- Memory ----------
    function renderMemory(filter = '') {
      memoryList.innerHTML = '';
      let items = memories;
      if (filter) {
        items = items.filter(m => m.text.toLowerCase().includes(filter.toLowerCase()));
      }
      if (items.length === 0) {
        memoryList.innerHTML = `
          <div class="memory-empty">
            Nothing yet. Say "remember that..." in a conversation, or just talk — Jarvis keeps what matters.
          </div>
        `;
        return;
      }
      items.forEach(mem => {
        const div = document.createElement('div');
        div.className = 'memory-item';
        const text = document.createElement('span');
        text.textContent = mem.text;
        const del = document.createElement('button');
        del.className = 'mem-delete';
        del.textContent = '✕';
        del.addEventListener('click', () => {
          memories = memories.filter(m => m.id !== mem.id);
          saveState();
          renderMemory(memorySearch.value);
        });
        div.appendChild(text);
        div.appendChild(del);
        memoryList.appendChild(div);
      });
    }

    memorySearch.addEventListener('input', () => {
      renderMemory(memorySearch.value);
    });

    // ---------- Transcript ----------
    function addTranscript(role, text) {
      const div = document.createElement('div');
      div.className = `transcript-item ${role}`;
      const icon = document.createElement('span');
      icon.className = 'icon';
      icon.textContent = role === 'user' ? '👤' : '🤖';
      const textSpan = document.createElement('span');
      textSpan.className = 'text';
      textSpan.textContent = text;
      const time = document.createElement('span');
      time.className = 'time';
      const now = new Date();
      time.textContent = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
      div.appendChild(icon);
      div.appendChild(textSpan);
      div.appendChild(time);
      transcript.appendChild(div);
      transcript.scrollTop = transcript.scrollHeight;
      conversationHistory.push({ role, content: text });
      if (conversationHistory.length > 50) {
        conversationHistory = conversationHistory.slice(-50);
      }
      saveState();
    }

    function clearTranscript() {
      transcript.innerHTML = '';
      conversationHistory = [];
      saveState();
    }

    // ---------- Speech Recognition ----------
    function initRecognition() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        statusSub.textContent = 'Голосовой ввод не поддерживается.';
        return false;
      }
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SR();
      recognition.lang = 'ru-RU';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = function() {
        isListening = true;
        micBtn.classList.add('listening');
        orb.classList.add('listening');
        statusText.textContent = '🎤 Слушаю...';
        statusSub.textContent = 'Говорите, я слушаю';
      };

      recognition.onresult = function(e) {
        const text = e.results[e.results.length-1][0].transcript.trim();
        if (text) {
          addTranscript('user', text);
          stopListening();
          processUserInput(text);
        } else {
          stopListening();
        }
      };

      recognition.onerror = function(e) {
        if (e.error === 'not-allowed') {
          statusSub.textContent = '⚠️ Разрешите доступ к микрофону.';
        } else if (e.error === 'no-speech') {
          statusSub.textContent = 'Не распознано. Попробуйте ещё раз.';
        } else {
          statusSub.textContent = `Ошибка: ${e.error}`;
        }
        stopListening();
      };

      recognition.onend = function() {
        if (isListening) stopListening();
      };

      return true;
    }

    function startListening() {
      if (isProcessing) return;
      if (!recognition) {
        if (!initRecognition()) return;
      }
      try { recognition.start(); } catch(e) {}
    }

    function stopListening() {
      isListening = false;
      micBtn.classList.remove('listening');
      orb.classList.remove('listening');
      statusText.textContent = 'Нажмите на микрофон';
      statusSub.textContent = 'Говорите, и я отвечу голосом';
      if (recognition) { try { recognition.stop(); } catch(e) {} }
    }

    micBtn.addEventListener('click', function() {
      if (isProcessing) return;
      if (isListening) {
        stopListening();
      } else {
        startListening();
      }
    });

    // ---------- Text input ----------
    sendBtn.addEventListener('click', function() {
      const text = textInput.value.trim();
      if (text) {
        addTranscript('user', text);
        textInput.value = '';
        processUserInput(text);
      }
    });

    textInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendBtn.click();
      }
    });

    // ---------- Process AI ----------
    async function processUserInput(text) {
      if (isProcessing) return;
      isProcessing = true;
      statusText.textContent = '⏳ Думаю...';
      statusSub.textContent = 'Обработка запроса';
      orb.classList.add('speaking');

      // Проверка на "remember that" для Memory
      const rememberMatch = text.match(/remember that\s*(.+)/i);
      if (rememberMatch && config.memory) {
        const fact = rememberMatch[1].trim();
        if (fact) {
          memories.push({ id: Date.now().toString(36), text: fact });
          saveState();
          renderMemory();
          addTranscript('jarvis', `Запомнил: "${fact}"`);
          speakText(`Запомнил, сер.`);
          isProcessing = false;
          orb.classList.remove('speaking');
          statusText.textContent = 'Нажмите на микрофон';
          statusSub.textContent = 'Говорите, и я отвечу голосом';
          return;
        }
      }

      // Проверка на "remind me" для Today
      const remindMatch = text.match(/remind me to\s*(.+)/i);
      if (remindMatch && config.memory) {
        const taskText = remindMatch[1].trim();
        if (taskText) {
          tasks.push({ id: Date.now().toString(36), text: taskText, done: false });
          saveState();
          renderToday();
          addTranscript('jarvis', `Напоминание: "${taskText}"`);
          speakText(`Напоминание установлено, сер.`);
          isProcessing = false;
          orb.classList.remove('speaking');
          statusText.textContent = 'Нажмите на микрофон';
          statusSub.textContent = 'Говорите, и я отвечу голосом';
          return;
        }
      }

      try {
        const answer = await callAI(text);
        if (answer) {
          let finalText = answer;
          if (!finalText.toLowerCase().includes('сер')) {
            finalText += ', сер.';
          }
          addTranscript('jarvis', finalText);
          speakText(finalText);
        } else {
          addTranscript('jarvis', 'Извините, я не смог обработать запрос, сер.');
        }
      } catch (e) {
        addTranscript('jarvis', `Ошибка: ${e.message || 'Неизвестная ошибка'}`);
      } finally {
        isProcessing = false;
        orb.classList.remove('speaking');
        statusText.textContent = 'Нажмите на микрофон';
        statusSub.textContent = 'Говорите, и я отвечу голосом';
      }
    }

    // ---------- AI Call ----------
    async function callAI(userText) {
      const provider = config.provider;
      const model = config.model;
      const temperature = config.temperature || 0.7;

      // Build personality prompt
      let personality = '';
      if (config.personality === 'warm') personality = 'Ты — тёплый, дружелюбный, заботливый помощник.';
      else if (config.personality === 'professional') personality = 'Ты — профессиональный, сдержанный, деловой ассистент.';
      else if (config.personality === 'casual') personality = 'Ты — неформальный, простой, разговорчивый собеседник.';

      const messages = [];
      messages.push({ role: 'system', content: `Ты — Джарвис. ${personality} Всегда добавляй в конце "сер". Отвечай развёрнуто, структурированно.` });
      const history = conversationHistory.slice(-10);
      history.forEach(msg => {
        messages.push({ role: msg.role === 'user' ? 'user' : 'assistant', content: msg.content });
      });
      if (messages[messages.length-1]?.role !== 'user') {
        messages.push({ role: 'user', content: userText });
      }

      const providers = [provider, 'openai', 'groq', 'openrouter'];
      let lastError = null;

      for (const p of providers) {
        try {
          if (p === 'openai') {
            if (!OPENAI_API_KEY) throw new Error('OpenAI ключ не задан');
            const resp = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${OPENAI_API_KEY}`
              },
              body: JSON.stringify({
                model: model || 'gpt-4o-mini',
                messages: messages,
                temperature: temperature,
                max_tokens: 2048,
              })
            });
            if (!resp.ok) {
              const err = await resp.text();
              throw new Error(`OpenAI error (${resp.status}): ${err}`);
            }
            const data = await resp.json();
            return data?.choices?.[0]?.message?.content || 'Ответ не получен.';
          }
          else if (p === 'groq') {
            if (!GROQ_API_KEY) throw new Error('Groq ключ не задан');
            const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${GROQ_API_KEY}`
              },
              body: JSON.stringify({
                model: model || 'llama3-70b-8192',
                messages: messages,
                temperature: temperature,
                max_tokens: 2048,
              })
            });
            if (!resp.ok) {
              const err = await resp.text();
              throw new Error(`Groq error (${resp.status}): ${err}`);
            }
            const data = await resp.json();
            return data?.choices?.[0]?.message?.content || 'Ответ не получен.';
          }
          else if (p === 'openrouter') {
            if (!OPENROUTER_API_KEY) throw new Error('OpenRouter ключ не найден');
            const resp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${OPENROUTER_API_KEY}`,
                'HTTP-Referer': window.location.origin,
                'X-Title': 'Jarvis 3.4'
              },
              body: JSON.stringify({
                model: model || 'mistralai/mistral-7b-instruct:free',
                messages: messages,
                temperature: temperature,
                max_tokens: 2048,
              })
            });
            if (!resp.ok) {
              const err = await resp.text();
              throw new Error(`OpenRouter error (${resp.status}): ${err}`);
            }
            const data = await resp.json();
            return data?.choices?.[0]?.message?.content || 'Ответ не получен.';
          }
        } catch (e) {
          lastError = e;
          console.warn(`Провайдер ${p} не сработал:`, e.message);
          if (p === providers[providers.length-1]) {
            throw new Error(`Все провайдеры не отвечают. Последняя ошибка: ${e.message}`);
          }
        }
      }
      throw new Error('Неизвестная ошибка при вызове AI.');
    }

    // ---------- Speech Synthesis (ElevenLabs + fallback) ----------
    async function speakText(text) {
      // Если есть ключ и голос, используем ElevenLabs
      if (ELEVENLABS_API_KEY && JARVIS_VOICE_ID) {
        try {
          const resp = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${JARVIS_VOICE_ID}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'xi-api-key': ELEVENLABS_API_KEY,
            },
            body: JSON.stringify({
              text: text,
              model_id: 'eleven_monolingual_v1',
              voice_settings: { stability: 0.5, similarity_boost: 0.75 },
            }),
          });
          if (resp.ok) {
            const blob = await resp.blob();
            const url = URL.createObjectURL(blob);
            const audio = new Audio(url);
            audio.onended = () => {
              URL.revokeObjectURL(url);
              orb.classList.remove('speaking');
            };
            audio.onplay = () => {
              orb.classList.add('speaking');
              statusText.textContent = '🗣️ Джарвис говорит...';
              statusSub.textContent = 'Озвучивание ответа';
            };
            audio.play();
            return;
          } else {
            console.warn('ElevenLabs error, using fallback');
          }
        } catch(e) {
          console.warn('ElevenLabs fetch error:', e);
        }
      }

      // Fallback: Web Speech API
      if (!('speechSynthesis' in window)) return;
      if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ru-RU';
      utterance.rate = 0.82;
      utterance.pitch = 0.55;
      utterance.volume = 1;
      const voices = speechSynthesis.getVoices();
      const ruVoice = voices.find(v => v.lang.startsWith('ru'));
      if (ruVoice) utterance.voice = ruVoice;
      utterance.onstart = () => {
        orb.classList.add('speaking');
        statusText.textContent = '🗣️ Джарвис говорит...';
        statusSub.textContent = 'Озвучивание ответа';
      };
      utterance.onend = () => {
        orb.classList.remove('speaking');
        if (!isListening) {
          statusText.textContent = 'Нажмите на микрофон';
          statusSub.textContent = 'Говорите, и я отвечу голосом';
        }
      };
      utterance.onerror = () => {
        orb.classList.remove('speaking');
        if (!isListening) {
          statusText.textContent = 'Нажмите на микрофон';
          statusSub.textContent = 'Говорите, и я отвечу голосом';
        }
      };
      window.speechSynthesis.speak(utterance);
    }

    // ---------- Settings ----------
    settingsBtn.addEventListener('click', () => {
      settingsModal.classList.add('active');
    });
    settingsClose.addEventListener('click', () => {
      settingsModal.classList.remove('active');
    });
    settingsSave.addEventListener('click', () => {
      config.personality = personalitySelect.value;
      config.voice = voiceSelect.value;
      config.theme = themeSelect.value;
      config.language = langSelect.value;
      config.temperature = parseFloat((tempRange.value / 100).toFixed(1));
      config.memory = memoryEnabled.checked;
      config.provider = providerSelect.value;
      config.model = modelSelect.value;
      saveState();
      applyConfigUI();
      settingsModal.classList.remove('active');
      statusSub.textContent = 'Настройки сохранены';
      setTimeout(() => {
        statusSub.textContent = 'Говорите, и я отвечу голосом';
      }, 1500);
    });

    providerSelect.addEventListener('change', updateModelOptions);

    tempRange.addEventListener('input', function() {
      const val = (this.value / 100).toFixed(1);
      tempValue.textContent = val;
    });

    settingsModal.addEventListener('click', (e) => {
      if (e.target === settingsModal) settingsModal.classList.remove('active');
    });

    // ---------- Init ----------
    init();

    // Подгружаем голоса для fallback
    if (speechSynthesis) {
      speechSynthesis.onvoiceschanged = () => {};
    }

  })();
</script>
</body>
</html>
