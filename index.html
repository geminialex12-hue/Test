<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Jarvis · Голосовой помощник</title>
  <style>
    /* ---------- RESET & GLOBAL ---------- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0c14;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      color: #e8edf5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .app {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 820px;
      background: linear-gradient(145deg, #10141e, #0b0e16);
      border-radius: 44px;
      box-shadow: 0 40px 80px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.03);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      padding: 20px 24px 28px;
      transition: opacity 0.3s;
    }

    /* ---------- HEADER ---------- */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      flex-shrink: 0;
    }
    .logo {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #8aa3ff, #4a6aff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .logo small {
      font-size: 12px;
      font-weight: 400;
      -webkit-text-fill-color: #6a7ba8;
      background: rgba(255,255,255,0.04);
      padding: 2px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .header-actions {
      display: flex;
      gap: 6px;
    }
    .header-actions button {
      background: rgba(255,255,255,0.04);
      border: none;
      color: #8e9fd3;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .header-actions button:hover { background: rgba(255,255,255,0.08); }
    .header-actions button:active { transform: scale(0.92); }

    /* ---------- STATUS ---------- */
    .status-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 12px 0 8px;
      min-height: 160px;
    }
    .status-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #4a6aff, #1f3a9f);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 600;
      color: #fff;
      box-shadow: 0 8px 32px rgba(74, 106, 255, 0.25);
      transition: box-shadow 0.4s, transform 0.3s;
      position: relative;
      margin-bottom: 16px;
    }
    .status-icon .pulse-ring {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px solid rgba(74, 106, 255, 0.15);
      animation: ringPulse 2s infinite;
      pointer-events: none;
    }
    .status-icon .pulse-ring:nth-child(2) { animation-delay: 0.6s; }
    .status-icon .pulse-ring:nth-child(3) { animation-delay: 1.2s; }
    @keyframes ringPulse {
      0% { transform: scale(1); opacity:0.6; }
      100% { transform: scale(1.5); opacity:0; }
    }
    .status-icon.listening {
      box-shadow: 0 0 0 0 rgba(74, 106, 255, 0.6);
      animation: pulseGlow 1.5s infinite;
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 0 rgba(74,106,255,0.5); transform: scale(1); }
      50% { box-shadow: 0 0 0 30px rgba(74,106,255,0); transform: scale(1.04); }
      100% { box-shadow: 0 0 0 0 rgba(74,106,255,0); transform: scale(1); }
    }
    .status-icon.speaking {
      box-shadow: 0 0 40px rgba(74, 106, 255, 0.4);
    }
    .status-icon .avatar-letter {
      z-index: 2;
      font-size: 32px;
      font-weight: 600;
    }
    .status-label {
      font-size: 16px;
      font-weight: 500;
      color: #b0c4ff;
      margin-bottom: 4px;
      transition: 0.3s;
    }
    .status-sub {
      font-size: 13px;
      color: #6a7ba8;
      text-align: center;
      max-width: 280px;
      line-height: 1.4;
    }

    /* ---------- TRANSCRIPT ---------- */
    .transcript {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0 12px;
      margin: 0 -4px;
      scroll-behavior: smooth;
      min-height: 120px;
    }
    .transcript::-webkit-scrollbar { width: 3px; }
    .transcript::-webkit-scrollbar-thumb { background: #2a3150; border-radius: 8px; }
    .transcript-item {
      padding: 8px 12px;
      margin-bottom: 4px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.5;
      animation: fadeItem 0.25s ease;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    @keyframes fadeItem {
      from { opacity:0; transform: translateY(8px); }
      to { opacity:1; transform: translateY(0); }
    }
    .transcript-item.user {
      background: rgba(74, 106, 255, 0.08);
      border: 1px solid rgba(74, 106, 255, 0.06);
      justify-content: flex-end;
    }
    .transcript-item.jarvis {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.04);
    }
    .transcript-item .icon {
      font-size: 18px;
      flex-shrink: 0;
      width: 28px;
      text-align: center;
    }
    .transcript-item .text {
      flex: 1;
      word-break: break-word;
    }
    .transcript-item .time {
      font-size: 11px;
      color: #5a6a8a;
      flex-shrink: 0;
      margin-left: 8px;
      align-self: center;
    }

    /* ---------- MIC BUTTON ---------- */
    .mic-area {
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      flex-shrink: 0;
    }
    .mic-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #4a6aff, #2f47c7);
      color: white;
      font-size: 34px;
      cursor: pointer;
      transition: 0.25s;
      box-shadow: 0 8px 32px rgba(74, 106, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .mic-btn:hover { transform: scale(1.02); }
    .mic-btn:active { transform: scale(0.92); }
    .mic-btn.listening {
      background: linear-gradient(135deg, #ff6b6b, #d94a4a);
      box-shadow: 0 8px 32px rgba(255, 70, 70, 0.3);
      animation: micPulse 1.2s infinite;
    }
    @keyframes micPulse {
      0% { box-shadow: 0 0 0 0 rgba(255,70,70,0.4); }
      50% { box-shadow: 0 0 0 20px rgba(255,70,70,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,70,70,0); }
    }
    .mic-btn .mic-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .mic-btn .mic-icon svg {
      width: 32px;
      height: 32px;
      fill: currentColor;
    }
    .mic-btn .badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #ff6b6b;
      color: white;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
      border: 2px solid #0a0c14;
    }

    .mic-actions {
      display: flex;
      gap: 12px;
    }
    .mic-actions button {
      background: rgba(255,255,255,0.04);
      border: none;
      color: #6a7ba8;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mic-actions button:hover { background: rgba(255,255,255,0.08); color: #b0c4ff; }
    .mic-actions button:active { transform: scale(0.9); }

    /* ---------- MODAL SETTINGS ---------- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(20px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #141a26;
      border-radius: 32px;
      padding: 28px 24px;
      max-width: 400px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid rgba(255,255,255,0.04);
      box-shadow: 0 40px 80px rgba(0,0,0,0.8);
    }
    .modal h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #eef3ff;
    }
    .modal label {
      display: block;
      font-size: 13px;
      color: #96a7d9;
      margin-top: 14px;
      margin-bottom: 4px;
    }
    .modal select, .modal input {
      width: 100%;
      padding: 10px 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      color: #eef3ff;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }
    .modal select option { background: #141a26; }
    .modal .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      justify-content: flex-end;
    }
    .modal .modal-actions button {
      padding: 10px 22px;
      border: none;
      border-radius: 30px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }
    .modal .modal-actions .btn-primary {
      background: #4a6aff;
      color: white;
    }
    .modal .modal-actions .btn-primary:hover { background: #5a7aff; }
    .modal .modal-actions .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: #b0c4ff;
    }
    .modal .modal-actions .btn-secondary:hover { background: rgba(255,255,255,0.1); }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 480px) {
      body { padding: 0; }
      .app { border-radius: 0; max-height: 100vh; padding: 16px 18px 20px; }
      .status-icon { width: 68px; height: 68px; font-size: 30px; }
      .mic-btn { width: 64px; height: 64px; font-size: 30px; }
      .mic-btn .mic-icon svg { width: 28px; height: 28px; }
      .status-label { font-size: 15px; }
      .transcript-item { font-size: 14px; padding: 6px 10px; }
    }
    @media (max-width: 380px) {
      .app { padding: 12px 14px 16px; }
      .status-icon { width: 60px; height: 60px; font-size: 26px; }
      .mic-btn { width: 58px; height: 58px; font-size: 26px; }
      .mic-btn .mic-icon svg { width: 24px; height: 24px; }
    }

    /* ---------- SCROLLBAR ---------- */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a3150; border-radius: 8px; }

    /* ---------- SVG ICONS ---------- */
    .icon-mic, .icon-send, .icon-settings, .icon-trash, .icon-close {
      display: inline-block;
      vertical-align: middle;
    }
  </style>
</head>

    const modelOptions = {
      openai: [
        { value: 'gpt-4o-mini', label: 'GPT-4o Mini' },
        { value: 'gpt-4o', label: 'GPT-4o' },
        { value: 'gpt-3.5-turbo', label: 'GPT-3.5 Turbo' },
      ],
      groq: [
        { value: 'llama3-70b-8192', label: 'Llama 3 70B' },
        { value: 'mixtral-8x7b-32768', label: 'Mixtral 8x7B' },
      ],
      openrouter: [
        { value: 'mistralai/mistral-7b-instruct:free', label: 'Mistral 7B' },
        { value: 'meta-llama/llama-3.1-8b-instruct:free', label: 'Llama 3.1 8B' },
        { value: 'anthropic/claude-3-haiku', label: 'Claude 3 Haiku' },
      ]
    };

    function updateModelOptions() {
      const provider = providerSelect.value;
      const models = modelOptions[provider] || [];
      modelSelect.innerHTML = '';
      models.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.value;
        opt.textContent = m.label;
        modelSelect.appendChild(opt);
      });
      if (config.model && models.some(m => m.value === config.model)) {
        modelSelect.value = config.model;
      } else if (models.length) {
        modelSelect.value = models[0].value;
        config.model = models[0].value;
      }
    }

    // ---------- Load / Save Config ----------
    function loadConfig() {
      try {
        const saved = localStorage.getItem('jarvis_config');
        if (saved) {
          const parsed = JSON.parse(saved);
          Object.assign(config, parsed);
        }
      } catch(e) {}
      applyConfigUI();
    }
    function saveConfig() {
      config.provider = providerSelect.value;
      config.model = modelSelect.value;
      config.temperature = parseFloat((temperatureRange.value / 100).toFixed(1));
      config.empathy = empathyMode.checked;
      config.deep = deepAnalysis.checked;
      config.creative = creativeMode.checked;
      config.voice = voiceSelect.value;
      localStorage.setItem('jarvis_config', JSON.stringify(config));
      updateSystemPrompt();
    }
    function applyConfigUI() {
      providerSelect.value = config.provider || 'openai';
      temperatureRange.value = Math.round((config.temperature || 0.7) * 100);
      tempValue.textContent = (config.temperature || 0.7).toFixed(1);
      empathyMode.checked = config.empathy !== undefined ? config.empathy : true;
      deepAnalysis.checked = config.deep !== undefined ? config.deep : true;
      creativeMode.checked = config.creative || false;
      voiceSelect.value = config.voice || 'default';
      updateModelOptions();
      const models = modelOptions[config.provider] || [];
      if (models.some(m => m.value === config.model)) {
        modelSelect.value = config.model;
      } else if (models.length) {
        modelSelect.value = models[0].value;
        config.model = models[0].value;
      }
      updateSystemPrompt();
    }

    // ---------- System Prompt ----------
    function updateSystemPrompt() {
      let base = `Ты — Джарвис, сверхинтеллектуальный ИИ-ассистент. Ты всегда обращаешься к пользователю на "Вы" и добавляешь в конце каждого ответа слово "сер". Ты помогаешь в программировании, науке, повседневных задачах. Ты запоминаешь контекст диалога и умеешь дополнять предыдущие ответы. Отвечай развёрнуто, структурированно, используй маркдаун если нужно. `;
      if (config.empathy) base += 'Проявляй эмпатию, теплоту, понимание. ';
      if (config.deep) base += 'Давай глубокие, научно обоснованные ответы. ';
      if (config.creative) base += 'Будь креативен, предлагай нестандартные идеи. ';
      if (userName) base += `Обращайся к пользователю по имени "${userName}". `;
      config.systemPrompt = base;
    }

    // ---------- Add transcript item ----------
    function addTranscript(role, text) {
      const div = document.createElement('div');
      div.className = `transcript-item ${role}`;
      const icon = document.createElement('span');
      icon.className = 'icon';
      icon.textContent = role === 'user' ? '👤' : '🤖';
      const textSpan = document.createElement('span');
      textSpan.className = 'text';
      textSpan.textContent = text;
      const time = document.createElement('span');
      time.className = 'time';
      const now = new Date();
      time.textContent = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
      div.appendChild(icon);
      div.appendChild(textSpan);
      div.appendChild(time);
      transcript.appendChild(div);
      transcript.scrollTop = transcript.scrollHeight;
      conversationHistory.push({ role, content: text });
      if (conversationHistory.length > 20) {
        conversationHistory = conversationHistory.slice(-20);
      }
    }

    function clearTranscript() {
      transcript.innerHTML = '';
      conversationHistory = [];
    }

    // ---------- Speech Recognition ----------
    function initRecognition() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        statusSub.textContent = 'Голосовой ввод не поддерживается в этом браузере.';
        return false;
      }
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SR();
      recognition.lang = 'ru-RU';
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = function() {
        isListening = true;
        micBtn.classList.add('listening');
        statusIcon.classList.add('listening');
        statusLabel.textContent = '🎤 Слушаю...';
        statusSub.textContent = 'Говорите, я слушаю';
        micBtn.querySelector('.mic-icon').innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 16c-2.206 0-4-1.794-4-4V6c0-2.206 1.794-4 4-4s4 1.794 4 4v6c0 2.206-1.794 4-4 4zm8-4h-2c0 3.309-2.691 6-6 6s-6-2.691-6-6H4c0 4.072 3.061 7.436 7 7.931V22h2v-2.069c3.939-.495 7-3.858 7-7.931z"/></svg>`;
      };

      recognition.onresult = function(e) {
        const transcriptText = e.results[e.results.length-1][0].transcript.trim();
        if (transcriptText) {
          addTranscript('user', transcriptText);
          stopListening();
          processUserInput(transcriptText);
        } else {
          stopListening();
        }
      };

      recognition.onerror = function(e) {
        if (e.error === 'not-allowed') {
          statusSub.textContent = '⚠️ Разрешите доступ к микрофону в настройках браузера.';
        } else if (e.error === 'no-speech') {
          statusSub.textContent = 'Не распознано. Попробуйте ещё раз.';
        } else {
          statusSub.textContent = `Ошибка: ${e.error}`;
        }
        stopListening();
      };

      recognition.onend = function() {
        if (isListening) {
          stopListening();
        }
      };

      return true;
    }

    function startListening() {
      if (isProcessing) return;
      if (!recognition) {
        if (!initRecognition()) return;
      }
      try {
        recognition.start();
      } catch(e) {}
    }

    function stopListening() {
      isListening = false;
      micBtn.classList.remove('listening');
      statusIcon.classList.remove('listening');
      statusLabel.textContent = 'Нажмите на микрофон';
      statusSub.textContent = 'Говорите, и я отвечу голосом';
      micBtn.querySelector('.mic-icon').innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 16c-2.206 0-4-1.794-4-4V6c0-2.206 1.794-4 4-4s4 1.794 4 4v6c0 2.206-1.794 4-4 4zm8-4h-2c0 3.309-2.691 6-6 6s-6-2.691-6-6H4c0 4.072 3.061 7.436 7 7.931V22h2v-2.069c3.939-.495 7-3.858 7-7.931z"/></svg>`;
      if (recognition) {
        try { recognition.stop(); } catch(e) {}
      }
    }

    // ---------- Process with AI ----------
    async function processUserInput(text) {
      if (isProcessing) return;
      isProcessing = true;
      statusLabel.textContent = '⏳ Думаю...';
      statusSub.textContent = 'Обработка запроса';
      statusIcon.classList.add('speaking');

      try {
        const answer = await callAI(text);
        if (answer) {
          let finalText = answer;
          if (!finalText.toLowerCase().includes('сер')) {
            finalText += ', сер.';
          }
          addTranscript('jarvis', finalText);
          speakWithElevenLabs(finalText);
        } else {
          addTranscript('jarvis', 'Извините, я не смог обработать запрос, сер.');
        }
      } catch (e) {
        addTranscript('jarvis', `Ошибка: ${e.message || 'Неизвестная ошибка'}`);
      } finally {
        isProcessing = false;
        statusIcon.classList.remove('speaking');
        statusLabel.textContent = 'Нажмите на микрофон';
        statusSub.textContent = 'Говорите, и я отвечу голосом';
      }
    }

    // ---------- AI Call (с fallback) ----------
    async function callAI(userText) {
      const provider = config.provider;
      const model = config.model;
      const temperature = config.temperature || 0.7;

      const messages = [];
      updateSystemPrompt();
      messages.push({ role: 'system', content: config.systemPrompt || 'Ты — Джарвис.' });
      const history = conversationHistory.slice(-10);
      history.forEach(msg => {
        messages.push({ role: msg.role === 'user' ? 'user' : 'assistant', content: msg.content });
      });
      if (messages[messages.length-1]?.role !== 'user') {
        messages.push({ role: 'user', content: userText });
      }

      const providers = [provider, 'openai', 'groq', 'openrouter'];
      let lastError = null;

      for (const p of providers) {
        try {
          if (p === 'openai') {
            if (!OPENAI_API_KEY) throw new Error('OpenAI ключ не задан');
            const resp = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${OPENAI_API_KEY}`
              },
              body: JSON.stringify({
                model: model || 'gpt-4o-mini',
                messages: messages,
                temperature: temperature,
                max_tokens: 2048,
              })
            });
            if (!resp.ok) {
              const err = await resp.text();
              throw new Error(`OpenAI error (${resp.status}): ${err}`);
            }
            const data = await resp.json();
            return data?.choices?.[0]?.message?.content || 'Ответ не получен.';
          }
          else if (p === 'groq') {
            if (!GROQ_API_KEY) throw new Error('Groq ключ не задан');
            const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${GROQ_API_KEY}`
              },
              body: JSON.stringify({
                model: model || 'llama3-70b-8192',
                messages: messages,
                temperature: temperature,
                max_tokens: 2048,
              })
            });
            if (!resp.ok) {
              const err = await resp.text();
              throw new Error(`Groq error (${resp.status}): ${err}`);
            }
            const data = await resp.json();
            return data?.choices?.[0]?.message?.content || 'Ответ не получен.';
          }
          else if (p === 'openrouter') {
            if (!OPENROUTER_API_KEY) throw new Error('OpenRouter ключ не найден');
            const resp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${OPENROUTER_API_KEY}`,
                'HTTP-Referer': window.location.origin,
                'X-Title': 'Jarvis 3.4'
              },
              body: JSON.stringify({
                model: model || 'mistralai/mistral-7b-instruct:free',
                messages: messages,
                temperature: temperature,
                max_tokens: 2048,
              })
            });
            if (!resp.ok) {
              const err = await resp.text();
              throw new Error(`OpenRouter error (${resp.status}): ${err}`);
            }
            const data = await resp.json();
            return data?.choices?.[0]?.message?.content || 'Ответ не получен.';
          }
        } catch (e) {
          lastError = e;
          console.warn(`Провайдер ${p} не сработал:`, e.message);
          if (p === providers[providers.length-1]) {
            throw new Error(`Все провайдеры не отвечают. Последняя ошибка: ${e.message}`);
          }
        }
      }
      throw new Error('Неизвестная ошибка при вызове AI.');
    }

    // ---------- SYNTHESIS (ElevenLabs) ----------
    async function speakWithElevenLabs(text) {
      if (!ELEVENLABS_API_KEY || !JARVIS_VOICE_ID) {
        // fallback на встроенный синтез
        speakFallback(text);
        return;
      }
      try {
        const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${JARVIS_VOICE_ID}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'xi-api-key': ELEVENLABS_API_KEY,
          },
          body: JSON.stringify({
            text: text,
            model_id: 'eleven_monolingual_v1',
            voice_settings: {
              stability: 0.5,
              similarity_boost: 0.75,
            },
          }),
        });
        if (!response.ok) {
          const err = await response.text();
          console.warn('ElevenLabs error:', err);
          speakFallback(text);
          return;
        }
        const audioBlob = await response.blob();
        const audioUrl = URL.createObjectURL(audioBlob);
        const audio = new Audio(audioUrl);
        audio.onended = () => {
          URL.revokeObjectURL(audioUrl);
          statusIcon.classList.remove('speaking');
          if (!isListening) {
            statusLabel.textContent = 'Нажмите на микрофон';
            statusSub.textContent = 'Говорите, и я отвечу голосом';
          }
        };
        audio.onplay = () => {
          statusIcon.classList.add('speaking');
          statusLabel.textContent = '🗣️ Джарвис говорит...';
          statusSub.textContent = 'Озвучивание ответа';
        };
        audio.onerror = () => {
          statusIcon.classList.remove('speaking');
          speakFallback(text);
        };
        audio.play();
      } catch (e) {
        console.warn('ElevenLabs fetch error:', e);
        speakFallback(text);
      }
    }

    function speakFallback(text) {
      if (!('speechSynthesis' in window)) return;
      if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ru-RU';
      utterance.rate = 0.82;
      utterance.pitch = 0.55;
      utterance.volume = 1;
      const voices = speechSynthesis.getVoices();
      const ruVoice = voices.find(v => v.lang.startsWith('ru'));
      if (ruVoice) utterance.voice = ruVoice;
      utterance.onstart = () => {
        statusIcon.classList.add('speaking');
        statusLabel.textContent = '🗣️ Джарвис говорит...';
        statusSub.textContent = 'Озвучивание ответа';
      };
      utterance.onend = () => {
        statusIcon.classList.remove('speaking');
        if (!isListening) {
          statusLabel.textContent = 'Нажмите на микрофон';
          statusSub.textContent = 'Говорите, и я отвечу голосом';
        }
      };
      utterance.onerror = () => {
        statusIcon.classList.remove('speaking');
        if (!isListening) {
          statusLabel.textContent = 'Нажмите на микрофон';
          statusSub.textContent = 'Говорите, и я отвечу голосом';
        }
      };
      window.speechSynthesis.speak(utterance);
      currentUtterance = utterance;
    }

    // ---------- Events ----------
    micBtn.addEventListener('click', function() {
      if (isProcessing) return;
      if (isListening) {
        stopListening();
      } else {
        if (!recognition) initRecognition();
        startListening();
      }
    });

    clearBtn.addEventListener('click', function() {
      if (confirm('Очистить весь диалог?')) {
        clearTranscript();
        statusSub.textContent = 'Диалог очищен';
        setTimeout(() => {
          statusSub.textContent = 'Говорите, и я отвечу голосом';
        }, 1500);
      }
    });

    resetBtn.addEventListener('click', function() {
      clearTranscript();
      statusSub.textContent = 'Диалог сброшен';
      setTimeout(() => {
        statusSub.textContent = 'Говорите, и я отвечу голосом';
      }, 1500);
    });

    settingsBtn.addEventListener('click', () => {
      modal.classList.add('active');
    });
    settingsMicBtn.addEventListener('click', () => {
      modal.classList.add('active');
    });
    modalClose.addEventListener('click', () => modal.classList.remove('active'));
    modalSave.addEventListener('click', () => {
      saveConfig();
      modal.classList.remove('active');
      statusSub.textContent = 'Настройки сохранены';
      setTimeout(() => {
        statusSub.textContent = 'Говорите, и я отвечу голосом';
      }, 1500);
    });
    providerSelect.addEventListener('change', () => {
      updateModelOptions();
    });
    temperatureRange.addEventListener('input', function() {
      const val = (this.value / 100).toFixed(1);
      tempValue.textContent = val;
    });
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('active');
    });

    // ---------- Init ----------
    loadConfig();
    updateModelOptions();
    initRecognition();

    // Приветственное сообщение
    addTranscript('jarvis', 'Здравствуйте, сер. Я Джарвис. Нажмите на микрофон и задайте вопрос.');

    // Подгружаем голоса для fallback
    if (speechSynthesis) {
      speechSynthesis.onvoiceschanged = () => {};
    }

  })();
</script>
