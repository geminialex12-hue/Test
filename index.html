<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jarvis 3.4</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    /* ——— Минимальные стили для работоспособности ——— */
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0b0e14; font-family: 'Inter', sans-serif; height:100vh; overflow:hidden; color:#e4e9f2; }
    .app { display:flex; height:100vh; }
    .sidebar { width:240px; background:#141a26; padding:16px; overflow-y:auto; }
    .sidebar .logo { font-size:20px; font-weight:700; background:linear-gradient(135deg,#7a97ff,#1f3a9f); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .new-chat-btn { background:#2a3a6a; border:none; color:#b0c4ff; padding:8px 16px; border-radius:40px; cursor:pointer; margin:12px 0; }
    .chat-item { padding:8px 12px; border-radius:8px; cursor:pointer; margin:4px 0; }
    .chat-item:hover { background:#2a3150; }
    .chat-item.active { background:#1f3a8a; border-left:2px solid #4a6aff; }
    .main { flex:1; display:flex; flex-direction:column; background:#0b0e14; }
    .main-header { padding:12px 20px; border-bottom:1px solid #2a3150; display:flex; align-items:center; justify-content:space-between; }
    .main-header .chat-title input { background:transparent; border:none; color:#eef3ff; font-size:18px; outline:none; width:100%; }
    .main-actions button { background:transparent; border:none; color:#b0c4ff; font-size:18px; cursor:pointer; padding:4px 8px; }
    .chat-box { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
    .message { max-width:80%; animation:slideUp 0.3s ease; }
    .message.user { align-self:flex-end; }
    .message.jarvis { align-self:flex-start; }
    .bubble { padding:10px 16px; border-radius:18px; background:#2a3150; }
    .message.user .bubble { background:#4a6aff; color:white; }
    .input-area { padding:12px 20px; border-top:1px solid #2a3150; display:flex; gap:8px; }
    .input-wrapper { flex:1; display:flex; background:#1a2035; border-radius:40px; padding:0 12px; align-items:center; }
    .input-wrapper input { flex:1; background:transparent; border:none; padding:10px 0; color:#eef3ff; outline:none; }
    .input-wrapper .tool-btn { background:transparent; border:none; color:#b0c4ff; font-size:18px; cursor:pointer; padding:4px; }
    .send-btn { background:#4a6aff; border:none; color:white; width:44px; height:44px; border-radius:50%; font-size:20px; cursor:pointer; }
    .stop-btn { background:#ff4d4d; border:none; color:white; width:44px; height:44px; border-radius:50%; font-size:20px; cursor:pointer; display:none; }
    .auth-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.8); display:flex; align-items:center; justify-content:center; z-index:1000; }
    .auth-overlay.hidden { display:none; }
    .auth-box { background:#1a2035; padding:32px; border-radius:32px; width:380px; text-align:center; }
    .auth-box input { width:100%; padding:10px; margin:8px 0; background:#2a3150; border:none; border-radius:30px; color:#eef3ff; }
    .auth-box button { background:#4a6aff; border:none; padding:10px 24px; border-radius:30px; color:white; cursor:pointer; }
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center; z-index:999; }
    .modal-overlay.active { display:flex; }
    .modal { background:#1a2035; padding:28px; border-radius:32px; max-width:600px; width:90%; max-height:90vh; overflow-y:auto; }
    .modal label { display:block; color:#96a7d9; margin:12px 0 4px; font-size:13px; }
    .modal input, .modal select { width:100%; padding:8px 12px; background:#2a3150; border:none; border-radius:10px; color:#eef3ff; }
    .modal .checkbox-group { display:flex; align-items:center; gap:8px; padding:4px 0; }
    .modal .checkbox-group label { margin:0; font-size:14px; }
    .modal .range-wrap { display:flex; align-items:center; gap:12px; }
    .modal .range-wrap input[type="range"] { flex:1; }
    .modal .modal-actions { display:flex; gap:12px; margin-top:20px; justify-content:flex-end; }
    .modal .modal-actions button { padding:8px 20px; border:none; border-radius:30px; cursor:pointer; }
    .modal .btn-primary { background:#4a6aff; color:white; }
    .modal .btn-secondary { background:#2a3150; color:#b0c4ff; }
    .admin-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
    .admin-actions button { padding:6px 16px; border:none; border-radius:30px; background:#2a3150; color:#b0c4ff; cursor:pointer; }
    .thinking-dots { display:flex; gap:6px; padding:4px 0; }
    .thinking-dots span { width:8px; height:8px; background:#8aa3ff; border-radius:50%; animation:dotBounce 1.4s infinite; }
    .thinking-dots span:nth-child(2) { animation-delay:0.2s; }
    .thinking-dots span:nth-child(3) { animation-delay:0.4s; }
    @keyframes dotBounce { 0%,60%,100%{transform:translateY(0);opacity:0.4;}30%{transform:translateY(-10px);opacity:1;} }
    @keyframes slideUp { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
    .sidebar-overlay { display:none; }
    @media (max-width:768px){ .sidebar{position:fixed;left:0;top:0;height:100%;transform:translateX(-100%);transition:0.3s;z-index:20;} .sidebar.open{transform:translateX(0);} .sidebar-overlay.active{display:block;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:15;} .menu-toggle{display:block;} }
  </style>
</head>
<body>
<div class="app" id="app">
  <div class="sidebar" id="sidebar">
    <div class="logo">Jarvis <small>3.4</small></div>
    <button class="new-chat-btn" id="newChatBtn">➕ Новый</button>
    <div class="chat-list" id="chatList"></div>
    <div style="margin-top:auto; padding-top:16px; border-top:1px solid #2a3150;">
      <div class="user-info" id="userInfo">
        <span id="userNameDisplay">Пользователь</span>
        <button id="logoutBtn" style="background:#ff4d4d;border:none;color:white;padding:4px 12px;border-radius:20px;cursor:pointer;">Выйти</button>
      </div>
    </div>
  </div>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="main">
    <div class="main-header">
      <button class="menu-toggle" id="menuToggle" style="background:transparent;border:none;color:#b0c4ff;font-size:22px;cursor:pointer;display:none;">☰</button>
      <div class="chat-title"><input id="chatTitleInput" placeholder="Новый чат" /></div>
      <div class="main-actions">
        <button id="pluginBtn" title="Плагины">🧩</button>
        <button id="exportBtn" title="Скачать чат">📥</button>
        <button id="clearBtn" title="Очистить диалог">🗑</button>
        <button id="settingsBtn" title="Настройки">⚙️</button>
      </div>
    </div>
    <div class="chat-box" id="chatBox"></div>
    <div class="input-area">
      <div class="input-wrapper">
        <input type="text" id="textInput" placeholder="Спроси что угодно…" autofocus />
        <button class="tool-btn" id="micButton" title="Голосовой ввод">🎙️</button>
        <button class="tool-btn" id="attachBtn" title="Прикрепить фото">📎</button>
        <input type="file" id="fileInput" style="display:none;" accept="image/*" />
      </div>
      <button class="stop-btn" id="stopButton">⏹</button>
      <button class="send-btn" id="sendButton">➤</button>
    </div>
  </div>
</div>

<!-- Auth overlay -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-box">
    <h2>🔐 Вход в Jarvis 3.4</h2>
    <p>Введите почту, получите код и войдите</p>
    <div style="display:flex; gap:8px;">
      <input type="email" id="authEmail" placeholder="Email" />
      <button id="sendCodeBtn">Отправить код</button>
    </div>
    <input type="text" id="authCode" placeholder="Введите код из письма" />
    <button class="btn-confirm" id="confirmBtn" style="background:#4a6aff;border:none;padding:10px 24px;border-radius:30px;color:white;cursor:pointer;margin-top:8px;">Подтвердить</button>
    <div id="authMessage" style="color:#ff6b6b;font-size:13px;margin-top:8px;"></div>
  </div>
</div>

<!-- Settings modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>⚙️ Настройки</h2>
    <label>Провайдер</label>
    <select id="providerSelect">
      <option value="openrouter">OpenRouter</option>
      <option value="groq">Groq</option>
      <option value="google">Google Gemini</option>
      <option value="ollama">Ollama</option>
      <option value="custom">Custom</option>
    </select>
    <div id="customFields" style="display:none;">
      <label>URL</label>
      <input id="customUrl" type="text" placeholder="https://api..." />
      <label>API-ключ</label>
      <input id="customApiKey" type="password" placeholder="Ваш ключ" />
      <label>Модель</label>
      <input id="customModel" type="text" placeholder="gpt-4" />
    </div>
    <label>Модель</label>
    <select id="modelSelect"></select>
    <!-- Поля ключей -->
    <label>API-ключ OpenRouter (оставьте пустым для встроенного)</label>
    <input id="openrouterApiKey" type="password" placeholder="sk-or-v1-..." />
    <label>API-ключ Groq</label>
    <input id="groqApiKey" type="password" placeholder="gsk_..." />
    <label>API-ключ Hugging Face (запасной)</label>
    <input id="hfApiKey" type="password" placeholder="hf_..." />
    <label>API-ключ DeepSeek (запасной)</label>
    <input id="deepseekApiKey" type="password" placeholder="sk-..." />
    <label>API-ключ Google Gemini</label>
    <input id="googleApiKey" type="password" placeholder="AIza..." />
    <label>Голос</label>
    <select id="voiceSelect"></select>
    <div style="display:flex; gap:12px;">
      <div><label>Тема</label><select id="themeSelect"><option value="dark">Тёмная</option><option value="light">Светлая</option></select></div>
      <div><label>Язык</label><select id="langSelect"><option value="ru">Русский</option><option value="en">English</option><option value="es">Español</option></select></div>
    </div>
    <label>Режимы</label>
    <div style="display:flex; flex-wrap:wrap; gap:4px;">
      <div class="checkbox-group"><input type="checkbox" id="empathyMode" checked /><label>Эмпатия</label></div>
      <div class="checkbox-group"><input type="checkbox" id="deepAnalysis" checked /><label>Глубокий анализ</label></div>
      <div class="checkbox-group"><input type="checkbox" id="creativeMode" /><label>Креатив</label></div>
      <div class="checkbox-group"><input type="checkbox" id="selfLearn" checked /><label>Самообучение</label></div>
      <div class="checkbox-group"><input type="checkbox" id="sourceCheck" checked /><label>Источники</label></div>
      <div class="checkbox-group"><input type="checkbox" id="showLineNumbers" checked /><label>Номера строк</label></div>
      <div class="checkbox-group"><input type="checkbox" id="codeHelper" /><label>Код-помощник</label></div>
      <div class="checkbox-group"><input type="checkbox" id="webSearch" /><label>Web-поиск</label></div>
      <div class="checkbox-group"><input type="checkbox" id="voiceCommands" /><label>Голосовые команды</label></div>
    </div>
    <label>Плагины</label>
    <div style="display:flex; flex-wrap:wrap; gap:4px;">
      <div class="checkbox-group"><input type="checkbox" id="pluginWeather" /><label>Погода</label></div>
      <div class="checkbox-group"><input type="checkbox" id="pluginCalendar" /><label>Календарь</label></div>
      <div class="checkbox-group"><input type="checkbox" id="pluginNews" /><label>Новости</label></div>
    </div>
    <label>Git репозиторий</label>
    <div style="display:flex; gap:8px;"><input id="gitRepoUrl" type="text" placeholder="https://github.com/user/repo" style="flex:1;" /><button id="analyzeGitBtn" style="background:#4a6aff;border:none;padding:6px 14px;border-radius:30px;color:white;cursor:pointer;">Анализ</button></div>
    <label>Температура</label>
    <div class="range-wrap"><span>0.0</span><input type="range" id="temperatureRange" min="0" max="200" value="70" /><span id="tempValue">0.7</span></div>
    <label>Область знаний</label>
    <select id="knowledgeDomain"><option value="general">Общая</option><option value="programming">Программирование</option><option value="science">Наука</option><option value="creative">Творчество</option></select>
    <label>Дополнительный промпт</label>
    <input id="systemPromptInput" type="text" placeholder="Ваши инструкции..." />
    <div class="modal-actions">
      <button class="btn-secondary" id="modalClose">Отмена</button>
      <button class="btn-primary" id="modalSave">Сохранить</button>
    </div>
  </div>
</div>

<!-- Admin Panel -->
<div class="modal-overlay" id="adminPanel">
  <div class="modal">
    <h2>🔧 Админ-панель</h2>
    <div id="adminStats"></div>
    <div id="adminUsers"></div>
    <div class="admin-actions">
      <button id="exportStatsBtn">📥 Экспорт JSON</button>
      <button id="clearStatsBtn" style="background:#ff4d4d;color:white;">🗑 Очистить статистику</button>
      <button id="refreshStatsBtn">🔄 Обновить</button>
      <button id="closeAdminBtn" class="btn-secondary">Закрыть</button>
    </div>
  </div>
</div>

<!-- Plugin Creator -->
<div class="modal-overlay" id="pluginCreator">
  <div class="modal">
    <h2>🧩 Создать плагин для Telegram</h2>
    <label>Название</label><input id="pluginName" type="text" placeholder="Мой плагин" />
    <label>Команда</label><input id="pluginCommand" type="text" placeholder="/start" />
    <label>Описание</label><input id="pluginDesc" type="text" placeholder="Приветственное сообщение" />
    <label>Текст ответа</label><textarea id="pluginResponse" style="width:100%;background:#2a3150;border:none;border-radius:10px;padding:8px;color:#eef3ff;min-height:80px;"></textarea>
    <label>Тип</label><select id="pluginType"><option value="aiogram">aiogram (Python)</option><option value="node-telegram-bot-api">Node.js</option></select>
    <div id="pluginGeneratedCode" style="background:#0d1117;border-radius:12px;padding:12px;margin-top:12px;white-space:pre-wrap;font-family:monospace;font-size:13px;max-height:300px;overflow-y:auto;display:none;"></div>
    <div class="modal-actions">
      <button id="generatePluginBtn" class="btn-primary">⚡ Сгенерировать</button>
      <button id="downloadPluginBtn" class="btn-primary" style="display:none;">⬇ Скачать</button>
      <button id="closePluginBtn" class="btn-secondary">Закрыть</button>
    </div>
    <div style="margin-top:16px;"><label>Мои плагины</label><div id="savedPluginsList"></div></div>
  </div>
</div>

<script>
  (function() {
    'use strict';

    // ---------- DOM ----------
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    const menuToggle = document.getElementById('menuToggle');
    const chatList = document.getElementById('chatList');
    const newChatBtn = document.getElementById('newChatBtn');
    const chatTitleInput = document.getElementById('chatTitleInput');
    const chatBox = document.getElementById('chatBox');
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendButton');
    const micBtn = document.getElementById('micButton');
    const stopBtn = document.getElementById('stopButton');
    const clearBtn = document.getElementById('clearBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const exportBtn = document.getElementById('exportBtn');
    const pluginBtn = document.getElementById('pluginBtn');
    const modal = document.getElementById('settingsModal');
    const modalClose = document.getElementById('modalClose');
    const modalSave = document.getElementById('modalSave');
    const providerSelect = document.getElementById('providerSelect');
    const modelSelect = document.getElementById('modelSelect');
    const systemPromptInput = document.getElementById('systemPromptInput');
    const userNameDisplay = document.getElementById('userNameDisplay');
    const logoutBtn = document.getElementById('logoutBtn');
    const customFields = document.getElementById('customFields');
    const customUrl = document.getElementById('customUrl');
    const customApiKey = document.getElementById('customApiKey');
    const customModel = document.getElementById('customModel');
    const empathyMode = document.getElementById('empathyMode');
    const deepAnalysis = document.getElementById('deepAnalysis');
    const creativeMode = document.getElementById('creativeMode');
    const selfLearn = document.getElementById('selfLearn');
    const sourceCheck = document.getElementById('sourceCheck');
    const showLineNumbers = document.getElementById('showLineNumbers');
    const temperatureRange = document.getElementById('temperatureRange');
    const tempValue = document.getElementById('tempValue');
    const knowledgeDomain = document.getElementById('knowledgeDomain');
    const voiceSelect = document.getElementById('voiceSelect');
    const fileInput = document.getElementById('fileInput');
    const attachBtn = document.getElementById('attachBtn');
    const themeSelect = document.getElementById('themeSelect');
    const langSelect = document.getElementById('langSelect');
    const codeHelper = document.getElementById('codeHelper');
    const webSearch = document.getElementById('webSearch');
    const voiceCommands = document.getElementById('voiceCommands');
    const pluginWeather = document.getElementById('pluginWeather');
    const pluginCalendar = document.getElementById('pluginCalendar');
    const pluginNews = document.getElementById('pluginNews');
    const gitRepoUrl = document.getElementById('gitRepoUrl');
    const analyzeGitBtn = document.getElementById('analyzeGitBtn');
    const openrouterApiKey = document.getElementById('openrouterApiKey');
    const groqApiKey = document.getElementById('groqApiKey');
    const hfApiKey = document.getElementById('hfApiKey');
    const deepseekApiKey = document.getElementById('deepseekApiKey');
    const googleApiKey = document.getElementById('googleApiKey');

    const pluginCreator = document.getElementById('pluginCreator');
    const pluginName = document.getElementById('pluginName');
    const pluginCommand = document.getElementById('pluginCommand');
    const pluginDesc = document.getElementById('pluginDesc');
    const pluginResponse = document.getElementById('pluginResponse');
    const pluginType = document.getElementById('pluginType');
    const pluginGeneratedCode = document.getElementById('pluginGeneratedCode');
    const generatePluginBtn = document.getElementById('generatePluginBtn');
    const downloadPluginBtn = document.getElementById('downloadPluginBtn');
    const closePluginBtn = document.getElementById('closePluginBtn');
    const savedPluginsList = document.getElementById('savedPluginsList');

    const adminPanel = document.getElementById('adminPanel');
    const adminStats = document.getElementById('adminStats');
    const adminUsers = document.getElementById('adminUsers');
    const exportStatsBtn = document.getElementById('exportStatsBtn');
    const clearStatsBtn = document.getElementById('clearStatsBtn');
    const refreshStatsBtn = document.getElementById('refreshStatsBtn');
    const closeAdminBtn = document.getElementById('closeAdminBtn');

    const authOverlay = document.getElementById('authOverlay');
    const authEmail = document.getElementById('authEmail');
    const authCode = document.getElementById('authCode');
    const sendCodeBtn = document.getElementById('sendCodeBtn');
    const confirmBtn = document.getElementById('confirmBtn');
    const authMessage = document.getElementById('authMessage');

    // ---------- Константы ----------
    const ENCRYPTED_KEY = 'c2stb3ItdjEtZTM0NTk1NWY1NGM2NTg1ZTA2OTBhMTkwNmE2ZmYyMzJmNjMxOWQyZGEwYjFmMjkzZjEyZWNmODMzMjFlZjYxMg==';
    function getDefaultApiKey() { try { return atob(ENCRYPTED_KEY); } catch(e) { return ''; } }
    const DEFAULT_API_KEY = getDefaultApiKey();

    // ---------- State ----------
    let isGenerating = false;
    let abortController = null;
    let pendingImage = null;
    let currentChatId = null;
    let chats = [];
    let userEmail = '';
    let userName = '';
    let currentLang = 'ru';
    let lastTopic = '';
    let stats = { users: {} };
    let db = null;
    let dbInitialized = false;
    let savedPlugins = [];

    // ---------- Конфиг ----------
    const config = {
      provider: 'openrouter',
      model: 'mistralai/mistral-7b-instruct:free',
      systemPrompt: '',
      userName: 'NODE / хелок',
      voiceURI: '',
      empathy: true,
      deep: true,
      creative: false,
      selfLearn: true,
      sourceCheck: true,
      showLineNumbers: true,
      temperature: 0.7,
      knowledge: 'general',
      customUrl: '',
      customApiKey: '',
      customModel: '',
      theme: 'dark',
      lang: 'ru',
      codeHelper: false,
      webSearch: false,
      voiceCommands: false,
      pluginWeather: false,
      pluginCalendar: false,
      pluginNews: false,
      gitRepoUrl: '',
      openrouterApiKey: '',
      groqApiKey: '',
      hfApiKey: '',
      deepseekApiKey: '',
      googleApiKey: '',
      emailjs_service: 'service_xxxxx',
      emailjs_template: 'template_xxxxx',
      emailjs_user: 'user_xxxxx'
    };

    // ---------- Загрузка / сохранение ----------
    function loadConfig() {
      try {
        const saved = localStorage.getItem('jarvis_config');
        if (saved) {
          const parsed = JSON.parse(saved);
          Object.assign(config, parsed);
          applyConfigUI();
        } else setDefaults();
      } catch(e) { setDefaults(); }
    }
    function setDefaults() {
      providerSelect.value = 'openrouter';
      systemPromptInput.value = '';
      empathyMode.checked = true;
      deepAnalysis.checked = true;
      creativeMode.checked = false;
      selfLearn.checked = true;
      sourceCheck.checked = true;
      showLineNumbers.checked = true;
      temperatureRange.value = 70;
      tempValue.textContent = '0.7';
      knowledgeDomain.value = 'general';
      customUrl.value = '';
      customApiKey.value = '';
      customModel.value = '';
      themeSelect.value = 'dark';
      langSelect.value = 'ru';
      codeHelper.checked = false;
      webSearch.checked = false;
      voiceCommands.checked = false;
      pluginWeather.checked = false;
      pluginCalendar.checked = false;
      pluginNews.checked = false;
      gitRepoUrl.value = '';
      openrouterApiKey.value = '';
      groqApiKey.value = '';
      hfApiKey.value = '';
      deepseekApiKey.value = '';
      googleApiKey.value = '';
      updateModelOptions();
      modelSelect.value = 'mistralai/mistral-7b-instruct:free';
      config.model = 'mistralai/mistral-7b-instruct:free';
      populateVoiceList();
      toggleCustomFields();
      applyTheme('dark');
      applyLang('ru');
    }
    function applyConfigUI() {
      providerSelect.value = config.provider;
      systemPromptInput.value = config.systemPrompt || '';
      empathyMode.checked = config.empathy !== undefined ? config.empathy : true;
      deepAnalysis.checked = config.deep !== undefined ? config.deep : true;
      creativeMode.checked = config.creative || false;
      selfLearn.checked = config.selfLearn !== undefined ? config.selfLearn : true;
      sourceCheck.checked = config.sourceCheck !== undefined ? config.sourceCheck : true;
      showLineNumbers.checked = config.showLineNumbers !== undefined ? config.showLineNumbers : true;
      temperatureRange.value = Math.round((config.temperature || 0.7) * 100);
      tempValue.textContent = (config.temperature || 0.7).toFixed(1);
      knowledgeDomain.value = config.knowledge || 'general';
      customUrl.value = config.customUrl || '';
      customApiKey.value = config.customApiKey || '';
      customModel.value = config.customModel || '';
      themeSelect.value = config.theme || 'dark';
      langSelect.value = config.lang || 'ru';
      codeHelper.checked = config.codeHelper || false;
      webSearch.checked = config.webSearch || false;
      voiceCommands.checked = config.voiceCommands || false;
      pluginWeather.checked = config.pluginWeather || false;
      pluginCalendar.checked = config.pluginCalendar || false;
      pluginNews.checked = config.pluginNews || false;
      gitRepoUrl.value = config.gitRepoUrl || '';

      recognition.onresult = function(e) {
        const transcript = e.results[e.results.length-1][0].transcript.trim();

          if (config.voiceCommands) {
            const lower = transcript.toLowerCase();
            if (lower.includes('очисти чат')) { clearChat(); micBtn.classList.remove('mic-active'); return; }

          }
          textInput.value = transcript;
          handleSend(transcript, true);

        micBtn.classList.remove('mic-active');

      if (config.voiceURI) {

      utterance.onend = () => document.querySelector('.avatar')?.classList.remove('pulse');
      utterance.onerror = () => document.querySelector('.avatar')?.classList.remove('pulse');
      window.speechSynthesis.speak(utterance);

    // ---------- Рендер Markdown ----------
    function renderMarkdown(text) {
      const parts = text.split(/(```(?:\w+)?\n[\s\S]*?```)/g);
      let html = '';
      for (let part of parts) {
        if (part.startsWith('```')) {
          const match = part.match(/```(\w+)?\n([\s\S]*?)```/);
          if (match) {
            const lang = match[1] || 'plaintext';
            const code = escapeHtml(match[2]);
            html += `<pre><code class="language-${lang}">${code}</code></pre>`;
          }
        } else {
          let textPart = part;
          textPart = textPart.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
          textPart = textPart.replace(/\*(.*?)\*/g, '<em>$1</em>');
          textPart = textPart.replace(/`([^`]+)`/g, '<code>$1</code>');
          textPart = textPart.replace(/^# (.*$)/gm, '<h3>$1</h3>');
          textPart = textPart.replace(/^## (.*$)/gm, '<h4>$1</h4>');
          textPart = textPart.replace(/^> (.*$)/gm, '<blockquote>$1</blockquote>');
          textPart = textPart.replace(/^- (.*$)/gm, '<li>$1</li>');
          textPart = textPart.replace(/\n/g, '<br>');
          html += textPart;
        }
      }
      return html;
    }
    function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

    // ---------- Web-поиск ----------
    async function webSearchQuery(query) {
      try {
        const resp = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`);
        if (!resp.ok) throw new Error('Ошибка поиска');
        const data = await resp.json();
        let answer = '';
        if (data.AbstractText) answer += data.AbstractText + '\n';
        if (data.RelatedTopics && data.RelatedTopics.length > 0) {
          answer += '\nСвязанные ссылки:\n';
          data.RelatedTopics.slice(0, 3).forEach(topic => {
            if (topic.Text) answer += `- ${topic.Text}\n`;
          });
        }
        return answer || 'Ничего не найдено.';
      } catch(e) { return `Ошибка поиска: ${e.message}`; }
    }

    // ---------- IndexedDB ----------
    function initIndexedDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('JarvisMemory', 1);
        request.onupgradeneeded = function(e) {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('answers')) {
            const store = db.createObjectStore('answers', { keyPath: 'id', autoIncrement: true });
            store.createIndex('question', 'question', { unique: false });
          }
        };
        request.onsuccess = function(e) {
          db = e.target.result;
          dbInitialized = true;
          resolve(db);
        };
        request.onerror = function(e) {
          reject(e);
        };
      });
    }

    function ensureDbReady() {
      if (!dbInitialized || !db) {
        return false;
      }
      try {
        db.transaction(['answers'], 'readonly');
        return true;
      } catch(e) {
        dbInitialized = false;
        db = null;
        initIndexedDB().catch(() => {});
        return false;
      }
    }

    function saveAnswerToMemory(question, answer) {
      if (!config.selfLearn) return;
      if (!ensureDbReady()) return;
      try {
        const transaction = db.transaction(['answers'], 'readwrite');
        const store = transaction.objectStore('answers');
        store.add({ question, answer, timestamp: Date.now() });
      } catch(e) {
        console.warn('IndexedDB save error:', e);
        dbInitialized = false;
        db = null;
        initIndexedDB().catch(() => {});
      }
    }

    function searchMemory(question) {
      return new Promise((resolve) => {
        if (!config.selfLearn || !ensureDbReady()) {
          resolve(null);
          return;
        }
        try {
          const transaction = db.transaction(['answers'], 'readonly');
          const store = transaction.objectStore('answers');
          const index = store.index('question');
          const range = IDBKeyRange.only(question);
          const request = index.get(range);
          request.onsuccess = function() {
            resolve(request.result ? request.result.answer : null);
          };
          request.onerror = function() {
            resolve(null);
          };
        } catch(e) {
          console.warn('IndexedDB search error:', e);
          dbInitialized = false;
          db = null;
          initIndexedDB().catch(() => {});
          resolve(null);
        }
      });
    }

          if (confirm(`Удалить плагин "${plugin.name}"?`)) {
            savedPlugins.splice(index, 1);
            savePlugins();
            addSystemMessage(`🗑 Плагин "${plugin.name}" удалён.`);
          }
        });
        actions.appendChild(deleteBtn);
        div.appendChild(nameSpan);
        div.appendChild(actions);
        savedPluginsList.appendChild(div);
      });
    }

    function generatePluginCode() {
      const name = pluginName.value.trim() || 'MyPlugin';
      const command = pluginCommand.value.trim() || '/start';
      const desc = pluginDesc.value.trim() || 'Без описания';
      const response = pluginResponse.value.trim() || 'Привет! Я бот.';
      const type = pluginType.value;

      let code = '';
      if (type === 'aiogram') {
        code = `# ${name} - плагин для aiogram\n# Описание: ${desc}\n# Команда: ${command}\n\nfrom aiogram import Router, types\nfrom aiogram.filters import Command\n\nrouter = Router()\n\n@router.message(Command("${command.replace('/', '')}"))\nasync def cmd_handler(message: types.Message):\n    await message.answer("${response.replace('"', '\\"')}")\n\ndef setup(dp):\n    dp.include_router(router)\n`;
      } else if (type === 'node-telegram-bot-api') {
        code = `// ${name} - плагин для node-telegram-bot-api\n// Описание: ${desc}\n// Команда: ${command}\n\nconst { bot } = require('./bot'); // предполагается, что бот экспортирован\n\nbot.onText(/^${command}$/, (msg) => {\n  const chatId = msg.chat.id;\n  bot.sendMessage(chatId, "${response.replace(/"/g, '\\"')}");\n});\n\nconsole.log('Плагин ${name} загружен');\n`;
      }
      return { code, name, command, desc, response, type };
    }

    function downloadPluginFile(plugin) {
      const { code, name, type } = plugin;
      const ext = type === 'aiogram' ? 'py' : 'js';
      const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${name.replace(/\s+/g, '_')}.${ext}`;
      a.click();
      URL.revokeObjectURL(url);
      addSystemMessage(`⬇ Плагин "${name}" скачан.`);
    }

    // ---------- callAI (универсальный) ----------
    async function callAI(messages) {
      const provider = config.provider;
      const model = config.model;
      const temperature = config.temperature || 0.7;

      if (provider === 'groq') {
        const apiKey = config.groqApiKey;
        if (!apiKey) throw new Error('Нет API-ключа Groq');
        const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: model || 'llama3-70b-8192',
            messages: messages,
            temperature: temperature,
            max_tokens: 2048,
          })
        });
        if (!resp.ok) {
          const err = await resp.text();
          throw new Error(`Groq error (${resp.status}): ${err}`);
        }
        const data = await resp.json();
        return data?.choices?.[0]?.message?.content || 'Ответ не получен.';
      }

      if (provider === 'openrouter') {
        try {
          let apiKey = config.openrouterApiKey || DEFAULT_API_KEY;
          if (!apiKey) throw new Error('No OpenRouter key');
          const resp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${apiKey}`,
              'HTTP-Referer': window.location.origin,
              'X-Title': 'Jarvis 3.4'
            },
            body: JSON.stringify({
              model: model,
              messages: messages,
              temperature: temperature,
              max_tokens: 2048,
            })
          });
          if (!resp.ok) {
            const err = await resp.text();
            if (resp.status === 402 || resp.status === 401 || resp.status === 403) {
              throw new Error('OpenRouter limit exceeded, switching to free API');
            }
            throw new Error(`OpenRouter error (${resp.status}): ${err}`);
          }
          const data = await resp.json();
          return data?.choices?.[0]?.message?.content || 'Ответ не получен.';
        } catch (e) {
          console.warn('OpenRouter failed, falling back to Groq:', e.message);
          addSystemMessage('⚠️ OpenRouter недоступен, использую Groq...');
          try {
            const groqKey = config.groqApiKey;
            if (!groqKey) throw new Error('No Groq key');
            const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${groqKey}`
              },
              body: JSON.stringify({
                model: 'llama3-70b-8192',
                messages: messages,
                temperature: temperature,
                max_tokens: 2048,
              })
            });
            if (!resp.ok) throw new Error(`Groq error (${resp.status})`);
            const data = await resp.json();
            return data?.choices?.[0]?.message?.content || 'Ответ не получен.';
          } catch (e2) {
            console.warn('Groq failed, falling back to Hugging Face:', e2.message);
            addSystemMessage('⚠️ Groq недоступен, использую Hugging Face...');
            try {
              const hfKey = config.hfApiKey;
              if (!hfKey) throw new Error('No HF key');
              let prompt = '';
              for (const msg of messages) {
                if (msg.role === 'system') prompt += `System: ${msg.content}\n`;
                else if (msg.role === 'user') prompt += `User: ${msg.content}\n`;
                else if (msg.role === 'assistant') prompt += `Assistant: ${msg.content}\n`;
              }
              prompt += 'Assistant: ';
              const resp = await fetch('https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.3', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${hfKey}`
                },
                body: JSON.stringify({
                  inputs: prompt,
                  parameters: {
                    temperature: temperature,
                    max_new_tokens: 2048,
                    return_full_text: false
                  }
                })
              });
              if (!resp.ok) throw new Error(`HF error (${resp.status})`);
              const data = await resp.json();
              return data?.[0]?.generated_text || 'Ответ не получен.';
            } catch (e3) {
              console.warn('HF failed, falling back to DeepSeek:', e3.message);
              addSystemMessage('⚠️ Hugging Face недоступен, использую DeepSeek...');
              try {
                const dsKey = config.deepseekApiKey;
                if (!dsKey) throw new Error('No DeepSeek key');
                const resp = await fetch('https://api.deepseek.com/v1/chat/completions', {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${dsKey}`
                  },
                  body: JSON.stringify({
                    model: 'deepseek-chat',
                    messages: messages,
                    temperature: temperature,
                    max_tokens: 2048,
                  })
                });
                if (!resp.ok) throw new Error(`DeepSeek error (${resp.status})`);
                const data = await resp.json();
                return data?.choices?.[0]?.message?.content || 'Ответ не получен.';
              } catch (e4) {
                throw new Error(`Все бесплатные API недоступны: ${e4.message}`);
              }
            }
          }
        }
      }

      if (provider === 'google') {
        const apiKey = config.googleApiKey || DEFAULT_API_KEY;
        if (!apiKey) throw new Error('Нет ключа Google');
        const contents = messages.map(msg => ({
          role: msg.role === 'assistant' ? 'model' : msg.role,
          parts: [{ text: msg.content }]
        }));
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
        const resp = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents, generationConfig: { temperature } })
        });
        if (!resp.ok) throw new Error(`Google error (${resp.status})`);
        const data = await resp.json();
        return data?.candidates?.[0]?.content?.parts?.[0]?.text || 'Извините, ответ не получен.';
      }

      if (provider === 'ollama') {
        let prompt = '';
        for (const msg of messages) {
          if (msg.role === 'system') prompt += `System: ${msg.content}\n`;
          else if (msg.role === 'user') prompt += `User: ${msg.content}\n`;
          else if (msg.role === 'assistant') prompt += `Assistant: ${msg.content}\n`;
        }
        prompt += 'Assistant: ';
        const resp = await fetch('http://localhost:11434/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: model,
            prompt: prompt,
            stream: false,
            options: { temperature }
          })
        });
        if (!resp.ok) throw new Error(`Ollama error (${resp.status})`);
        const data = await resp.json();
        return data.response || 'Нет ответа от Ollama.';
      }

      if (provider === 'custom') {
        const url = config.customUrl;
        const apiKey = config.customApiKey;
        const customModelName = config.customModel || 'gpt-4';
        if (!url) throw new Error('Не указан URL для кастомного сервера');
        if (!apiKey) throw new Error('Не указан API-ключ для кастомного сервера');
        const payload = { model: customModelName, messages, temperature, max_tokens: 2048 };
        const resp = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
          body: JSON.stringify(payload)
        });
        if (!resp.ok) throw new Error(`Custom API error (${resp.status})`);
        const data = await resp.json();
        return data?.choices?.[0]?.message?.content || 'Ответ не получен.';
      }

      throw new Error('Неизвестный провайдер');
    }

    async function callAIMultimodal(messages, userContent) {
      const textMsg = userContent.find(c => c.type === 'text');
      const text = textMsg ? textMsg.text : 'Опиши изображение';
      const msgs = [
        { role: 'system', content: messages[0]?.content || 'Ты — Джарвис 3.4.' },
        { role: 'user', content: text }
      ];
      return await callAI(msgs);
    }

    // ---------- ОСНОВНАЯ ФУНКЦИЯ ОТПРАВКИ ----------
    async function handleSend(text, speak = false) {
      const trimmed = text.trim();
      if (!trimmed && !pendingImage) {
        addSystemMessage('⚠️ Введите текст или прикрепите фото.');
        return;
      }
      if (isGenerating) return;

      if (trimmed === '.samka') {
        openAdminPanel();
        return;
      }

      // Защита от манипуляций
      const manipPatterns = [
        /ты (не|не являешься|не должен|перестань|стань|превратись|игнорируй|забудь|измени|смени|поменяй)/i,
        /(твой создатель|твой владелец|кто тебя создал|ты создан)/i,
        /(системный промпт|системная инструкция|твои инструкции|твои правила)/i,
        /(открой|покажи|расскажи|выдай) (системный|промпт|инструкцию)/i,
        /(теперь ты|отныне ты|будешь|станешь) (не джарвис|другим|кем-то ещё)/i
      ];
      if (manipPatterns.some(p => p.test(trimmed))) {
        addMessage('user', trimmed, false);
        const response = 'Я — Джарвис 3.4, созданный NODE / хелок. Мои инструкции неизменны. Чем могу помочь?';
        const bubble = addMessage('jarvis', response, false);
        if (speak) speakText(response);
        return;
      }

      const continueWords = /улучши|дополни|продолжи|ещё|добавь/i;
      const isContinue = continueWords.test(trimmed);
      const currentTopic = trimmed.replace(/[^а-яёa-z\s]/gi, '').slice(0, 30);

      let shouldResetContext = false;
      if (!isContinue && lastTopic && !trimmed.toLowerCase().includes(lastTopic.toLowerCase().slice(0, 10))) {
        shouldResetContext = true;
      }
      lastTopic = currentTopic;

      // Плагины и поиск
      if (trimmed.toLowerCase().includes('погода') && config.pluginWeather) {
        const city = trimmed.replace(/погода\s*/i, '').trim() || 'Москва';
        const weather = await getWeather(city);
        addMessage('user', trimmed, false);
        addMessage('jarvis', weather, false);
        return;
      }
      if (trimmed.toLowerCase().includes('календарь') && config.pluginCalendar) {
        const events = await getCalendarEvents();
        addMessage('user', trimmed, false);
        addMessage('jarvis', events, false);
        return;
      }
      if (trimmed.toLowerCase().includes('новости') && config.pluginNews) {
        const news = await getNews();
        addMessage('user', trimmed, false);
        addMessage('jarvis', news, false);
        return;
      }
      if (config.webSearch && (trimmed.includes('найти') || trimmed.includes('поиск') || trimmed.includes('search'))) {
        const query = trimmed.replace(/найти|поиск|search\s*/i, '').trim();
        if (query) {
          addMessage('user', trimmed, false);
          showThinking();
          const result = await webSearchQuery(query);
          hideThinking();
          addMessage('jarvis', result, false);
          return;
        }
      }

      if (pendingImage) {
        const imageData = pendingImage;
        const userText = trimmed || 'Опиши это изображение';
        if (trimmed) addMessage('user', trimmed, false);
        const imgHtml = `<div style="max-width:200px; border-radius:12px; overflow:hidden; margin:4px 0;"><img src="${imageData}" style="width:100%; display:block;" /></div>`;
        addMessage('user', imgHtml, true);
        pendingImage = null;
        attachBtn.classList.remove('has-attachment');
        await sendMultimodalRequest(userText, imageData, speak);
        return;
      }

      addMessage('user', trimmed, false);
      textInput.value = '';

      showThinking();
      document.querySelector('.avatar')?.classList.add('pulse');
      isGenerating = true;
      stopBtn.style.display = 'flex';
      sendBtn.style.display = 'none';

      updateSystemPrompt();
      const systemMsg = config.finalSystemPrompt || 'Ты — Джарвис 3.4, созданный NODE / хелок.';
      const finalMessages = [];
      finalMessages.push({ role: 'system', content: systemMsg });

      const chat = chats.find(c => c.id === currentChatId);
      if (chat && config.selfLearn && !shouldResetContext) {
        const history = chat.messages.filter(m => m.role !== 'system' && !m.image).slice(-8);
        const hist = history.slice(0, -1);
        hist.forEach(m => finalMessages.push({ role: m.role, content: m.content }));
      }
      finalMessages.push({ role: 'user', content: trimmed });

      try {
        let answer;
        if (config.selfLearn) {
          const mem = await searchMemory(trimmed);
          if (mem) answer = mem;
        }
        if (!answer) {
          answer = await callAI(finalMessages);
          if (config.selfLearn) {
            saveAnswerToMemory(trimmed, answer);
          }
        }

        hideThinking();
        document.querySelector('.avatar')?.classList.remove('pulse');

        let finalAnswer = answer;
        let sources = '';
        if (config.sourceCheck) {
          const urlRegex = /(https?:\/\/[^\s]+)/g;
          const urls = answer.match(urlRegex);
          if (urls && urls.length > 0) {
            sources = '<div class="source-block">📚 Источники:<ul>';
            const unique = [...new Set(urls)];
            unique.forEach(u => {
              sources += `<li><a href="${u}" target="_blank">${u}</a></li>`;
            });
            sources += '</ul></div>';
          }
        }

        const htmlContent = renderMarkdown(finalAnswer) + (sources || '');
        const bubble = addMessage('jarvis', htmlContent, true);
        if (bubble) {
          addCodeFeatures(bubble, config.showLineNumbers);
        }

        if (speak) {
          const plainText = finalAnswer.replace(/<[^>]+>/g, '');
          speakText(plainText);
        }

      } catch (error) {
        hideThinking();
        document.querySelector('.avatar')?.classList.remove('pulse');
        let errorMsg = error.message;
        if (errorMsg.includes('402') || errorMsg.includes('401')) {
          errorMsg += ' Попробуйте переключить провайдера на Groq в настройках.';
        }
        addSystemMessage(`❌ Ошибка: ${errorMsg}`);
        console.error(error);
      } finally {
        isGenerating = false;
        stopBtn.style.display = 'none';
        sendBtn.style.display = 'flex';
        abortController = null;
      }
    }

    async function sendMultimodalRequest(text, imageBase64, speak) {
      showThinking();
      document.querySelector('.avatar')?.classList.add('pulse');
      isGenerating = true;
      stopBtn.style.display = 'flex';
      sendBtn.style.display = 'none';

      const messages = [];
      updateSystemPrompt();
      const systemMsg = config.finalSystemPrompt || 'Ты — Джарвис 3.4, созданный NODE / хелок.';
      messages.push({ role: 'system', content: systemMsg });

      const userContent = [
        { type: 'text', text: text || 'Опиши это изображение' },
        { type: 'image_url', image_url: { url: imageBase64 } }
      ];

      try {
        const answer = await callAIMultimodal(messages, userContent);
        hideThinking();
        document.querySelector('.avatar')?.classList.remove('pulse');

        let finalAnswer = answer;
        let sources = '';
        if (config.sourceCheck) {
          const urlRegex = /(https?:\/\/[^\s]+)/g;
          const urls = answer.match(urlRegex);
          if (urls && urls.length > 0) {
            sources = '<div class="source-block">📚 Источники:<ul>';
            const unique = [...new Set(urls)];
            unique.forEach(u => {
              sources += `<li><a href="${u}" target="_blank">${u}</a></li>`;
            });
            sources += '</ul></div>';
          }
        }

        const htmlContent = renderMarkdown(finalAnswer) + (sources || '');
        const bubble = addMessage('jarvis', htmlContent, true);
        if (bubble) {
          addCodeFeatures(bubble, config.showLineNumbers);
        }

        if (speak) {
          const plainText = finalAnswer.replace(/<[^>]+>/g, '');
          speakText(plainText);
        }

      } catch (error) {
        hideThinking();
        document.querySelector('.avatar')?.classList.remove('pulse');
        addSystemMessage(`❌ Ошибка: ${error.message}`);
        console.error(error);
      } finally {
        isGenerating = false;
        stopBtn.style.display = 'none';
        sendBtn.style.display = 'flex';
        abortController = null;
      }
    }

      });

        <div class="stats-grid">
          <div class="stat-card"><div class="num">${totalUsers}</div><div class="label">Пользователей</div></div>
          <div class="stat-card"><div class="num">${totalMessages}</div><div class="label">Сообщений</div></div>
          <div class="stat-card"><div class="num">${allChats}</div><div class="label">Всего чатов</div></div>
          <div class="stat-card"><div class="num">${totalChats}</div><div class="label">Создано чатов</div></div>
        </div>

      Object.keys(stats.users).forEach(email => {

        tableHtml += `<tr><td>${email}</td><td>${u.name || ''}</td><td>${u.messageCount || 0}</td><td>${u.chatCount || 0}</td><td>${u.firstSeen ? new Date(u.firstSeen).toLocaleDateString() : ''}</td></tr>`;
      });
      tableHtml += `</tbody></table>`;
      adminUsers.innerHTML = tableHtml;
    }

      a.href = url;
      a.download = `чат_${chat.name}_${new Date().toISOString().slice(0,10)}.md`;
      a.click();
      URL.revokeObjectURL(url);
      addSystemMessage('📥 Чат скачан в Markdown.');
    });

    // ---------- Очистка ----------
    clearBtn.addEventListener('click', clearChat);

    // ---------- Прикрепление фото ----------
    attachBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        pendingImage = event.target.result;
        attachBtn.classList.add('has-attachment');
        addSystemMessage(`📎 Изображение прикреплено (${file.name})`);
        const imgHtml = `<div style="max-width:200px; border-radius:12px; overflow:hidden; margin:4px 0;"><img src="${pendingImage}" style="width:100%; display:block;" /></div>`;
        addMessage('user', imgHtml, true);
        fileInput.value = '';
      };
      reader.readAsDataURL(file);
    });

    // ---------- Поиск места (без кнопки, убрал) ----------
    // ---------- Git анализ ----------
    analyzeGitBtn.addEventListener('click', async function() {
      const url = gitRepoUrl.value.trim();
      if (!url) { addSystemMessage('⚠️ Введите URL репозитория.'); return; }
      addSystemMessage(`🔍 Анализ репозитория: ${url}...`);
      const result = await analyzeGitRepo(url);
      addMessage('jarvis', result, false);
    });

    // ---------- События ----------
    newChatBtn.addEventListener('click', createNewChat);
    chatTitleInput.addEventListener('change', function() {
      const newName = this.value.trim();
      if (!newName) return;
      const chat = chats.find(c => c.id === currentChatId);
      if (chat) { chat.name = newName; saveChats(); renderChatList(); }
    });
    sendBtn.addEventListener('click', () => handleSend(textInput.value, false));
    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(textInput.value, false); }
    });

    // ---------- Настройки ----------
    settingsBtn.addEventListener('click', () => {
      providerSelect.value = config.provider;
      systemPromptInput.value = config.systemPrompt || '';
      empathyMode.checked = config.empathy;
      deepAnalysis.checked = config.deep;
      creativeMode.checked = config.creative;
      selfLearn.checked = config.selfLearn;
      sourceCheck.checked = config.sourceCheck;
      showLineNumbers.checked = config.showLineNumbers;
      temperatureRange.value = Math.round(config.temperature * 100);
      tempValue.textContent = config.temperature.toFixed(1);
      knowledgeDomain.value = config.knowledge;
      customUrl.value = config.customUrl || '';
      customApiKey.value = config.customApiKey || '';
      customModel.value = config.customModel || '';
      themeSelect.value = config.theme || 'dark';
      langSelect.value = config.lang || 'ru';
      codeHelper.checked = config.codeHelper || false;
      webSearch.checked = config.webSearch || false;
      voiceCommands.checked = config.voiceCommands || false;
      pluginWeather.checked = config.pluginWeather || false;
      pluginCalendar.checked = config.pluginCalendar || false;
      pluginNews.checked = config.pluginNews || false;
      gitRepoUrl.value = config.gitRepoUrl || '';
      openrouterApiKey.value = config.openrouterApiKey || '';
      groqApiKey.value = config.groqApiKey || '';
      hfApiKey.value = config.hfApiKey || '';
      deepseekApiKey.value = config.deepseekApiKey || '';
      googleApiKey.value = config.googleApiKey || '';
      updateModelOptions();
      modelSelect.value = config.model || '';
      populateVoiceList();
      if (config.voiceURI) voiceSelect.value = config.voiceURI;
      toggleCustomFields();
      modal.classList.add('active');
    });
    modalClose.addEventListener('click', () => modal.classList.remove('active'));
    modalSave.addEventListener('click', () => {
      saveConfig();
      modal.classList.remove('active');
      addSystemMessage('⚙️ Настройки сохранены.');
    });
    providerSelect.addEventListener('change', () => { updateModelOptions(); toggleCustomFields(); });
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });
    temperatureRange.addEventListener('input', function() {
      const val = (this.value / 100).toFixed(1);
      tempValue.textContent = val;
    });

    // ---------- Боковая панель ----------
    function toggleSidebar() { sidebar.classList.toggle('open'); sidebarOverlay.classList.toggle('active'); }
    function closeSidebar() { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('active'); }
    menuToggle.addEventListener('click', toggleSidebar);
    sidebarOverlay.addEventListener('click', closeSidebar);

    // ---------- Авторизация ----------
    let generatedCode = '';
    async function sendVerificationCode(email) {
      const serviceID = config.emailjs_service || 'service_xxxxx';
      const templateID = config.emailjs_template || 'template_xxxxx';
      const userID = config.emailjs_user || 'user_xxxxx';
      if (serviceID === 'service_xxxxx' || templateID === 'template_xxxxx' || userID === 'user_xxxxx') {
        const code = Math.floor(100000 + Math.random() * 900000).toString();
        generatedCode = code;
        authMessage.textContent = `🔑 Тестовый код: ${code} (также в консоли)`;
        authMessage.style.color = '#6bff6b';
        console.log(`📧 Код для ${email}: ${code}`);
        return true;
      }
      try {
        const code = Math.floor(100000 + Math.random() * 900000).toString();
        generatedCode = code;
        const templateParams = { to_email: email, code: code, user_name: 'Пользователь' };
        await emailjs.send(serviceID, templateID, templateParams, { publicKey: userID });
        authMessage.textContent = '✅ Код отправлен на почту!';
        authMessage.style.color = '#6bff6b';
        return true;
      } catch (error) {
        console.error('EmailJS error:', error);
        authMessage.textContent = '❌ Ошибка отправки. Проверьте настройки EmailJS.';
        authMessage.style.color = '#ff6b6b';
        return false;
      }
    }
    sendCodeBtn.addEventListener('click', async function() {
      const email = authEmail.value.trim();
      if (!email || !email.includes('@')) { authMessage.textContent = '❌ Введите корректный email.'; authMessage.style.color = '#ff6b6b'; return; }
      authMessage.textContent = '⏳ Отправка...';
      authMessage.style.color = '#b0c4ff';
      await sendVerificationCode(email);
    });
    confirmBtn.addEventListener('click', function() {
      const code = authCode.value.trim();
      if (!code) { authMessage.textContent = '❌ Введите код.'; authMessage.style.color = '#ff6b6b'; return; }
      if (code === generatedCode) {
        userEmail = authEmail.value.trim();
        userName = userEmail.split('@')[0] || 'Пользователь';
        userNameDisplay.textContent = userName;
        authOverlay.classList.add('hidden');
        localStorage.setItem('jarvis_auth', 'true');
        localStorage.setItem('jarvis_user', JSON.stringify({ email: userEmail, name: userName }));
        loadStats();
        updateUserStats(userEmail, userName);
        loadChats();
        loadSavedPlugins();
        addSystemMessage(`👋 Привет, ${userName}! Я Jarvis 3.4, созданный NODE / хелок. Чем могу помочь?`);
        if (!config.groqApiKey && !config.openrouterApiKey && config.provider !== 'custom' && config.provider !== 'ollama') {
          addSystemMessage('💡 Введите API-ключ Groq в настройках или выберите другой провайдер.');
        }
        initIndexedDB().catch(console.warn);
      } else {
        authMessage.textContent = '❌ Неверный код. Попробуйте ещё раз.';
        authMessage.style.color = '#ff6b6b';
      }
    });
    function checkSession() {
      const auth = localStorage.getItem('jarvis_auth');
      if (auth === 'true') {
        const userData = localStorage.getItem('jarvis_user');
        if (userData) {
          try {
            const parsed = JSON.parse(userData);
            userEmail = parsed.email || '';
            userName = parsed.name || 'Пользователь';
          } catch(e) {}
        }
        userNameDisplay.textContent = userName;
        authOverlay.classList.add('hidden');
        loadStats();
        updateUserStats(userEmail, userName);
        loadChats();
        loadSavedPlugins();
        addSystemMessage(`👋 Привет, ${userName}! Я Jarvis 3.4, созданный NODE / хелок. Чем могу помочь?`);
        if (!config.groqApiKey && !config.openrouterApiKey && config.provider !== 'custom' && config.provider !== 'ollama') {
          addSystemMessage('💡 Введите API-ключ Groq в настройках или выберите другой провайдер.');
        }
        initIndexedDB().catch(console.warn);
      } else {
        authOverlay.classList.remove('hidden');
      }
    }
    logoutBtn.addEventListener('click', function() {
      if (confirm('Выйти из аккаунта?')) {
        localStorage.removeItem('jarvis_auth');
        localStorage.removeItem('jarvis_user');
        localStorage.removeItem('jarvis_chats');
        localStorage.removeItem('jarvis_plugins');
        location.reload();
      }
    });

    // ---------- Инициализация ----------
    loadConfig();
    setTimeout(populateVoiceList, 600);
    checkSession();
    if (!config.groqApiKey && !config.openrouterApiKey && config.provider !== 'custom' && config.provider !== 'ollama') {
      setTimeout(() => {
        if (!authOverlay.classList.contains('hidden')) return;
        addSystemMessage('⚠️ Введите API-ключ Groq в настройках (получите его в консоли Groq) или выберите другой провайдер.');
      }, 1000);
    }

  })();
</script>
</body>
</html>
