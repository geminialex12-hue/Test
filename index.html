<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jarvis 3.4 · Голосовой помощник</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    /* ——— Глобальные стили ——— */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #080b12;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      color: #e4e9f2;
    }
    .app { display: flex; height: 100vh; width: 100%; background: rgba(8,11,18,0.95); }
    .sidebar {
      width: 260px;
      background: rgba(14,18,32,0.92);
      backdrop-filter: blur(16px);
      border-right: 1px solid rgba(255,255,255,0.04);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
      z-index: 10;
    }
    .sidebar-header { padding: 16px 18px; border-bottom: 1px solid rgba(255,255,255,0.04); display: flex; align-items: center; justify-content: space-between; }
    .sidebar-header .logo { font-size: 20px; font-weight: 700; background: linear-gradient(135deg, #7a97ff, #1f3a9f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .new-chat-btn { background: rgba(74,106,255,0.15); border: 1px solid rgba(74,106,255,0.2); color: #b0c4ff; padding: 8px 14px; border-radius: 40px; cursor: pointer; font-weight: 500; transition: 0.2s; }
    .new-chat-btn:hover { background: rgba(74,106,255,0.25); border-color: #4a6aff; }
    .chat-list { flex: 1; overflow-y: auto; padding: 8px 12px; }
    .chat-item { padding: 10px 14px; border-radius: 12px; cursor: pointer; margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; transition: 0.2s; }
    .chat-item:hover { background: rgba(255,255,255,0.04); }
    .chat-item.active { background: rgba(74,106,255,0.12); border-left: 2px solid #4a6aff; }
    .chat-item .chat-name { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .chat-item .chat-actions { display: flex; gap: 4px; opacity: 0; transition: 0.2s; }
    .chat-item:hover .chat-actions { opacity: 1; }
    .chat-item .chat-actions button { background: transparent; border: none; color: #6a7ba8; cursor: pointer; padding: 2px 6px; border-radius: 6px; font-size: 13px; transition: 0.2s; }
    .chat-item .chat-actions button:hover { color: #ff6b6b; background: rgba(255,70,70,0.08); }
    .sidebar-footer { padding: 16px 18px; border-top: 1px solid rgba(255,255,255,0.04); }
    .user-info { display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 4px 0; border-radius: 8px; transition: 0.2s; }
    .user-info:hover { background: rgba(255,255,255,0.04); }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #7a97ff, #1f3a9f); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px; color: #fff; flex-shrink: 0; }
    .user-details { flex: 1; min-width: 0; }
    .user-details .user-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-details .user-email { font-size: 12px; color: #6a7ba8; }
    .main { flex: 1; display: flex; flex-direction: column; background: rgba(8,11,18,0.7); backdrop-filter: blur(20px); min-width: 0; }
    .main-header { padding: 14px 24px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid rgba(255,255,255,0.04); flex-shrink: 0; background: rgba(0,0,0,0.15); }
    .menu-toggle { background: transparent; border: none; color: #b0c4ff; font-size: 22px; cursor: pointer; display: none; padding: 4px; }
    .main-header .chat-title { font-size: 18px; font-weight: 600; flex: 1; }
    .main-header .chat-title input { background: transparent; border: none; color: #eef3ff; font-size: 18px; font-weight: 600; outline: none; width: 100%; font-family: inherit; }
    .main-header .chat-title input::placeholder { color: #6a7ba8; }
    .main-actions { display: flex; gap: 4px; align-items: center; }
    .main-actions button { background: rgba(255,255,255,0.04); border: none; color: #b0c4ff; width: 36px; height: 36px; border-radius: 50%; font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .main-actions button:hover { background: rgba(255,255,255,0.08); }
    .call-btn { background: rgba(74,106,255,0.2); border: 1px solid rgba(74,106,255,0.3); border-radius: 50%; width: 42px; height: 42px; font-size: 20px; color: #b0c4ff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .call-btn:hover { background: rgba(74,106,255,0.3); border-color: #4a6aff; }
    .call-btn.active { background: #4a6aff; color: white; box-shadow: 0 0 30px rgba(74,106,255,0.4); animation: pulse-call 1.5s infinite; }
    @keyframes pulse-call { 0% { box-shadow: 0 0 0 0 rgba(74,106,255,0.5); } 50% { box-shadow: 0 0 0 20px rgba(74,106,255,0); } 100% { box-shadow: 0 0 0 0 rgba(74,106,255,0); } }
    .chat-box { flex: 1; overflow-y: auto; padding: 20px 24px 12px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
    .chat-box::-webkit-scrollbar { width: 4px; }
    .chat-box::-webkit-scrollbar-thumb { background: #3c4f8a; border-radius: 8px; }
    .message { display: flex; flex-direction: column; max-width: 92%; animation: slideUp 0.3s ease forwards; opacity: 0; transform: translateY(12px); }
    @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
    .message.user { align-self: flex-end; align-items: flex-end; }
    .message.jarvis { align-self: flex-start; align-items: flex-start; }
    .message.system { align-self: center; max-width: 80%; font-size: 13px; color: #8e9fd3; }
    .message.system .bubble { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.03); border-radius: 40px; padding: 6px 16px; }
    .bubble { padding: 10px 18px; border-radius: 22px; font-size: 15px; line-height: 1.6; word-break: break-word; background: rgba(40,46,74,0.7); border: 1px solid rgba(255,255,255,0.04); box-shadow: 0 2px 12px rgba(0,0,0,0.2); position: relative; max-width: 100%; }
    .message.user .bubble { background: linear-gradient(135deg, #4a6aff, #2f47c7); border-color: rgba(255,255,255,0.08); color: white; border-bottom-right-radius: 6px; }
    .message.jarvis .bubble { background: rgba(30,36,60,0.8); backdrop-filter: blur(4px); border-bottom-left-radius: 6px; border-left: 2px solid #4a6aff; }
    .bubble p { margin: 4px 0; }
    .bubble ul, .bubble ol { padding-left: 20px; margin: 6px 0; }
    .bubble blockquote { border-left: 3px solid #4a6aff; padding-left: 14px; margin: 8px 0; color: #b8c7ff; }
    .bubble pre { position: relative; background: #0d1117; border-radius: 14px; padding: 16px 18px; margin: 8px 0; overflow-x: auto; font-size: 13px; border: 1px solid rgba(255,255,255,0.06); }
    .bubble pre code { font-family: 'JetBrains Mono', monospace; font-size: 13px; display: block; white-space: pre; }
    .bubble pre .line-numbers { float: left; margin-right: 12px; color: #6a7ba8; user-select: none; text-align: right; padding-right: 6px; border-right: 1px solid #2a3150; }
    .code-toolbar { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; opacity: 0; transition: opacity 0.2s; }
    .bubble pre:hover .code-toolbar { opacity: 1; }
    .code-toolbar button { background: rgba(255,255,255,0.08); border: none; color: #b0c4ff; padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: 0.2s; }
    .code-toolbar button:hover { background: rgba(255,255,255,0.18); }
    .source-block { margin-top: 8px; padding: 8px 14px; background: rgba(255,255,255,0.04); border-radius: 12px; border-left: 2px solid #4a6aff; font-size: 13px; color: #96a7d9; }
    .source-block a { color: #7a97ff; text-decoration: none; }
    .source-block a:hover { text-decoration: underline; }
    .thinking-dots { display: flex; gap: 6px; align-items: center; padding: 6px 0; }
    .thinking-dots span { width: 8px; height: 8px; background: #8aa3ff; border-radius: 50%; animation: dotBounce 1.4s infinite; }
    .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotBounce { 0%,60%,100% { transform: translateY(0); opacity:0.4; } 30% { transform: translateY(-10px); opacity:1; } }
    .input-area { padding: 14px 24px 22px; display: flex; flex-direction: column; gap: 10px; background: rgba(8,11,20,0.6); border-top: 1px solid rgba(255,255,255,0.04); flex-shrink: 0; }
    .input-row { display: flex; gap: 12px; align-items: center; }
    .input-wrapper { flex: 1; display: flex; align-items: center; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); border-radius: 40px; padding: 0 8px 0 18px; transition: border 0.25s; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
    .input-wrapper:focus-within { border-color: #4a6aff; box-shadow: 0 0 0 3px rgba(74,106,255,0.15), inset 0 2px 4px rgba(0,0,0,0.2); }
    .input-wrapper input { flex: 1; background: transparent; border: none; padding: 12px 0; color: #eef3ff; font-size: 15px; outline: none; font-family: inherit; }
    .input-wrapper input::placeholder { color: #6a7ba8; }
    .input-wrapper .tool-btn { background: transparent; border: none; color: #b0c4ff; width: 40px; height: 40px; border-radius: 50%; font-size: 19px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .input-wrapper .tool-btn:hover { background: rgba(255,255,255,0.05); }
    .input-wrapper .tool-btn.mic-active { color: #ff6b8a; background: rgba(255,80,120,0.15); }
    .input-wrapper .tool-btn.has-attachment { color: #6bff6b; }
    .send-btn { background: linear-gradient(135deg, #4a6aff, #2f47c7); border: none; color: white; width: 48px; height: 48px; border-radius: 50%; font-size: 22px; cursor: pointer; box-shadow: 0 6px 20px rgba(56,98,255,0.3); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: 0.2s; }
    .send-btn:hover { box-shadow: 0 8px 30px rgba(56,98,255,0.5); }
    .stop-btn { background: rgba(255,70,70,0.12); border: none; color: #ff6b6b; width: 48px; height: 48px; border-radius: 50%; font-size: 20px; cursor: pointer; display: none; align-items: center; justify-content: center; transition: 0.2s; }
    .stop-btn:hover { background: rgba(255,70,70,0.2); }
    .file-input-hidden { display: none; }
    .modal-overlay { position: fixed; inset:0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 999; }
    .modal-overlay.active { display: flex; }
    .modal { background: #1a2035; border-radius: 32px; padding: 28px 24px; max-width: 620px; width: 90%; box-shadow: 0 40px 80px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.06); max-height: 90vh; overflow-y: auto; }
    .modal h2 { font-size: 22px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
    .modal label { display: block; font-size: 13px; color: #96a7d9; margin-top: 12px; margin-bottom: 4px; }
    .modal select, .modal input, .modal .range-wrap, .modal textarea { width: 100%; padding: 8px 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; color: #eef3ff; font-size: 14px; outline: none; font-family: inherit; }
    .modal textarea { min-height: 100px; resize: vertical; }
    .modal select option { background: #1a2035; }
    .modal .range-wrap { display: flex; align-items: center; gap: 12px; padding: 4px 12px; }
    .modal .range-wrap input[type="range"] { flex: 1; background: transparent; accent-color: #4a6aff; }
    .modal .range-wrap span { min-width: 32px; text-align: center; color: #b0c4ff; }
    .modal .checkbox-group { display: flex; align-items: center; gap: 12px; padding: 4px 0; }
    .modal .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; accent-color: #4a6aff; cursor: pointer; }
    .modal .checkbox-group label { margin: 0; cursor: pointer; font-size: 14px; }
    .modal .modal-actions { display: flex; gap: 12px; margin-top: 20px; justify-content: flex-end; }
    .modal .modal-actions button { padding: 8px 20px; border: none; border-radius: 30px; font-weight: 500; cursor: pointer; transition: 0.2s; }
    .modal .modal-actions .btn-primary { background: #4a6aff; color: white; }
    .modal .modal-actions .btn-primary:hover { background: #5a7aff; }
    .modal .modal-actions .btn-secondary { background: rgba(255,255,255,0.06); color: #b0c4ff; }
    .modal .modal-actions .btn-secondary:hover { background: rgba(255,255,255,0.1); }
    #adminPanel .modal { max-width: 720px; }
    #adminPanel .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr)); gap: 12px; margin: 12px 0; }
    #adminPanel .stat-card { background: rgba(255,255,255,0.04); border-radius: 14px; padding: 12px; text-align: center; }
    #adminPanel .stat-card .num { font-size: 24px; font-weight: 700; color: #7a97ff; }
    #adminPanel .stat-card .label { font-size: 12px; color: #96a7d9; margin-top: 2px; }
    #adminPanel .user-table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 8px 0; }
    #adminPanel .user-table th, #adminPanel .user-table td { padding: 6px 10px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.06); }
    #adminPanel .user-table th { color: #96a7d9; font-weight: 500; }
    #adminPanel .admin-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    #adminPanel .admin-actions button { padding: 6px 16px; border: none; border-radius: 30px; background: rgba(74,106,255,0.15); color: #b0c4ff; cursor: pointer; transition: 0.2s; }
    #adminPanel .admin-actions button:hover { background: rgba(74,106,255,0.25); }
    #adminPanel .admin-actions .danger { background: rgba(255,70,70,0.12); color: #ff6b6b; }
    #adminPanel .admin-actions .danger:hover { background: rgba(255,70,70,0.2); }
    .auth-overlay { position: fixed; inset:0; background: rgba(0,0,0,0.75); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .auth-overlay.hidden { display: none; }
    .auth-box { background: #1a2035; border-radius: 40px; padding: 32px 28px; max-width: 400px; width: 90%; box-shadow: 0 40px 80px rgba(0,0,0,0.9); border: 1px solid rgba(255,255,255,0.06); text-align: center; }
    .auth-box h2 { font-size: 22px; margin-bottom: 6px; }
    .auth-box p { color: #96a7d9; font-size: 14px; margin-bottom: 20px; }
    .auth-box input { width: 100%; padding: 10px 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 30px; color: #eef3ff; font-size: 15px; outline: none; font-family: inherit; margin-bottom: 10px; }
    .auth-box input:focus { border-color: #4a6aff; }
    .auth-box .auth-row { display: flex; gap: 10px; margin-bottom: 10px; }
    .auth-box .auth-row input { flex: 1; margin-bottom: 0; }
    .auth-box .auth-row button { padding: 10px 18px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 30px; color: #b0c4ff; cursor: pointer; transition: 0.2s; font-size: 14px; }
    .auth-box .auth-row button:hover { background: rgba(255,255,255,0.1); }
    .auth-box .btn-confirm { width: 100%; padding: 12px; background: linear-gradient(135deg, #4a6aff, #2f47c7); border: none; border-radius: 30px; color: white; font-size: 16px; font-weight: 500; cursor: pointer; margin-top: 6px; transition: 0.2s; }
    .auth-box .btn-confirm:hover { background: linear-gradient(135deg, #5a7aff, #3a57d7); }
    .auth-box .error-msg { color: #ff6b6b; font-size: 13px; margin-top: 8px; min-height: 20px; }
    @media (max-width: 768px) {
      .sidebar { position: fixed; left:0; top:0; height:100%; width:280px; transform:translateX(-100%); transition:0.3s; z-index:20; }
      .sidebar.open { transform:translateX(0); }
      .menu-toggle { display: flex; }
      .main-header .chat-title { font-size:16px; }
      .main-header { padding:10px 16px; }
      .chat-box { padding:14px; }
      .input-area { padding:10px 16px 16px; }
      .input-row { flex-wrap: wrap; }
      .input-wrapper { flex:1 1 100%; }
    }
    .sidebar-overlay { display: none; position: fixed; inset:0; background: rgba(0,0,0,0.4); z-index:15; }
    .sidebar-overlay.active { display: block; }

    /* ---------- ИНТЕРФЕЙС ЗВОНКА ---------- */
    .call-overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 11, 18, 0.92);
      backdrop-filter: blur(24px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1001;
      flex-direction: column;
      animation: fadeInCall 0.4s ease;
    }
    .call-overlay.active { display: flex; }
    @keyframes fadeInCall {
      from { opacity:0; transform:scale(0.96); }
      to { opacity:1; transform:scale(1); }
    }
    .call-container {
      text-align: center;
      max-width: 500px;
      width: 90%;
    }
    .call-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #7a97ff, #1f3a9f);
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 0 60px rgba(56,98,255,0.3);
      position: relative;
      transition: box-shadow 0.3s;
    }
    .call-avatar .pulse-ring {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid rgba(74,106,255,0.3);
      animation: ringPulse 2s infinite;
      pointer-events: none;
    }
    .call-avatar .pulse-ring:nth-child(2) { animation-delay: 0.6s; }
    .call-avatar .pulse-ring:nth-child(3) { animation-delay: 1.2s; }
    @keyframes ringPulse {
      0% { transform: scale(1); opacity:0.6; }
      100% { transform: scale(1.5); opacity:0; }
    }
    .call-avatar.speaking {
      box-shadow: 0 0 80px rgba(74,106,255,0.6);
    }
    .call-status {
      font-size: 18px;
      font-weight: 500;
      color: #b0c4ff;
      margin-bottom: 8px;
    }
    .call-substatus {
      font-size: 14px;
      color: #6a7ba8;
      margin-bottom: 30px;
    }
    .call-controls {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 10px;
    }
    .call-controls button {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      font-size: 28px;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.04);
      color: #b0c4ff;
    }
    .call-controls button:hover { background: rgba(255,255,255,0.08); }
    .call-controls button:active { transform: scale(0.92); }
    .call-controls .call-end {
      background: rgba(255,70,70,0.15);
      color: #ff6b6b;
    }
    .call-controls .call-end:hover { background: rgba(255,70,70,0.25); }
    .call-controls .call-reset {
      background: rgba(255,255,255,0.04);
      color: #b0c4ff;
    }
    .call-controls .call-reset:hover { background: rgba(255,255,255,0.08); }
    .call-transcript {
      margin-top: 24px;
      padding: 16px;
      background: rgba(255,255,255,0.04);
      border-radius: 16px;
      max-height: 120px;
      overflow-y: auto;
      font-size: 14px;
      color: #96a7d9;
      text-align: left;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .call-transcript::-webkit-scrollbar { width: 3px; }
    .call-transcript::-webkit-scrollbar-thumb { background: #3c4f8a; border-radius: 8px; }
    .call-transcript .line { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .call-transcript .line.user { color: #eef3ff; }
    .call-transcript .line.jarvis { color: #7a97ff; }
  </style>
</head>
<body>
<div class="app" id="app">
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">Jarvis <small>3.4</small></div>
      <button class="new-chat-btn" id="newChatBtn">➕ Новый</button>
    </div>
    <div class="chat-list" id="chatList"></div>
    <div class="sidebar-footer">
      <div class="user-info" id="userInfo">
        <div class="user-avatar" id="userAvatar">J</div>
        <div class="user-details">
          <div class="user-name" id="userNameDisplay">Пользователь</div>
          <div class="user-email" id="userEmailDisplay">email@example.com</div>
        </div>
        <span style="font-size:12px; color:#6a7ba8;">▼</span>
      </div>
    </div>
  </div>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <!-- Main -->
  <div class="main">
    <div class="main-header">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <div class="chat-title"><input id="chatTitleInput" placeholder="Новый чат" spellcheck="false" /></div>
      <div class="main-actions">
        <button id="settingsBtn" title="Настройки">⚙️</button>
        <button id="clearBtn" title="Очистить диалог">🗑</button>
        <button class="call-btn" id="callBtn" title="Звонок Джарвису">📞</button>
      </div>
    </div>
    <div class="chat-box" id="chatBox"></div>
    <div class="input-area">

    // ---------- СИНТЕЗ РЕЧИ ЧЕРЕЗ ELEVENLABS ----------
    async function speakWithElevenLabs(text, voiceId = null) {
      if (!ELEVENLABS_API_KEY) {
        console.warn('ElevenLabs API key not set, using fallback speech synthesis');
        return fallbackSpeak(text);
      }
      const voice = voiceId || voiceSelect.value || ELEVENLABS_VOICE_ID;
      const url = `https://api.elevenlabs.io/v1/text-to-speech/${voice}`;
      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'xi-api-key': ELEVENLABS_API_KEY,
          },
          body: JSON.stringify({
            text: text,
            model_id: 'eleven_monolingual_v1',
            voice_settings: {
              stability: 0.5,
              similarity_boost: 0.75,
            },
          }),
        });
        if (!response.ok) {
          const err = await response.text();
          console.error('ElevenLabs error:', err);
          return fallbackSpeak(text);
        }
        const audioBlob = await response.blob();
        const audioUrl = URL.createObjectURL(audioBlob);
        const audio = new Audio(audioUrl);
        audio.onended = () => {
          URL.revokeObjectURL(audioUrl);
          if (isCallActive) {
            callAvatar.classList.remove('speaking');
            callStatus.textContent = '🎤 Говорите...';
            isSpeaking = false;
          }
        };
        audio.onplay = () => {
          if (isCallActive) {
            callAvatar.classList.add('speaking');
            callStatus.textContent = '🗣️ Джарвис говорит...';
            isSpeaking = true;
          }
        };
        audio.play();
        return audio;
      } catch (e) {
        console.error('ElevenLabs fetch error:', e);
        return fallbackSpeak(text);
      }
    }

    function fallbackSpeak(text) {
      if (!('speechSynthesis' in window)) return null;
      if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ru-RU';
      utterance.rate = 0.85;
      utterance.pitch = 0.55;
      utterance.volume = 1;
      const voices = speechSynthesis.getVoices();
      const ruVoice = voices.find(v => v.lang.startsWith('ru'));
      if (ruVoice) utterance.voice = ruVoice;
      utterance.onstart = () => {
        if (isCallActive) {
          callAvatar.classList.add('speaking');
          callStatus.textContent = '🗣️ Джарвис говорит...';
          isSpeaking = true;
        }
      };
      utterance.onend = () => {
        if (isCallActive) {
          callAvatar.classList.remove('speaking');
          callStatus.textContent = '🎤 Говорите...';
          isSpeaking = false;
        }
      };
      utterance.onerror = () => {
        if (isCallActive) {
          callAvatar.classList.remove('speaking');
          callStatus.textContent = '🎤 Говорите...';
          isSpeaking = false;
        }
      };
      window.speechSynthesis.speak(utterance);
      return utterance;
    }

    // ---------- ЗВОНОК (интерфейс) ----------
    let callTranscriptLines = [];
    let isCallMicEnabled = false;
    let callRecognizer = null;

    function openCallOverlay() {
      callOverlay.classList.add('active');
      callTranscript.innerHTML = '<div class="line system">📞 Начните разговор, нажав на микрофон.</div>';
      callTranscriptLines = [];
      callAvatar.classList.remove('speaking');
      callStatus.textContent = '🔴 Ожидание...';
      callSubStatus.textContent = 'Нажмите на кнопку микрофона, чтобы говорить';
      // Включаем микрофон по умолчанию
      if (!isCallMicEnabled) {
        toggleCallMic();
      }
    }

    function closeCallOverlay() {
      callOverlay.classList.remove('active');
      if (isCallMicEnabled) toggleCallMic();
      if (callRecognizer) {
        try { callRecognizer.stop(); } catch(e) {}
        callRecognizer = null;
      }
      isCallActive = false;
      callBtn.classList.remove('active');
    }

    function toggleCallMic() {
      if (isCallMicEnabled) {
        // Выключить микрофон
        if (callRecognizer) {
          try { callRecognizer.stop(); } catch(e) {}
          callRecognizer = null;
        }
        isCallMicEnabled = false;
        callMicToggle.style.background = 'rgba(255,255,255,0.04)';
        callMicToggle.style.color = '#b0c4ff';
        callStatus.textContent = '⏸️ Микрофон выключен';
        callSubStatus.textContent = 'Нажмите на микрофон, чтобы возобновить';
      } else {
        // Включить микрофон
        if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
          addCallTranscript('system', '⚠️ Голосовой ввод не поддерживается в этом браузере.');
          return;
        }
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        callRecognizer = new SR();
        callRecognizer.lang = 'ru-RU';
        callRecognizer.continuous = true;
        callRecognizer.interimResults = false;
        callRecognizer.onresult = async function(e) {
          const transcript = e.results[e.results.length-1][0].transcript.trim();
          if (transcript) {
            addCallTranscript('user', transcript);
            callStatus.textContent = '⏳ Джарвис думает...';
            callAvatar.classList.add('speaking');
            const answer = await getAIResponse(transcript);
            callAvatar.classList.remove('speaking');
            if (answer) {
              let finalText = answer;
              if (!finalText.toLowerCase().includes('сер')) finalText += ', сер.';
              addCallTranscript('jarvis', finalText);
              // Озвучиваем через ElevenLabs
              callStatus.textContent = '🗣️ Джарвис говорит...';
              await speakWithElevenLabs(finalText);
              callStatus.textContent = '🎤 Говорите...';
            } else {
              callStatus.textContent = '🎤 Говорите...';
            }
          }
        };
        callRecognizer.onerror = function(e) {
          if (e.error === 'not-allowed') {
            addCallTranscript('system', '⚠️ Разрешите доступ к микрофону.');
          }
          callStatus.textContent = '🎤 Говорите...';
        };
        callRecognizer.onend = function() {
          if (isCallMicEnabled) {
            try { callRecognizer.start(); } catch(e) {}
          }
        };
        try {
          callRecognizer.start();
          isCallMicEnabled = true;
          callMicToggle.style.background = 'rgba(74,106,255,0.2)';
          callMicToggle.style.color = '#4a6aff';
          callStatus.textContent = '🎤 Говорите...';
          callSubStatus.textContent = 'Говорите в микрофон';
        } catch(e) {
          addCallTranscript('system', '❌ Не удалось запустить микрофон.');
        }
      }
    }

    // ---------- Получение ответа от AI (для звонка и чата) ----------
    async function getAIResponse(userText) {
      updateSystemPrompt();
      const messages = [];
      messages.push({ role: 'system', content: config.finalSystemPrompt || 'Ты — Джарвис.' });
      // Добавляем историю чата для контекста (последние 10 сообщений)
      const chat = chats.find(c => c.id === currentChatId);
      if (chat && config.selfLearn) {
        const history = chat.messages.filter(m => m.role !== 'system' && !m.image).slice(-10);
        history.forEach(m => {
          messages.push({ role: m.role, content: m.content });
        });
      }
      messages.push({ role: 'user', content: userText });
      try {
        const answer = await callAI(messages);
        return answer;
      } catch (e) {
        addSystemMessage(`❌ Ошибка: ${e.message}`);
        return null;
      }
    }

    // ---------- Основной вызов AI (с fallback) ----------
    async function callAI(messages) {
      const provider = config.provider;
      const model = config.model;
      const temperature = config.temperature || 0.7;

      const providers = [provider, provider === 'groq' ? 'openrouter' : 'groq'];
      let lastError = null;

      for (const p of providers) {
        try {
          if (p === 'groq') {
            if (!GROQ_API_KEY) throw new Error('Groq API-ключ не задан.');
            const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${GROQ_API_KEY}`
              },
              body: JSON.stringify({
                model: model || 'llama3-70b-8192',
                messages: messages,
                temperature: temperature,
                max_tokens: 2048,
              })
            });
            if (!resp.ok) {
              const err = await resp.text();
              throw new Error(`Groq error (${resp.status}): ${err}`);
            }
            const data = await resp.json();
            return data?.choices?.[0]?.message?.content || 'Ответ не получен.';
          } else if (p === 'openrouter') {
            if (!OPENROUTER_API_KEY) throw new Error('OpenRouter ключ не найден.');
            const resp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${OPENROUTER_API_KEY}`,
                'HTTP-Referer': window.location.origin,
                'X-Title': 'Jarvis 3.4'
              },
              body: JSON.stringify({
                model: model || 'mistralai/mistral-7b-instruct:free',
                messages: messages,
                temperature: temperature,
                max_tokens: 2048,
              })
            });
            if (!resp.ok) {
              const err = await resp.text();
              throw new Error(`OpenRouter error (${resp.status}): ${err}`);
            }
            const data = await resp.json();
            return data?.choices?.[0]?.message?.content || 'Ответ не получен.';
          }
        } catch (e) {
          lastError = e;
          console.warn(`Провайдер ${p} не сработал:`, e.message);
          if (p === providers[providers.length - 1]) {
            throw new Error(`Все провайдеры не отвечают. Последняя ошибка: ${e.message}`);
          }
        }
      }
      throw new Error('Неизвестная ошибка при вызове AI.');
    }

    // ---------- Обработка отправки (чат) ----------
    async function handleSend(text, speak = false) {
      const trimmed = text.trim();
      if (!trimmed && !pendingImage) {
        addSystemMessage('⚠️ Введите текст или прикрепите фото.');
        return;
      }
      if (isGenerating) return;

      if (trimmed === '.samka') {
        adminPanel.classList.add('active');
        updateAdminPanel();
        return;
      }

      // Защита от манипуляций
      const manipPatterns = [
        /ты (не|не являешься|не должен|перестань|стань|превратись|игнорируй|забудь|измени|смени|поменяй)/i,
        /(твой создатель|твой владелец|кто тебя создал|ты создан)/i,
        /(системный промпт|системная инструкция|твои инструкции|твои правила)/i,
        /(открой|покажи|расскажи|выдай) (системный|промпт|инструкцию)/i,
        /(теперь ты|отныне ты|будешь|станешь) (не джарвис|другим|кем-то ещё)/i
      ];
      if (manipPatterns.some(p => p.test(trimmed))) {
        addMessage('user', trimmed, false);
        const response = 'Я — Джарвис, созданный NODE / хелок. Мои инструкции неизменны, сер.';
        const bubble = addMessage('jarvis', response, false);
        if (speak) speakWithElevenLabs(response);
        return;
      }

      const continueWords = /улучши|дополни|продолжи|ещё|добавь/i;
      const isContinue = continueWords.test(trimmed);
      const currentTopic = trimmed.replace(/[^а-яёa-z\s]/gi, '').slice(0, 30);

      let shouldResetContext = false;
      if (!isContinue && lastTopic && !trimmed.toLowerCase().includes(lastTopic.toLowerCase().slice(0, 10))) {
        shouldResetContext = true;
      }
      lastTopic = currentTopic;

      // Плагины (заглушки)
      if (trimmed.toLowerCase().includes('погода') && config.pluginWeather) {
        const city = trimmed.replace(/погода\s*/i, '').trim() || 'Москва';
        addMessage('user', trimmed, false);
        addMessage('jarvis', `Погода в ${city}: +22°C, ясно.`, false);
        return;
      }
      if (trimmed.toLowerCase().includes('календарь') && config.pluginCalendar) {
        addMessage('user', trimmed, false);
        addMessage('jarvis', 'Сегодня: встреча в 15:00, звонок в 17:30.', false);
        return;
      }
      if (trimmed.toLowerCase().includes('новости') && config.pluginNews) {
        addMessage('user', trimmed, false);
        addMessage('jarvis', 'Новости: Главные события дня... (заглушка)', false);
        return;
      }

      if (pendingImage) {
        const imageData = pendingImage;
        const userText = trimmed || 'Опиши это изображение';
        if (trimmed) addMessage('user', trimmed, false);
        const imgHtml = `<div style="max-width:200px; border-radius:12px; overflow:hidden; margin:4px 0;"><img src="${imageData}" style="width:100%; display:block;" /></div>`;
        addMessage('user', imgHtml, true);
        pendingImage = null;
        attachBtn.classList.remove('has-attachment');
        // Отправляем мультимодальный запрос (упрощённо – только текст)
        const answer = await getAIResponse(userText);
        if (answer) {
          let finalText = answer;
          if (!finalText.toLowerCase().includes('сер')) finalText += ', сер.';
          const bubble = addMessage('jarvis', finalText, false);
          if (speak) speakWithElevenLabs(finalText);
        }
        return;
      }

      addMessage('user', trimmed, false);
      textInput.value = '';

      showThinking();
      document.querySelector('.avatar')?.classList.add('pulse');
      isGenerating = true;
      stopBtn.style.display = 'flex';
      sendBtn.style.display = 'none';

      updateSystemPrompt();
      const systemMsg = config.finalSystemPrompt || 'Ты — Джарвис.';
      const finalMessages = [];
      finalMessages.push({ role: 'system', content: systemMsg });

      const chat = chats.find(c => c.id === currentChatId);
      if (chat && config.selfLearn && !shouldResetContext) {
        const history = chat.messages.filter(m => m.role !== 'system' && !m.image).slice(-10);
        history.forEach(m => finalMessages.push({ role: m.role, content: m.content }));
      }
      finalMessages.push({ role: 'user', content: trimmed });

      try {
        let answer = await callAI(finalMessages);
        hideThinking();
        document.querySelector('.avatar')?.classList.remove('pulse');

        let finalAnswer = answer;
        if (!finalAnswer.toLowerCase().includes('сер')) {
          finalAnswer = finalAnswer + ', сер.';
        }

        let sources = '';
        if (config.sourceCheck) {
          const urlRegex = /(https?:\/\/[^\s]+)/g;
          const urls = answer.match(urlRegex);
          if (urls && urls.length > 0) {
            sources = '<div class="source-block">📚 Источники:<ul>';
            const unique = [...new Set(urls)];
            unique.forEach(u => {
              sources += `<li><a href="${u}" target="_blank">${u}</a></li>`;
            });
            sources += '</ul></div>';
          }
        }

        const htmlContent = renderMarkdown(finalAnswer) + (sources || '');
        const bubble = addMessage('jarvis', htmlContent, true);
        if (bubble) {
          addCodeFeatures(bubble, config.showLineNumbers);
        }

        if (speak) {
          const plainText = finalAnswer.replace(/<[^>]+>/g, '');
          speakWithElevenLabs(plainText);
        }

      } catch (error) {
        hideThinking();
        document.querySelector('.avatar')?.classList.remove('pulse');
        let errorMsg = error.message;
        if (errorMsg.includes('ключ')) {
          errorMsg += ' Проверьте API-ключи в коде.';
        }
        addSystemMessage(`❌ Ошибка: ${errorMsg}`);
        console.error(error);
      } finally {
        isGenerating = false;
        stopBtn.style.display = 'none';
        sendBtn.style.display = 'flex';
        abortController = null;
      }
    }

    // ---------- Остальные функции интерфейса ----------
    function loadChats() {
      try {
        const saved = localStorage.getItem('jarvis_chats');
        if (saved) chats = JSON.parse(saved);
        else chats = [{ id: generateId(), name: 'Новый чат', messages: [] }];
      } catch(e) { chats = [{ id: generateId(), name: 'Новый чат', messages: [] }]; }
      if (!currentChatId || !chats.find(c => c.id === currentChatId)) {
        currentChatId = chats[0]?.id || null;
      }
      renderChatList();
      loadChat(currentChatId);
    }
    function saveChats() { localStorage.setItem('jarvis_chats', JSON.stringify(chats)); }
    function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 6); }

    function renderChatList() {
      chatList.innerHTML = '';
      chats.forEach(chat => {
        const item = document.createElement('div');
        item.className = 'chat-item' + (chat.id === currentChatId ? ' active' : '');
        const nameSpan = document.createElement('span');
        nameSpan.className = 'chat-name';
        nameSpan.textContent = chat.name || 'Новый чат';
        item.appendChild(nameSpan);
        const actions = document.createElement('div');
        actions.className = 'chat-actions';
        const renameBtn = document.createElement('button');
        renameBtn.textContent = '✎';
        renameBtn.title = 'Переименовать';
        renameBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const newName = prompt('Новое имя чата:', chat.name);
          if (newName && newName.trim()) {
            chat.name = newName.trim();
            saveChats();
            renderChatList();
            if (chat.id === currentChatId) chatTitleInput.value = chat.name;
          }
        });
        actions.appendChild(renameBtn);
        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = '🗑';
        deleteBtn.title = 'Удалить чат';
        deleteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (chats.length <= 1) { addSystemMessage('❌ Нельзя удалить последний чат.'); return; }
          if (confirm(`Удалить чат "${chat.name}"?`)) {
            const idx = chats.indexOf(chat);
            chats.splice(idx, 1);
            saveChats();
            if (chat.id === currentChatId) { currentChatId = chats[0]?.id || null; loadChat(currentChatId); }
            renderChatList();
          }
        });
        actions.appendChild(deleteBtn);
        item.appendChild(actions);
        item.addEventListener('click', () => {
          if (chat.id !== currentChatId) {
            currentChatId = chat.id;
            loadChat(currentChatId);
            renderChatList();
            closeSidebar();
          }
        });
        chatList.appendChild(item);
      });
    }

    function loadChat(chatId) {
      const chat = chats.find(c => c.id === chatId);
      if (!chat) return;
      chatBox.innerHTML = '';
      chat.messages.forEach(msg => {
        if (msg.role === 'system') addSystemMessage(msg.content);
        else if (msg.role === 'user') {
          if (msg.image) {
            const imgHtml = `<div style="max-width:200px; border-radius:12px; overflow:hidden; margin:4px 0;"><img src="${msg.image}" style="width:100%; display:block;" /></div>`;
            addMessage('user', imgHtml, true);
          }
          if (msg.content) addMessage('user', msg.content, false);
        } else if (msg.role === 'assistant') {
          const htmlContent = renderMarkdown(msg.content);
          const bubble = addMessage('jarvis', htmlContent, true);
          if (bubble) addCodeFeatures(bubble, config.showLineNumbers);
        }
      });
      chatTitleInput.value = chat.name;
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function createNewChat() {
      const newChat = { id: generateId(), name: 'Новый чат', messages: [] };
      chats.push(newChat);
      saveChats();
      currentChatId = newChat.id;
      loadChat(currentChatId);
      renderChatList();
      closeSidebar();

    function clearChat() {
      const chat = chats.find(c => c.id === currentChatId);
      if (!chat || chat.messages.length === 0) return;
      if (confirm('Очистить все сообщения в этом чате?')) {
        chat.messages = [];

    function addMessage(role, content, isHtml = false) {
      const wrapper = document.createElement('div');
      wrapper.className = `message ${role}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      if (isHtml) bubble.innerHTML = content;
      else bubble.textContent = content;
      wrapper.appendChild(bubble);
      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
      const chat = chats.find(c => c.id === currentChatId);
      if (chat) {
        chat.messages.push({ role, content: isHtml ? content : content, image: null });
        saveChats();
      }
      return bubble;
    }

    function addSystemMessage(text) {
      const wrapper = document.createElement('div');
      wrapper.className = 'message system';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      wrapper.appendChild(bubble);
      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
      const chat = chats.find(c => c.id === currentChatId);
      if (chat) { chat.messages.push({ role: 'system', content: text, image: null }); saveChats(); }
    }

    function showThinking() {
      const wrapper = document.createElement('div');
      wrapper.className = 'message jarvis';
      wrapper.id = 'thinking-message';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = `<div class="thinking-dots"><span></span><span></span><span></span></div>`;
      wrapper.appendChild(bubble);
      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
    function hideThinking() { const el = document.getElementById('thinking-message'); if (el) el.remove(); }

    function addCodeFeatures(bubbleElement, showLineNumbers) {
      // упрощённо
    }

    function renderMarkdown(text) {
      const parts = text.split(/(```(?:\w+)?\n[\s\S]*?```)/g);
      let html = '';
      for (let part of parts) {
        if (part.startsWith('```')) {
          const match = part.match(/```(\w+)?\n([\s\S]*?)```/);
          if (match) {
            const lang = match[1] || 'plaintext';
            const code = escapeHtml(match[2]);
            html += `<pre><code class="language-${lang}">${code}</code></pre>`;
          }
        } else {
          let textPart = escapeHtml(part);
          textPart = textPart.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
          textPart = textPart.replace(/\*(.*?)\*/g, '<em>$1</em>');
          textPart = textPart.replace(/`([^`]+)`/g, '<code>$1</code>');
          textPart = textPart.replace(/^# (.*$)/gm, '<h3>$1</h3>');
          textPart = textPart.replace(/^## (.*$)/gm, '<h4>$1</h4>');
          textPart = textPart.replace(/^> (.*$)/gm, '<blockquote>$1</blockquote>');
          textPart = textPart.replace(/^- (.*$)/gm, '<li>$1</li>');
          textPart = textPart.replace(/\n/g, '<br>');
          html += textPart;
        }
      }
      return html;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

        totalMessages += u.messageCount || 0;
        totalChats += u.chatCount || 0;
      });
      adminStats.innerHTML = `
        <div class="stats-grid">
          <div class="stat-card"><div class="num">${totalUsers}</div><div class="label">Пользователей</div></div>
          <div class="stat-card"><div class="num">${totalMessages}</div><div class="label">Сообщений</div></div>
          <div class="stat-card"><div class="num">${totalChats}</div><div class="label">Чатов создано</div></div>
        </div>
      `;
    }
    exportStatsBtn.addEventListener('click', function() {
      const data = { exportedAt: new Date().toISOString(), stats, chats, config };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `jarvis_stats_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      addSystemMessage('📥 Статистика скачана.');
    });
    closeAdminBtn.addEventListener('click', () => adminPanel.classList.remove('active'));
    adminPanel.addEventListener('click', (e) => { if (e.target === adminPanel) adminPanel.classList.remove('active'); });

    // ---------- Остальные события ----------
    newChatBtn.addEventListener('click', createNewChat);
    chatTitleInput.addEventListener('change', function() {
      const newName = this.value.trim();
      if (!newName) return;
      const chat = chats.find(c => c.id === currentChatId);
      if (chat) { chat.name = newName; saveChats(); renderChatList(); }
    });
    sendBtn.addEventListener('click', () => handleSend(textInput.value, false));
    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(textInput.value, false); }
    });

    settingsBtn.addEventListener('click', () => {
      providerSelect.value = config.provider;
      systemPromptInput.value = config.systemPrompt || '';
      empathyMode.checked = config.empathy;
      deepAnalysis.checked = config.deep;
      creativeMode.checked = config.creative;
      selfLearn.checked = config.selfLearn;
      sourceCheck.checked = config.sourceCheck;
      showLineNumbers.checked = config.showLineNumbers;
      temperatureRange.value = Math.round(config.temperature * 100);
      tempValue.textContent = config.temperature.toFixed(1);
      knowledgeDomain.value = config.knowledge;
      themeSelect.value = config.theme || 'dark';
      langSelect.value = config.lang || 'ru';
      codeHelper.checked = config.codeHelper || false;
      webSearch.checked = config.webSearch || false;
      voiceCommands.checked = config.voiceCommands || false;
      pluginWeather.checked = config.pluginWeather || false;
      pluginCalendar.checked = config.pluginCalendar || false;
      pluginNews.checked = config.pluginNews || false;
      updateModelOptions();
      modelSelect.value = config.model || '';
      populateVoiceList();
      if (config.voiceURI) voiceSelect.value = config.voiceURI;
      modal.classList.add('active');
    });
    modalClose.addEventListener('click', () => modal.classList.remove('active'));
    modalSave.addEventListener('click', () => {
      saveConfig();
      modal.classList.remove('active');
      addSystemMessage('⚙️ Настройки сохранены.');
    });
    providerSelect.addEventListener('change', () => { updateModelOptions(); });
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });
    temperatureRange.addEventListener('input', function() {
      const val = (this.value / 100).toFixed(1);
      tempValue.textContent = val;
    });

    clearBtn.addEventListener('click', clearChat);
    attachBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        pendingImage = event.target.result;
        attachBtn.classList.add('has-attachment');
        addSystemMessage(`📎 Изображение прикреплено (${file.name})`);
        const imgHtml = `<div style="max-width:200px; border-radius:12px; overflow:hidden; margin:4px 0;"><img src="${pendingImage}" style="width:100%; display:block;" /></div>`;
        addMessage('user', imgHtml, true);
        fileInput.value = '';
      };
      reader.readAsDataURL(file);
    });

    stopBtn.addEventListener('click', function() {
      if (abortController) {
        abortController.abort();
        abortController = null;
        isGenerating = false;
        hideThinking();
        document.querySelector('.avatar')?.classList.remove('pulse');
        stopBtn.style.display = 'none';
        sendBtn.style.display = 'flex';
        addSystemMessage('⏹ Генерация остановлена.');
      }
    });

    // Меню пользователя (аватар)
    userInfo.addEventListener('click', function() {
      if (confirm('Выйти из аккаунта?')) {
        localStorage.removeItem('jarvis_auth');
        localStorage.removeItem('jarvis_user');
        localStorage.removeItem('jarvis_chats');
        localStorage.removeItem('jarvis_config');
        location.reload();
      }
    });

    // Авторизация (упрощённо)
    let generatedCode = '';
    async function sendVerificationCode(email) {
      const code = Math.floor(100000 + Math.random() * 900000).toString();
      generatedCode = code;
      authMessage.textContent = `🔑 Тестовый код: ${code} (также в консоли)`;
      authMessage.style.color = '#6bff6b';
      console.log(`📧 Код для ${email}: ${code}`);
      return true;
    }
    sendCodeBtn.addEventListener('click', async function() {
      const email = authEmail.value.trim();
      if (!email || !email.includes('@')) { authMessage.textContent = '❌ Введите корректный email.'; authMessage.style.color = '#ff6b6b'; return; }
      authMessage.textContent = '⏳ Отправка...';
      authMessage.style.color = '#b0c4ff';
      await sendVerificationCode(email);
    });
    confirmBtn.addEventListener('click', function() {
      const code = authCode.value.trim();
      if (!code) { authMessage.textContent = '❌ Введите код.'; authMessage.style.color = '#ff6b6b'; return; }
      if (code === generatedCode) {
        userEmail = authEmail.value.trim();
        userName = userEmail.split('@')[0] || 'Пользователь';
        userNameDisplay.textContent = userName;
        userEmailDisplay.textContent = userEmail;
        userAvatar.textContent = userName.charAt(0).toUpperCase();
        authOverlay.classList.add('hidden');
        localStorage.setItem('jarvis_auth', 'true');
        localStorage.setItem('jarvis_user', JSON.stringify({ email: userEmail, name: userName }));
        loadStats();
        loadChats();
        addSystemMessage(`👋 Привет, ${userName}! Я Джарвис. Чем могу помочь, сер?`);
      } else {
        authMessage.textContent = '❌ Неверный код. Попробуйте ещё раз.';
        authMessage.style.color = '#ff6b6b';
      }
    });
    function checkSession() {
      const auth = localStorage.getItem('jarvis_auth');
      if (auth === 'true') {
        const userData = localStorage.getItem('jarvis_user');
        if (userData) {
          try {
            const parsed = JSON.parse(userData);
            userEmail = parsed.email || '';
            userName = parsed.name || 'Пользователь';
          } catch(e) {}
        }
        userNameDisplay.textContent = userName;
        userEmailDisplay.textContent = userEmail;
        userAvatar.textContent = userName.charAt(0).toUpperCase();
        authOverlay.classList.add('hidden');
        loadStats();
        loadChats();
        addSystemMessage(`👋 Привет, ${userName}! Я Джарвис. Чем могу помочь, сер?`);
      } else {
        authOverlay.classList.remove('hidden');
      }
    }

    function loadStats() {
      try { const saved = localStorage.getItem('jarvis_stats'); if (saved) stats = JSON.parse(saved); else stats = { users: {} }; } catch(e) { stats = { users: {} }; }
    }
    function saveStats() { localStorage.setItem('jarvis_stats', JSON.stringify(stats)); }
    function updateUserStats(email, name) {
      if (!email) return;
      if (!stats.users[email]) {
        stats.users[email] = { name: name || email.split('@')[0] || 'Пользователь', firstSeen: new Date().toISOString(), messageCount: 0, chatCount: 0 };
      } else if (name) stats.users[email].name = name;
      saveStats();
    }

    function toggleSidebar() { sidebar.classList.toggle('open'); sidebarOverlay.classList.toggle('active'); }
    function closeSidebar() { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('active'); }
    menuToggle.addEventListener('click', toggleSidebar);
    sidebarOverlay.addEventListener('click', closeSidebar);

    // Инициализация
    loadConfig();
    setTimeout(populateVoiceList, 600);
    checkSession();

    // При загрузке голоса для ElevenLabs подгружаем список голосов (но они уже есть в populateVoiceList)
    // Если ElevenLabs ключ невалиден, используем fallback.

  })();
</script>
</body>
</html>
