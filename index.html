<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Jarvis 3.4 · AI Assistant</title>
  <style>
    /* ---------- RESET & GLOBAL ---------- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #080b12;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      color: #e8edf5;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .app {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      max-height: 900px;
      background: #0b0e16;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 60px rgba(0,0,0,0.8);
    }
    @media (min-width: 431px) {
      .app { border-radius: 44px; }
    }

    /* ---------- HEADER ---------- */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px 6px;
      flex-shrink: 0;
      border-bottom: none;
    }
    .header .logo {
      font-size: 22px;
      font-weight: 700;
      color: #eef3ff;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .header .logo small {
      font-size: 12px;
      font-weight: 400;
      color: #6a7ba8;
      background: rgba(255,255,255,0.04);
      padding: 2px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .header-actions {
      display: flex;
      gap: 4px;
    }
    .header-actions button {
      background: rgba(255,255,255,0.04);
      border: none;
      color: #8e9fd3;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
    .header-actions button:hover { background: rgba(255,255,255,0.08); }
    .header-actions button svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    /* ---------- MAIN CONTENT ---------- */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px 8px;
      display: flex;
      flex-direction: column;
    }
    .main-content::-webkit-scrollbar { width: 3px; }
    .main-content::-webkit-scrollbar-thumb { background: #2a3150; border-radius: 8px; }

    /* ---------- GREETING ---------- */
    .greeting {
      padding: 18px 0 4px;
      flex-shrink: 0;
    }
    .greeting .time {
      font-size: 16px;
      font-weight: 400;
      color: #b0c4ff;
      letter-spacing: 0.3px;
    }
    .greeting .name {
      font-size: 32px;
      font-weight: 700;
      color: #eef3ff;
      margin-top: 2px;
      letter-spacing: -0.5px;
      word-break: break-word;
    }
    .greeting .sub {
      font-size: 15px;
      color: #6a7ba8;
      margin-top: 6px;
      font-weight: 400;
    }

    /* ---------- NERUAL PLANET (орб с нейросетью) ---------- */
    .orb-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px 0 10px;
      flex-shrink: 0;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 1;
      transform: scale(1);
      max-height: 280px;
      overflow: hidden;
      position: relative;
    }
    .orb-wrapper.hidden {
      opacity: 0;
      transform: scale(0.6);
      max-height: 0;
      padding: 0;
      margin: 0;
      pointer-events: none;
    }
    .orb-container {
      position: relative;
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Основная планета */
    .orb {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #4a6aff, #1a2a6a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 600;
      color: #fff;
      box-shadow: 0 8px 32px rgba(74,106,255,0.2);
      position: relative;
      transition: box-shadow 0.4s;
      flex-shrink: 0;
      cursor: pointer;
      z-index: 2;
    }
    .orb .letter {
      z-index: 3;
      font-size: 32px;
      font-weight: 600;
    }
    /* Анимированные кольца – "нейросеть" */
    .orb .ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(74,106,255,0.2);
      animation: ringExpand 3s infinite ease-out;
      pointer-events: none;
      z-index: 1;
    }
    .orb .ring:nth-child(2) { animation-delay: 0.6s; border-color: rgba(74,106,255,0.15); }
    .orb .ring:nth-child(3) { animation-delay: 1.2s; border-color: rgba(74,106,255,0.10); }
    .orb .ring:nth-child(4) { animation-delay: 1.8s; border-color: rgba(74,106,255,0.05); }
    @keyframes ringExpand {
      0% { transform: scale(1); opacity:0.6; }
      100% { transform: scale(1.8); opacity:0; }
    }
    /* Активные состояния */
    .orb.active {
      box-shadow: 0 0 0 0 rgba(74,106,255,0.6);
      animation: pulseGlow 1.5s infinite;
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 0 rgba(74,106,255,0.5); transform: scale(1); }
      50% { box-shadow: 0 0 0 30px rgba(74,106,255,0); transform: scale(1.04); }
      100% { box-shadow: 0 0 0 0 rgba(74,106,255,0); transform: scale(1); }
    }
    .orb.speaking {
      box-shadow: 0 0 50px rgba(74,106,255,0.5);
      animation: speakPulse 0.8s infinite alternate;
    }
    @keyframes speakPulse {
      0% { box-shadow: 0 0 30px rgba(74,106,255,0.3); transform: scale(1); }
      100% { box-shadow: 0 0 60px rgba(74,106,255,0.6); transform: scale(1.03); }
    }
    /* Дополнительные нейрон-точки вокруг планеты */
    .neuron-dot {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4a6aff;
      opacity: 0.4;
      animation: neuronFloat 4s infinite ease-in-out;
      z-index: 1;
      pointer-events: none;
    }
    .neuron-dot:nth-child(5) { top: -10px; left: 20%; animation-delay: 0.2s; }
    .neuron-dot:nth-child(6) { top: 15%; right: -12px; animation-delay: 0.8s; }
    .neuron-dot:nth-child(7) { bottom: -8px; right: 25%; animation-delay: 1.4s; }
    .neuron-dot:nth-child(8) { bottom: 20%; left: -10px; animation-delay: 2.0s; }
    .neuron-dot:nth-child(9) { top: 40%; left: -15px; animation-delay: 0.5s; }
    .neuron-dot:nth-child(10) { top: 50%; right: -15px; animation-delay: 1.1s; }
    @keyframes neuronFloat {
      0% { transform: translate(0,0) scale(1); opacity:0.3; }
      50% { transform: translate(8px,-12px) scale(1.6); opacity:0.8; }
      100% { transform: translate(0,0) scale(1); opacity:0.3; }
    }

    .orb-status {
      font-size: 15px;
      font-weight: 500;
      color: #b0c4ff;
      margin-top: 14px;
      transition: 0.3s;
      text-align: center;
    }
    .orb-sub {
      font-size: 13px;
      color: #6a7ba8;
      text-align: center;
      max-width: 280px;
      line-height: 1.4;
      margin-top: 2px;
    }

    /* ---------- TRANSCRIPT (чат) ---------- */
    .transcript {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0 8px;
      margin: 0 -4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .transcript-item {
      padding: 8px 12px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.5;
      animation: fadeItem 0.25s ease;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    @keyframes fadeItem {
      from { opacity:0; transform: translateY(6px); }
      to { opacity:1; transform: translateY(0); }
    }
    .transcript-item.user {
      background: rgba(74,106,255,0.08);
      border: 1px solid rgba(74,106,255,0.06);
      justify-content: flex-end;
    }
    .transcript-item.jarvis {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.04);
    }
    .transcript-item .icon {
      flex-shrink: 0;
      width: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .transcript-item .icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .transcript-item .text { flex: 1; word-break: break-word; }
    .transcript-item .time { font-size: 11px; color: #5a6a8a; flex-shrink: 0; margin-left: 8px; align-self: center; }

    /* ---------- INPUT AREA ---------- */
    .input-area {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0 4px;
      border-top: 1px solid rgba(255,255,255,0.04);
      flex-shrink: 0;
    }
    .input-area input {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 40px;
      padding: 10px 16px;
      color: #eef3ff;
      font-size: 15px;
      outline: none;
      font-family: inherit;
      transition: border 0.2s;
    }
    .input-area input:focus { border-color: #4a6aff; }
    .input-area input::placeholder { color: #6a7ba8; }
    .input-area button {
      background: rgba(255,255,255,0.04);
      border: none;
      color: #b0c4ff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
    .input-area button:hover { background: rgba(255,255,255,0.08); }
    .input-area button:active { transform: scale(0.92); }
    .input-area button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .input-area .mic-btn.listening svg { color: #ff6b6b; }
    .input-area .mic-btn.listening {
      background: rgba(255,70,70,0.15);
      animation: micPulse 1.2s infinite;
    }
    @keyframes micPulse {
      0% { box-shadow: 0 0 0 0 rgba(255,70,70,0.3); }
      50% { box-shadow: 0 0 0 16px rgba(255,70,70,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,70,70,0); }
    }

    /* ---------- TODAY VIEW ---------- */
    .view { display: none; flex-direction: column; height: 100%; padding-top: 4px; }
    .view.active { display: flex; }
    .view-header {
      font-size: 28px;
      font-weight: 700;
      color: #eef3ff;
      margin-bottom: 2px;
    }
    .view-sub {
      font-size: 14px;
      color: #6a7ba8;
      margin-bottom: 14px;
    }
    .today-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .today-item .check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #4a6aff;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .today-item .check.done {
      background: #4a6aff;
      border-color: #4a6aff;
    }
    .today-item .check.done svg { stroke: white; }
    .today-item .task-text {
      flex: 1;
      font-size: 15px;
      color: #eef3ff;
    }
    .today-item .task-text.done {
      text-decoration: line-through;
      color: #6a7ba8;
    }
    .today-item .task-delete {
      background: none;
      border: none;
      color: #6a7ba8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }
    .today-item .task-delete:hover { color: #ff6b6b; }
    .today-item .task-delete svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    .empty-state {
      color: #6a7ba8;
      font-size: 15px;
      text-align: center;
      padding: 40px 0;
      line-height: 1.6;
    }

    /* ---------- MEMORY VIEW ---------- */
    .memory-search {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 30px;
      padding: 10px 16px;
      color: #eef3ff;
      font-size: 15px;
      outline: none;
      width: 100%;
      margin-bottom: 14px;
      font-family: inherit;
    }
    .memory-search::placeholder { color: #6a7ba8; }
    .memory-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 6px;
      font-size: 15px;
      color: #eef3ff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .memory-item .mem-delete {
      background: none;
      border: none;
      color: #6a7ba8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }
    .memory-item .mem-delete:hover { color: #ff6b6b; }
    .memory-item .mem-delete svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    /* ---------- BOTTOM NAV ---------- */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 6px 0 10px;
      border-top: 1px solid rgba(255,255,255,0.04);
      flex-shrink: 0;
      background: #0b0e16;
    }
    .bottom-nav .nav-item {
      background: none;
      border: none;
      color: #6a7ba8;
      font-size: 12px;
      font-weight: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      transition: 0.2s;
      padding: 4px 12px;
      font-family: inherit;
      letter-spacing: 0.3px;
    }
    .bottom-nav .nav-item .nav-icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bottom-nav .nav-item .nav-icon svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .bottom-nav .nav-item.active {
      color: #b0c4ff;
    }
    .bottom-nav .nav-item.active .nav-icon svg {
      stroke: #4a6aff;
    }

    /* ---------- SETTINGS MODAL ---------- */
    .settings-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(20px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }
    .settings-overlay.active { display: flex; }
    .settings-modal {
      background: #141a26;
      border-radius: 32px;
      padding: 28px 24px;
      max-width: 400px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid rgba(255,255,255,0.04);
      box-shadow: 0 40px 80px rgba(0,0,0,0.8);
    }
    .settings-modal h2 {
      font-size: 22px;
      font-weight: 700;
      color: #eef3ff;
      margin-bottom: 20px;
    }
    .settings-modal .setting-group {
      margin-bottom: 18px;
    }
    .settings-modal .setting-group label {
      display: block;
      font-size: 13px;
      color: #96a7d9;
      margin-bottom: 4px;
    }
    .settings-modal .setting-group select,
    .settings-modal .setting-group input {
      width: 100%;
      padding: 10px 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      color: #eef3ff;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }
    .settings-modal .setting-group select option { background: #141a26; }
    .settings-modal .setting-group .range-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 0;
    }
    .settings-modal .setting-group .range-wrap input[type="range"] {
      flex: 1;
      accent-color: #4a6aff;
      background: transparent;
    }
    .settings-modal .setting-group .range-wrap span {
      color: #b0c4ff;
      font-size: 14px;
      min-width: 32px;
      text-align: center;
    }
    .settings-modal .setting-group .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
    }
    .settings-modal .setting-group .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #4a6aff;
    }
    .settings-modal .setting-group .checkbox-group label {
      margin: 0;
      font-size: 14px;
      color: #eef3ff;
      cursor: pointer;
    }
    .settings-modal .settings-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      justify-content: flex-end;
    }
    .settings-modal .settings-actions button {
      padding: 10px 22px;
      border: none;
      border-radius: 30px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }
    .settings-modal .settings-actions .btn-primary {
      background: #4a6aff;
      color: white;
    }
    .settings-modal .settings-actions .btn-primary:hover { background: #5a7aff; }
    .settings-modal .settings-actions .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: #b0c4ff;
    }
    .settings-modal .settings-actions .btn-secondary:hover { background: rgba(255,255,255,0.1); }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 430px) {
      .app { max-height: 100vh; }
      .header { padding: 10px 16px 4px; }
      .main-content { padding: 0 16px 6px; }
      .greeting .name { font-size: 28px; }
      .orb-container { width: 84px; height: 84px; }
      .orb { width: 76px; height: 76px; font-size: 28px; }
      .input-area input { font-size: 14px; padding: 8px 14px; }
      .view-header { font-size: 24px; }
    }
    @media (max-width: 380px) {
      .orb-container { width: 72px; height: 72px; }
      .orb { width: 64px; height: 64px; font-size: 24px; }
      .input-area button { width: 38px; height: 38px; }
      .input-area button svg { width: 20px; height: 20px; }
    }
  </style>
</head>
<body>
<div class="app" id="app">
  <!-- Header -->
  <div class="header">
    <div class="logo">Jarvis <small>3.4</small></div>
    <div class="header-actions">
      <button id="settingsBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content" id="mainContent">
    <!-- Chat View -->
    <div class="view active" id="chatView">
      <div class="greeting" id="greetingBlock">
        <div class="time" id="greetingTime">Evening,</div>
        <div class="name" id="greetingName">NODE / хелюк</div>
        <div class="sub" id="greetingSub">Ask for your evening brief</div>
      </div>

      <!-- Orb (нейросеть-планета) -->
      <div class="orb-wrapper" id="orbWrapper">
        <div class="orb-container" id="orbContainer">
          <div class="orb" id="orb">
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <span class="letter" id="orbLetter">J</span>
            <!-- Нейрон-точки -->
            <div class="neuron-dot"></div>
            <div class="neuron-dot"></div>
            <div class="neuron-dot"></div>
            <div class="neuron-dot"></div>
            <div class="neuron-dot"></div>
            <div class="neuron-dot"></div>
          </div>
        </div>
        <div class="orb-status" id="orbStatus">Tap the orb to continue</div>
        <div class="orb-sub" id="orbSub">Jarvis is listening...</div>
      </div>

      <!-- Transcript -->

    // ---------- Memory ----------

      memoryList.innerHTML = '';

    // ---------- Transcript ----------
    function addTranscript(role, text) {
      const div = document.createElement('div');
      div.className = `transcript-item ${role}`;

    // ---------- Speech Recognition ----------
    function initRecognition() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        orbSub.textContent = 'Voice input not supported.';
        return false;
      }
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SR();
      recognition.lang = 'ru-RU';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = function() {
        isListening = true;
        micBtn.classList.add('listening');
        orb.classList.add('active');
        orbStatus.textContent = 'Listening…';
        orbSub.textContent = 'Jarvis is listening…';
      };

      recognition.onresult = function(e) {
        const text = e.results[e.results.length-1][0].transcript.trim();
        if (text) {
          addTranscript('user', text);
          stopListening();
          processUserInput(text);
        } else {
          stopListening();
        }
      };

      recognition.onerror = function(e) {
        if (e.error === 'not-allowed') {
          orbSub.textContent = '⚠️ Allow microphone access.';
        } else if (e.error === 'no-speech') {
          orbSub.textContent = 'No speech detected. Try again.';
        } else {
          orbSub.textContent = `Error: ${e.error}`;
        }
        stopListening();
      };

      recognition.onend = function() {
        if (isListening) stopListening();
      };

      return true;
    }

    function startListening() {
      if (isProcessing) return;
      if (!recognition) {
        if (!initRecognition()) return;
      }
      try { recognition.start(); } catch(e) {}
    }

      isListening = false;
      micBtn.classList.remove('listening');
      orb.classList.remove('active');
      orbStatus.textContent = 'Tap the orb to continue';
      orbSub.textContent = 'Jarvis is listening…';
      if (recognition) { try { recognition.stop(); } catch(e) {} }
    }

    micBtn.addEventListener('click', function() {
      if (isProcessing) return;
      if (isListening) {
        stopListening();
      } else {
        startListening();

    sendBtn.addEventListener('click', function() {

    // ---------- Process AI ----------
    async function processUserInput(text) {
      if (isProcessing) return;
      isProcessing = true;
      orbStatus.textContent = 'Thinking…';
      orbSub.textContent = 'Processing your request…';
      orb.classList.add('speaking');

      const rememberMatch = text.match(/remember that\s*(.+)/i);
      if (rememberMatch && config.memory) {
        const fact = rememberMatch[1].trim();
        if (fact) {
          memories.push({ id: Date.now().toString(36), text: fact });
          saveState();
          renderMemory();
          addTranscript('jarvis', `I'll remember: "${fact}"`);
          speakText(`I'll remember that, сер.`);
          isProcessing = false;
          orb.classList.remove('speaking');
          orbStatus.textContent = 'Tap the orb to continue';
          orbSub.textContent = 'Jarvis is listening…';
          return;
        }
      }

      const remindMatch = text.match(/remind me to\s*(.+)/i);
      if (remindMatch && config.memory) {
        const taskText = remindMatch[1].trim();
        if (taskText) {
          tasks.push({ id: Date.now().toString(36), text: taskText, done: false });
          saveState();
          renderToday();
          addTranscript('jarvis', `Reminder set: "${taskText}"`);
          speakText(`Reminder set, сер.`);
          isProcessing = false;
          orb.classList.remove('speaking');
          orbStatus.textContent = 'Tap the orb to continue';
          orbSub.textContent = 'Jarvis is listening…';
          return;
        }
      }

      try {
        const answer = await callAI(text);
        if (answer) {
          let finalText = answer;
          if (!finalText.toLowerCase().includes('сер')) {
            finalText += ', сер.';
          }
          addTranscript('jarvis', finalText);
          speakText(finalText);
        } else {
          addTranscript('jarvis', 'I could not process that request, сер.');
        }
      } catch (e) {
        addTranscript('jarvis', `Error: ${e.message || 'Unknown error'}`);
      } finally {
        isProcessing = false;
        orb.classList.remove('speaking');
        orbStatus.textContent = 'Tap the orb to continue';
        orbSub.textContent = 'Jarvis is listening…';
      }
    }

    // ---------- AI Call ----------
    async function callAI(userText) {
      const provider = config.provider;
      const model = config.model;
      const temperature = config.temperature || 0.7;

      let personality = '';
      if (config.personality === 'warm') personality = 'You are warm, friendly, caring.';
      else if (config.personality === 'professional') personality = 'You are professional, concise, business-like.';
      else if (config.personality === 'casual') personality = 'You are casual, simple, conversational.';

      const messages = [];
      messages.push({ role: 'system', content: `${SYSTEM_PROMPT}\n${personality}` });
      const history = conversationHistory.slice(-10);
      history.forEach(msg => {
        messages.push({ role: msg.role === 'user' ? 'user' : 'assistant', content: msg.content });
      });
      if (messages[messages.length-1]?.role !== 'user') {
        messages.push({ role: 'user', content: userText });
      }

      const providers = [provider, 'openai', 'groq', 'openrouter'];
      let lastError = null;

      for (const p of providers) {
        try {
          if (p === 'openai') {
            if (!OPENAI_API_KEY) throw new Error('OpenAI key missing');
            const resp = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${OPENAI_API_KEY}`
              },
              body: JSON.stringify({
                model: model || 'gpt-4o-mini',
                messages: messages,
                temperature: temperature,
                max_tokens: 2048,
              })
            });
            if (!resp.ok) {
              const err = await resp.text();
              throw new Error(`OpenAI error (${resp.status}): ${err}`);
            }
            const data = await resp.json();
            return data?.choices?.[0]?.message?.content || 'No response.';
          }
          else if (p === 'groq') {
            if (!GROQ_API_KEY) throw new Error('Groq key missing');
            const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${GROQ_API_KEY}`
              },
              body: JSON.stringify({
                model: model || 'llama3-70b-8192',
                messages: messages,
                temperature: temperature,
                max_tokens: 2048,
              })
            });
            if (!resp.ok) {
              const err = await resp.text();
              throw new Error(`Groq error (${resp.status}): ${err}`);
            }
            const data = await resp.json();
            return data?.choices?.[0]?.message?.content || 'No response.';
          }
          else if (p === 'openrouter') {
            if (!OPENROUTER_API_KEY) throw new Error('OpenRouter key missing');
            const resp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${OPENROUTER_API_KEY}`,
                'HTTP-Referer': window.location.origin,
                'X-Title': 'Jarvis 3.4'
              },
              body: JSON.stringify({
                model: model || 'mistralai/mistral-7b-instruct:free',
                messages: messages,
                temperature: temperature,
                max_tokens: 2048,
              })
            });
            if (!resp.ok) {
              const err = await resp.text();
              throw new Error(`OpenRouter error (${resp.status}): ${err}`);
            }
            const data = await resp.json();
            return data?.choices?.[0]?.message?.content || 'No response.';
          }
        } catch (e) {
          lastError = e;
          console.warn(`Provider ${p} failed:`, e.message);
          if (p === providers[providers.length-1]) {
            throw new Error(`All providers failed. Last error: ${e.message}`);
          }
        }
      }
      throw new Error('Unknown AI error.');
    }

    // ---------- Speech Synthesis ----------
    async function speakText(text) {
      if (ELEVENLABS_API_KEY && JARVIS_VOICE_ID) {
        try {
          const resp = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${JARVIS_VOICE_ID}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'xi-api-key': ELEVENLABS_API_KEY,
            },
            body: JSON.stringify({
              text: text,
              model_id: 'eleven_monolingual_v1',
              voice_settings: { stability: 0.5, similarity_boost: 0.75 },
            }),
          });
          if (resp.ok) {
            const blob = await resp.blob();
            const url = URL.createObjectURL(blob);
            const audio = new Audio(url);
            audio.onended = () => {
              URL.revokeObjectURL(url);
              orb.classList.remove('speaking');
            };
            audio.onplay = () => {
              orb.classList.add('speaking');
              orbStatus.textContent = 'Speaking…';
              orbSub.textContent = 'Jarvis is speaking…';
            };
            audio.play();
            return;
          }
        } catch(e) {}
      }

      // Fallback
      if (!('speechSynthesis' in window)) return;
      if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ru-RU';
      utterance.rate = 0.82;
      utterance.pitch = 0.55;
      utterance.volume = 1;
      const voices = speechSynthesis.getVoices();
      const ruVoice = voices.find(v => v.lang.startsWith('ru'));
      if (ruVoice) utterance.voice = ruVoice;
      utterance.onstart = () => {
        orb.classList.add('speaking');
        orbStatus.textContent = 'Speaking…';
        orbSub.textContent = 'Jarvis is speaking…';
      };
      utterance.onend = () => {
        orb.classList.remove('speaking');
        if (!isListening) {
          orbStatus.textContent = 'Tap the orb to continue';
          orbSub.textContent = 'Jarvis is listening…';
        }
      };
      utterance.onerror = () => {
        orb.classList.remove('speaking');
        if (!isListening) {
          orbStatus.textContent = 'Tap the orb to continue';
          orbSub.textContent = 'Jarvis is listening…';
        }
      };
      window.speechSynthesis.speak(utterance);
    }

    // ---------- Settings ----------
    settingsBtn.addEventListener('click', () => {
      settingsModal.classList.add('active');
    });
    settingsClose.addEventListener('click', () => {
      settingsModal.classList.remove('active');
    });
    settingsSave.addEventListener('click', () => {
      config.userName = userNameInput.value.trim() || 'NODE / хелюк';
      config.personality = personalitySelect.value;
      config.voice = voiceSelect.value;
      config.theme = themeSelect.value;
      config.language = langSelect.value;
      config.temperature = parseFloat((tempRange.value / 100).toFixed(1));
      config.memory = memoryEnabled.checked;
      config.provider = providerSelect.value;
      config.model = modelSelect.value;
      saveState();
      applyConfigUI();
      settingsModal.classList.remove('active');
      updateGreeting();
      orbSub.textContent = 'Settings saved';
      setTimeout(() => {
        orbSub.textContent = 'Jarvis is listening…';
      }, 1500);
    });

    providerSelect.addEventListener('change', updateModelOptions);

    tempRange.addEventListener('input', function() {
      const val = (this.value / 100).toFixed(1);
      tempValue.textContent = val;
    });

    settingsModal.addEventListener('click', (e) => {
      if (e.target === settingsModal) settingsModal.classList.remove('active');
    });

    // ---------- Init ----------
    init();

    if (speechSynthesis) {
      speechSynthesis.onvoiceschanged = () => {};
    }

  })();
</script>
