<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jarvis</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0d;
      color: #f2f2f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .app {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      background: radial-gradient(120% 80% at 50% 0%, #101018, #0a0a0d);
      display: flex;
      flex-direction: column;
      padding: 16px 20px;
      overflow: hidden;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
    }
    .header h1 { font-size: 22px; font-weight: 700; }
    .header button {
      background: transparent;
      border: none;
      color: #8a8a95;
      font-size: 22px;
      cursor: pointer;
      padding: 4px 8px;
    }
    .header button:active { opacity: 0.6; }

    /* Greeting */
    .greeting { text-align: center; padding: 8px 0 12px; }
    .greeting .time { font-size: 16px; color: #8a8a95; }
    .greeting .name { font-size: 30px; font-weight: 700; margin-top: 2px; }
    .greeting .sub { font-size: 15px; color: #8a8a95; margin-top: 4px; }

    /* Orb */
    .orb-wrap { display: flex; justify-content: center; padding: 8px 0 14px; }
    .orb {
      width: 90px; height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #7a7ad4, #3a3a7a);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 30px rgba(139,139,214,0.25);
      font-size: 40px;
      font-weight: 700;
      color: white;
      transition: 0.3s;
      cursor: pointer;
      position: relative;
    }
    .orb::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px solid rgba(139,139,214,0.15);
      animation: ring 3s infinite;
    }
    @keyframes ring {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.5); opacity: 0; }
    }
    .orb.listening { animation: pulse 1.5s infinite; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(139,139,214,0.5); transform: scale(1); }
      50% { box-shadow: 0 0 0 25px rgba(139,139,214,0); transform: scale(1.04); }
      100% { box-shadow: 0 0 0 0 rgba(139,139,214,0); transform: scale(1); }
    }

    /* Chat */
    .chat {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 4px 0;
      margin-bottom: 8px;
    }
    .chat .msg {
      max-width: 85%;
      padding: 8px 12px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.4;
      animation: fade .25s;
    }
    @keyframes fade { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: none; } }
    .chat .user {
      align-self: flex-end;
      background: rgba(139,139,214,0.12);
      border: 1px solid rgba(139,139,214,0.08);
    }
    .chat .jarvis {
      align-self: flex-start;
      background: #141419;
      border: 1px solid #26262f;
    }
    .chat .time { font-size: 11px; color: #5c5c66; float: right; margin-left: 10px; }

    /* Input */
    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
      background: #141419;
      border: 1px solid #26262f;
      border-radius: 26px;
      padding: 4px 4px 4px 16px;
    }
    .input-row input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #f2f2f5;
      font-size: 15px;
      padding: 10px 0;
    }
    .input-row input::placeholder { color: #5c5c66; }
    .input-row button {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #8a8a95;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
    .input-row button:active { transform: scale(0.9); }
    .input-row .mic { color: #a5a5e6; }
    .input-row .mic.listening { color: #e06a6a; background: rgba(224,106,106,0.12); }
    .input-row .send {
      background: #8b8bd6;
      color: #0a0a0d;
      box-shadow: 0 4px 16px rgba(139,139,214,0.25);
    }
    .input-row .send:hover { background: #a5a5e6; }

    /* Bottom nav */
    .nav {
      display: flex;
      justify-content: space-around;
      border-top: 1px solid #26262f;
      padding: 10px 0 6px;
      margin-top: 4px;
    }
    .nav button {
      background: none;
      border: none;
      color: #5c5c66;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      padding: 4px 12px;
      font-family: inherit;
    }
    .nav button.active { color: #8b8bd6; }
    .nav button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; }

    /* Other screens (скрыты по умолчанию) */
    .screen { display: none; flex-direction: column; flex: 1; }
    .screen.active { display: flex; }
    .screen-title { font-size: 30px; font-weight: 700; margin: 20px 0 4px; }
    .screen-sub { color: #8a8a95; font-size: 15px; margin-bottom: 16px; }
    .list-item {
      background: #141419;
      border: 1px solid #26262f;
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .list-item .del { background: none; border: none; color: #5c5c66; font-size: 18px; cursor: pointer; }
    .list-item .del:hover { color: #e06a6a; }
    .empty { color: #5c5c66; text-align: center; margin-top: 40px; font-size: 15px; }
    .search {
      background: #141419;
      border: 1px solid #26262f;
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 14px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .search input { background: transparent; border: none; outline: none; color: #f2f2f5; flex: 1; font-size: 15px; }
    .search input::placeholder { color: #5c5c66; }
    .pill {
      background: #8b8bd6;
      color: #0a0a0d;
      border: none;
      padding: 10px 22px;
      border-radius: 22px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      align-self: flex-start;
    }
    .pill:active { transform: scale(0.94); }
    .settings-row {
      display: flex;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #26262f;
      cursor: pointer;
    }
    .settings-row:last-child { border-bottom: none; }
    .settings-row .label { font-size: 16px; }
    .settings-row .value { color: #8a8a95; }
  </style>
</head>
<body>
<div class="app" id="app">
  <!-- Header -->
  <div class="header">
    <h1>Jarvis</h1>
    <div>
      <button onclick="switchScreen('settings')" title="Settings">⚙️</button>
      <button onclick="switchScreen('history')" title="History">📜</button>
    </div>
  </div>

  <!-- === Jarvis Chat === -->
  <div class="screen active" id="screen-chat">
    <div class="greeting">
      <div class="time" id="greetTime">Evening,</div>
      <div class="name" id="greetName">NODE / хелюк</div>
      <div class="sub" id="greetSub">Ask for your evening brief</div>
    </div>
    <div class="orb-wrap">
      <div class="orb" id="orb">J</div>
    </div>
    <div class="chat" id="chatBox"></div>
    <div class="input-row">
      <input type="text" id="textInput" placeholder="Message Jarvis…" />
      <button class="mic" id="micBtn" aria-label="Voice">🎙️</button>
      <button class="send" id="sendBtn" aria-label="Send">➤</button>
    </div>
    <div class="nav">
      <button class="active" onclick="switchScreen('chat')">
        <svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 3v18M4 7.5l8 4.5 8-4.5"/></svg>
        Jarvis
      </button>
      <button onclick="switchScreen('today')">
        <svg viewBox="0 0 24 24"><path d="M4 6h13M4 12h13M4 18h13"/><path d="M20 5l-1.5 1.5L20 8M20 11l-1.5 1.5L20 14"/></svg>
        Today
      </button>
      <button onclick="switchScreen('memory')">
        <svg viewBox="0 0 24 24"><path d="M9 3a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 3 3V3zM15 3a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-3 3V3z"/></svg>
        Memory
      </button>
    </div>
  </div>

  <!-- === Today === -->
  <div class="screen" id="screen-today">
    <div class="screen-title">Today</div>
    <div class="screen-sub" id="todayDate"></div>
    <button class="pill" id="briefBtn">Brief me</button>
    <div id="todayList" style="flex:1; overflow-y:auto; margin-top:16px;"></div>
  </div>

  <!-- === Memory === -->
  <div class="screen" id="screen-memory">
    <div class="screen-title">Memory</div>
    <div class="screen-sub">What Jarvis remembers about you.</div>
    <div class="search">
      <span>🔍</span>
      <input type="text" id="memorySearch" placeholder="Search…" />
    </div>
    <div id="memoryList" style="flex:1; overflow-y:auto;"></div>
  </div>

  <!-- === History === -->
  <div class="screen" id="screen-history">
    <div class="screen-title" style="display:flex; justify-content:space-between; align-items:center;">
      <span>History</span>
      <button style="background:none;border:none;color:#5c5c66;font-size:20px;cursor:pointer;" id="clearHistoryBtn">🗑</button>
    </div>
    <div id="historyList" style="flex:1; overflow-y:auto; margin-top:8px;"></div>
    <div id="historyEmpty" class="empty">No conversations yet.</div>
  </div>

  <!-- === Settings === -->
  <div class="screen" id="screen-settings">
    <div class="screen-title">Settings</div>
    <div class="settings-row" id="rowName">
      <span class="label">Your name</span>
      <span class="value" id="settingsNameVal">NODE / хелюк</span>
    </div>
    <div class="settings-row" id="rowPersonality">
      <span class="label">Personality</span>
      <span class="value" id="settingsPersonalityVal">Warm</span>
    </div>
    <div class="settings-row" id="rowVoice">
      <span class="label">Voice</span>
      <span class="value" id="settingsVoiceVal">Jarvis</span>
    </div>
    <div class="settings-row" id="rowTheme">
      <span class="label">Theme</span>
      <span class="value" id="settingsThemeVal">Dark</span>
    </div>
    <div class="settings-row" id="rowMemoryToggle">
      <span class="label">Memory</span>
      <span class="value" id="settingsMemoryVal">On</span>
    </div>
    <div class="settings-row" id="rowProvider">
      <span class="label">Provider</span>
      <span class="value" id="settingsProviderVal">OpenAI</span>
    </div>
    <div style="margin-top:24px; border-top:1px solid #26262f; padding-top:16px;">
      <button onclick="if(confirm('Sign out?')){localStorage.clear();location.reload();}" style="background:none;border:none;color:#e06a6a;font-size:16px;cursor:pointer;">Sign out</button>
    </div>
  </div>
</div>

<script>
  (function() {
    'use strict';

    // ---------- Глобальные переменные ----------
    let isListening = false;
    let recognition = null;
    let messages = [];
    let tasks = [];
    let memories = [];
    let config = {
      userName: 'NODE / хелюк',
      personality: 'warm',
      voice: 'jarvis',
      theme: 'dark',
      memory: true,
      provider: 'openai'
    };

    // ---------- DOM ----------
    const chatBox = document.getElementById('chatBox');
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const orb = document.getElementById('orb');
    const greetTime = document.getElementById('greetTime');
    const greetName = document.getElementById('greetName');
    const greetSub = document.getElementById('greetSub');
    const todayDate = document.getElementById('todayDate');
    const todayList = document.getElementById('todayList');
    const memoryList = document.getElementById('memoryList');
    const memorySearch = document.getElementById('memorySearch');
    const historyList = document.getElementById('historyList');
    const historyEmpty = document.getElementById('historyEmpty');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const briefBtn = document.getElementById('briefBtn');

    // Settings elements
    const settingsNameVal = document.getElementById('settingsNameVal');
    const settingsPersonalityVal = document.getElementById('settingsPersonalityVal');
    const settingsVoiceVal = document.getElementById('settingsVoiceVal');
    const settingsThemeVal = document.getElementById('settingsThemeVal');
    const settingsMemoryVal = document.getElementById('settingsMemoryVal');
    const settingsProviderVal = document.getElementById('settingsProviderVal');

    // ---------- Инициализация ----------
    function init() {
      loadState();
      updateGreeting();
      updateTodayDate();
      renderToday();
      renderMemory();
      renderHistory();
      initRecognition();
      addMessage('jarvis', 'Здравствуйте, сер. Я Джарвис.');
      updateSettingsUI();
      setupSettings();
    }

    // ---------- State ----------
    function loadState() {
      try {
        const saved = localStorage.getItem('jarvis_config');
        if (saved) Object.assign(config, JSON.parse(saved));
        const tasksSaved = localStorage.getItem('jarvis_tasks');
        if (tasksSaved) tasks = JSON.parse(tasksSaved);
        const memSaved = localStorage.getItem('jarvis_memories');
        if (memSaved) memories = JSON.parse(memSaved);
        const msgsSaved = localStorage.getItem('jarvis_messages');
        if (msgsSaved) messages = JSON.parse(msgsSaved);
      } catch(e) {}
    }

    function saveState() {
      localStorage.setItem('jarvis_config', JSON.stringify(config));
      localStorage.setItem('jarvis_tasks', JSON.stringify(tasks));
      localStorage.setItem('jarvis_memories', JSON.stringify(memories));
      localStorage.setItem('jarvis_messages', JSON.stringify(messages));
    }

    // ---------- UI обновления ----------
    function updateGreeting() {
      const name = config.userName || 'NODE / хелюк';
      const hour = new Date().getHours();
      let time = 'Morning';
      if (hour >= 18) time = 'Evening';
      else if (hour >= 12) time = 'Afternoon';
      greetTime.textContent = time + ',';
      greetName.textContent = name;
      if (hour < 12) greetSub.textContent = 'Ask for your morning brief';
      else if (hour < 18) greetSub.textContent = 'Ask for your afternoon brief';
      else greetSub.textContent = 'Ask for your evening brief';
    }

    function updateSettingsUI() {
      settingsNameVal.textContent = config.userName || 'NODE / хелюк';
      settingsPersonalityVal.textContent = config.personality || 'warm';
      settingsVoiceVal.textContent = config.voice || 'jarvis';
      settingsThemeVal.textContent = config.theme || 'dark';
      settingsMemoryVal.textContent = config.memory ? 'On' : 'Off';
      settingsProviderVal.textContent = config.provider || 'openai';
    }

    function updateTodayDate() {
      const d = new Date();
      todayDate.textContent = d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' }).toUpperCase();
    }

    // ---------- Settings interactions ----------
    function setupSettings() {
      document.getElementById('rowName').addEventListener('click', () => {
        const newName = prompt('Enter your name:', config.userName);
        if (newName && newName.trim()) {
          config.userName = newName.trim();
          saveState();
          updateGreeting();
          updateSettingsUI();
        }
      });
      document.getElementById('rowPersonality').addEventListener('click', () => {
        const options = ['warm', 'professional', 'casual'];
        const labels = ['Warm', 'Professional', 'Casual'];
        let menu = 'Choose personality:\n';
        labels.forEach((l,i) => menu += `${i+1}. ${l}\n`);
        const choice = prompt(menu, '1');
        if (choice) {
          const idx = parseInt(choice) - 1;
          if (idx >= 0 && idx < options.length) {
            config.personality = options[idx];
            saveState();
            updateSettingsUI();
          }
        }
      });
      document.getElementById('rowVoice').addEventListener('click', () => {
        const options = ['jarvis', 'default', 'ru-RU', 'en-US'];
        const labels = ['Jarvis (ElevenLabs)', 'System', 'Russian', 'English'];
        let menu = 'Choose voice:\n';
        labels.forEach((l,i) => menu += `${i+1}. ${l}\n`);
        const choice = prompt(menu, '1');
        if (choice) {
          const idx = parseInt(choice) - 1;
          if (idx >= 0 && idx < options.length) {
            config.voice = options[idx];
            saveState();
            updateSettingsUI();
          }
        }
      });
      document.getElementById('rowTheme').addEventListener('click', () => {
        const newTheme = config.theme === 'dark' ? 'light' : 'dark';
        config.theme = newTheme;
        saveState();
        updateSettingsUI();
        applyTheme(newTheme);
      });
      document.getElementById('rowMemoryToggle').addEventListener('click', () => {
        config.memory = !config.memory;
        saveState();
        updateSettingsUI();
      });
      document.getElementById('rowProvider').addEventListener('click', () => {
        const options = ['openai', 'groq', 'openrouter'];
        const labels = ['OpenAI', 'Groq', 'OpenRouter'];
        let menu = 'Choose provider:\n';
        labels.forEach((l,i) => menu += `${i+1}. ${l}\n`);
        const choice = prompt(menu, '1');
        if (choice) {
          const idx = parseInt(choice) - 1;
          if (idx >= 0 && idx < options.length) {
            config.provider = options[idx];
            saveState();
            updateSettingsUI();
          }
        }
      });
    }

    function applyTheme(theme) {
      const bg = theme === 'light' ? '#f0f2f5' : '#0a0a0d';
      const appBg = theme === 'light' ? '#ffffff' : 'radial-gradient(120% 80% at 50% 0%, #101018 0%, #0a0a0d 55%)';
      document.body.style.background = bg;
      document.querySelector('.app').style.background = appBg;
    }

    // ---------- Screen switching ----------
    function switchScreen(name) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      const target = document.getElementById('screen-' + name);
      if (target) target.classList.add('active');
      // Обновляем содержимое при переключении
      if (name === 'today') renderToday();
      if (name === 'memory') renderMemory();
      if (name === 'history') renderHistory();
    }
    window.switchScreen = switchScreen;

    // ---------- Today ----------
    function renderToday() {
      todayList.innerHTML = '';
      if (tasks.length === 0) {
        todayList.innerHTML = '<div class="empty">Your to-dos and reminders show up here.</div>';
        return;
      }
      tasks.forEach((task, idx) => {
        const div = document.createElement('div');
        div.className = 'list-item';
        const span = document.createElement('span');
        span.textContent = task.text + (task.done ? ' ✅' : '');
        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = '✕';
        del.addEventListener('click', () => {
          tasks.splice(idx, 1);
          saveState();
          renderToday();
        });
        div.appendChild(span);
        div.appendChild(del);
        div.addEventListener('click', () => {
          task.done = !task.done;
          saveState();
          renderToday();
        });
        todayList.appendChild(div);
      });
    }

    briefBtn.addEventListener('click', () => {
      addMessage('user', 'Brief me');
      processUserInput('Brief me');
    });

    // ---------- Memory ----------
    function renderMemory(filter = '') {
      memoryList.innerHTML = '';
      let items = memories;
      if (filter) items = items.filter(m => m.text.toLowerCase().includes(filter.toLowerCase()));
      if (items.length === 0) {
        memoryList.innerHTML = '<div class="empty">Nothing yet. Say "remember that…"</div>';
        return;
      }
      items.forEach((mem, idx) => {
        const div = document.createElement('div');
        div.className = 'list-item';
        const span = document.createElement('span');
        span.textContent = mem.text;
        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = '✕';
        del.addEventListener('click', () => {
          memories.splice(idx, 1);
          saveState();
          renderMemory(memorySearch.value);
        });
        div.appendChild(span);
        div.appendChild(del);
        memoryList.appendChild(div);
      });
    }

    memorySearch.addEventListener('input', function() {
      renderMemory(this.value);
    });

    // ---------- History ----------
    function renderHistory() {
      historyList.innerHTML = '';
      if (messages.length === 0) {
        historyEmpty.style.display = 'block';
        return;
      }
      historyEmpty.style.display = 'none';
      // Показываем последние 10 сообщений (попарно)
      const pairs = [];
      for (let i = 0; i < messages.length; i += 2) {
        const user = messages[i];
        const jarvis = messages[i+1];
        if (user && user.role === 'user') {
          pairs.push({ user: user.text, jarvis: jarvis ? jarvis.text : '' });
        }
      }
      pairs.slice(-10).reverse().forEach(p => {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.style.cursor = 'pointer';
        const text = document.createTextNode(p.user.length > 40 ? p.user.slice(0,40)+'…' : p.user);
        div.appendChild(text);
        div.addEventListener('click', () => {
          switchScreen('chat');
          addMessage('user', p.user);
          if (p.jarvis) addMessage('jarvis', p.jarvis);
        });
        historyList.appendChild(div);
      });
    }

    clearHistoryBtn.addEventListener('click', () => {
      if (confirm('Clear all history?')) {
        messages = [];
        saveState();
        renderHistory();
        chatBox.innerHTML = '';
        addMessage('jarvis', 'History cleared, сер.');
      }
    });

    // ---------- Chat ----------
    function addMessage(role, text) {
      const div = document.createElement('div');
      div.className = 'msg ' + (role === 'user' ? 'user' : 'jarvis');
      const now = new Date();
      const time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
      div.innerHTML = `<span>${text}</span> <span class="time">${time}</span>`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      messages.push({ role, text });
      if (messages.length > 100) messages = messages.slice(-100);
      saveState();
      renderHistory();
    }

    // ---------- Speech Recognition ----------
    function initRecognition() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) return;
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SR();
      recognition.lang = 'ru-RU';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add('listening');
        orb.classList.add('listening');
      };

      recognition.onresult = (e) => {
        const text = e.results[e.results.length-1][0].transcript.trim();
        if (text) {
          addMessage('user', text);
          stopListening();
          processUserInput(text, true);
        } else {
          stopListening();
        }
      };

      recognition.onerror = () => stopListening();
      recognition.onend = () => { if (isListening) stopListening(); };
    }

    function startListening() {
      if (!recognition) return;
      try { recognition.start(); } catch(e) {}
    }

    function stopListening() {
      isListening = false;
      micBtn.classList.remove('listening');
      orb.classList.remove('listening');
      try { recognition.stop(); } catch(e) {}
    }

    micBtn.addEventListener('click', () => {
      if (isListening) stopListening();
      else startListening();
    });

    // ---------- Send text ----------
    sendBtn.addEventListener('click', () => {
      const text = textInput.value.trim();
      if (text) {
        addMessage('user', text);
        textInput.value = '';
        processUserInput(text, false);
      }
    });

    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); sendBtn.click(); }
    });

    // ---------- Process AI (заглушка для примера) ----------
    async function processUserInput(text, speak) {
      // Простая локальная обработка без API (для работоспособности)
      let reply = 'Извините, сер, я пока не подключён к API. Добавьте свои ключи в код.';
      // Пробуем обработать команды
      const lower = text.toLowerCase();
      if (lower.includes('remember that')) {
        const fact = text.replace(/remember that/i, '').trim();
        if (fact && config.memory) {
          memories.push({ id: Date.now().toString(36), text: fact });
          saveState();
          renderMemory();
          reply = `I'll remember: "${fact}", сер.`;
        } else {
          reply = 'Что именно запомнить, сер?';
        }
      } else if (lower.includes('remind me to')) {
        const task = text.replace(/remind me to/i, '').trim();
        if (task && config.memory) {
          tasks.push({ id: Date.now().toString(36), text: task, done: false });
          saveState();
          renderToday();
          reply = `Reminder set: "${task}", сер.`;
        } else {
          reply = 'О чём напомнить, сер?';
        }
      } else if (lower.includes('brief me')) {
        const taskCount = tasks.filter(t => !t.done).length;
        const memCount = memories.length;
        reply = `Добрый вечер, сер. У вас ${taskCount} задач и ${memCount} фактов в памяти.`;
        if (taskCount > 0) {
          const list = tasks.filter(t => !t.done).slice(0,3).map(t => t.text).join(', ');
          reply += ' Напоминаю: ' + list;
        }
      } else {
        reply = 'Здравствуйте, сер. Я Джарвис. Напишите "remind me to..." или "remember that...", чтобы я мог помочь.';
      }

      addMessage('jarvis', reply);
      if (speak) speakText(reply);
    }

    // ---------- Speech Synthesis (заглушка) ----------
    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ru-RU';
      utterance.rate = 0.82;
      utterance.pitch = 0.55;
      utterance.volume = 1;
      window.speechSynthesis.speak(utterance);
    }

    // ---------- Orb click to listen ----------
    orb.addEventListener('click', () => {
      if (isListening) stopListening();
      else startListening();
    });

    // ---------- Init ----------
    init();

  })();
</script>
</body>
</html>
