<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jarvis 3.4 · ИИ-ассистент</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    /* ---------- RESET & GLOBAL ---------- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #080b12;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      color: #e4e9f2;
      transition: background 0.3s, color 0.3s;
    }
    body.light {
      background: #f0f2f5;
      color: #1a1a2e;
    }
    /* ---------- APP LAYOUT ---------- */
    .app {
      display: flex;
      height: 100vh;
      width: 100%;
      background: rgba(8, 11, 18, 0.95);
      transition: background 0.3s;
    }
    body.light .app {
      background: rgba(240, 242, 245, 0.95);
    }
    /* ---------- SIDEBAR ---------- */
    .sidebar {
      width: 260px;
      background: rgba(14, 18, 32, 0.92);
      backdrop-filter: blur(16px);
      border-right: 1px solid rgba(255,255,255,0.04);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.3s ease, background 0.3s;
      overflow: hidden;
      z-index: 10;
    }
    body.light .sidebar {
      background: rgba(255, 255, 255, 0.92);
      border-right-color: rgba(0,0,0,0.08);
    }
    .sidebar-header {
      padding: 16px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    body.light .sidebar-header {
      border-bottom-color: rgba(0,0,0,0.06);
    }
    .sidebar-header .logo {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, #7a97ff, #1f3a9f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sidebar-header .logo small {
      font-size: 12px;
      background: rgba(255,255,255,0.06);
      padding: 2px 10px;
      border-radius: 12px;
      -webkit-text-fill-color: #8e9fd3;
      font-weight: 400;
    }
    body.light .sidebar-header .logo small {
      background: rgba(0,0,0,0.06);
      -webkit-text-fill-color: #4a5a7a;
    }
    .new-chat-btn {
      background: rgba(74, 106, 255, 0.15);
      border: 1px solid rgba(74, 106, 255, 0.2);
      color: #b0c4ff;
      padding: 8px 14px;
      border-radius: 40px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }
    .new-chat-btn:hover {
      background: rgba(74, 106, 255, 0.25);
      border-color: #4a6aff;
    }
    body.light .new-chat-btn {
      color: #2a3a6a;
      background: rgba(74, 106, 255, 0.08);
    }
    body.light .new-chat-btn:hover {
      background: rgba(74, 106, 255, 0.15);
    }
    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
    }
    .chat-list::-webkit-scrollbar { width: 4px; }
    .chat-list::-webkit-scrollbar-thumb { background: #2a3150; border-radius: 8px; }
    body.light .chat-list::-webkit-scrollbar-thumb { background: #c0c8d8; }
    .chat-item {
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
    }
    .chat-item:hover { background: rgba(255,255,255,0.04); }
    body.light .chat-item:hover { background: rgba(0,0,0,0.04); }
    .chat-item.active { background: rgba(74, 106, 255, 0.12); border-left: 2px solid #4a6aff; }
    body.light .chat-item.active { background: rgba(74, 106, 255, 0.08); }
    .chat-item .chat-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chat-item .chat-actions {
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: 0.2s;
    }
    .chat-item:hover .chat-actions { opacity: 1; }
    .chat-item .chat-actions button {
      background: transparent;
      border: none;
      color: #6a7ba8;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 13px;
      transition: 0.2s;
    }
    .chat-item .chat-actions button:hover { color: #ff6b6b; background: rgba(255,70,70,0.08); }
    .sidebar-footer {
      padding: 16px 18px;
      border-top: 1px solid rgba(255,255,255,0.04);
    }
    body.light .sidebar-footer {
      border-top-color: rgba(0,0,0,0.06);
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .user-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #7a97ff, #1f3a9f);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 16px;
      color: #fff;
      flex-shrink: 0;
    }
    .user-details {
      flex: 1;
      min-width: 0;
    }
    .user-details .user-name {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-details .user-email {
      font-size: 12px;
      color: #6a7ba8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .logout-btn {
      background: rgba(255,70,70,0.08);
      border: none;
      color: #ff6b6b;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s;
    }
    .logout-btn:hover { background: rgba(255,70,70,0.15); }
    /* ---------- MAIN CHAT AREA ---------- */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: rgba(8, 11, 18, 0.7);
      backdrop-filter: blur(20px);
      min-width: 0;
      transition: background 0.3s;
    }
    body.light .main {
      background: rgba(240, 242, 245, 0.7);
    }
    .main-header {
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      flex-shrink: 0;
      background: rgba(0,0,0,0.15);
    }
    body.light .main-header {
      border-bottom-color: rgba(0,0,0,0.06);
      background: rgba(255,255,255,0.08);
    }
    .menu-toggle {
      background: transparent;
      border: none;
      color: #b0c4ff;
      font-size: 22px;
      cursor: pointer;
      display: none;
      padding: 4px;
    }
    body.light .menu-toggle { color: #2a3a6a; }
    .main-header .chat-title {
      font-size: 18px;
      font-weight: 600;
      flex: 1;
    }
    .main-header .chat-title input {
      background: transparent;
      border: none;
      color: #eef3ff;
      font-size: 18px;
      font-weight: 600;
      outline: none;
      width: 100%;
      font-family: inherit;
    }
    body.light .main-header .chat-title input { color: #1a1a2e; }
    .main-header .chat-title input::placeholder { color: #6a7ba8; }
    .main-actions {
      display: flex;
      gap: 4px;
    }
    .main-actions button {
      background: rgba(255,255,255,0.04);
      border: none;
      color: #b0c4ff;
      width: 36px; height: 36px;
      border-radius: 50%;
      font-size: 17px;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .main-actions button:hover { background: rgba(255,255,255,0.08); }
    body.light .main-actions button { color: #2a3a6a; background: rgba(0,0,0,0.04); }
    body.light .main-actions button:hover { background: rgba(0,0,0,0.08); }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    .chat-box::-webkit-scrollbar { width: 4px; }
    .chat-box::-webkit-scrollbar-track { background: transparent; }
    .chat-box::-webkit-scrollbar-thumb { background: #3c4f8a; border-radius: 8px; }
    body.light .chat-box::-webkit-scrollbar-thumb { background: #c0c8d8; }

    .message { display: flex; flex-direction: column; max-width: 92%; animation: slideUp 0.3s ease forwards; opacity: 0; transform: translateY(12px); }
    @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
    .message.user { align-self: flex-end; align-items: flex-end; }
    .message.jarvis { align-self: flex-start; align-items: flex-start; }
    .message.system { align-self: center; max-width: 80%; font-size: 13px; color: #8e9fd3; }
    body.light .message.system { color: #5a6a8a; }
    .message.system .bubble { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.03); border-radius: 40px; padding: 6px 16px; }
    body.light .message.system .bubble { background: rgba(0,0,0,0.04); border-color: rgba(0,0,0,0.04); }
    .bubble { padding: 10px 18px; border-radius: 22px; font-size: 15px; line-height: 1.6; word-break: break-word; background: rgba(40, 46, 74, 0.7); border: 1px solid rgba(255,255,255,0.04); box-shadow: 0 2px 12px rgba(0,0,0,0.2); position: relative; max-width: 100%; }
    body.light .bubble { background: rgba(230, 234, 248, 0.8); border-color: rgba(0,0,0,0.04); box-shadow: 0 2px 8px rgba(0,0,0,0.06); color: #1a1a2e; }
    .message.user .bubble { background: linear-gradient(135deg, #4a6aff, #2f47c7); border-color: rgba(255,255,255,0.08); color: white; border-bottom-right-radius: 6px; }
    body.light .message.user .bubble { background: linear-gradient(135deg, #4a6aff, #2f47c7); color: white; }
    .message.jarvis .bubble { background: rgba(30, 36, 60, 0.8); backdrop-filter: blur(4px); border-bottom-left-radius: 6px; border-left: 2px solid #4a6aff; }
    body.light .message.jarvis .bubble { background: rgba(230, 234, 248, 0.8); border-left-color: #4a6aff; }
    .bubble p { margin: 4px 0; }
    .bubble ul, .bubble ol { padding-left: 20px; margin: 6px 0; }
    .bubble blockquote { border-left: 3px solid #4a6aff; padding-left: 14px; margin: 8px 0; color: #b8c7ff; }
    body.light .bubble blockquote { color: #3a4a6a; }
    .bubble pre { position: relative; background: #0d1117; border-radius: 14px; padding: 16px 18px; margin: 8px 0; overflow-x: auto; font-size: 13px; border: 1px solid rgba(255,255,255,0.06); }
    body.light .bubble pre { background: #f0f2f5; border-color: rgba(0,0,0,0.06); }
    .bubble pre code { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; display: block; white-space: pre; }
    .bubble pre .line-numbers { float: left; margin-right: 12px; color: #6a7ba8; user-select: none; text-align: right; padding-right: 6px; border-right: 1px solid #2a3150; }
    body.light .bubble pre .line-numbers { border-right-color: #c0c8d8; }
    .code-toolbar { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; opacity: 0; transition: opacity 0.2s; }
    .bubble pre:hover .code-toolbar { opacity: 1; }
    .code-toolbar button { background: rgba(255,255,255,0.08); border: none; color: #b0c4ff; padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: 0.2s; }
    .code-toolbar button:hover { background: rgba(255,255,255,0.18); }
    body.light .code-toolbar button { background: rgba(0,0,0,0.06); color: #2a3a6a; }
    body.light .code-toolbar button:hover { background: rgba(0,0,0,0.12); }
    .source-block { margin-top: 8px; padding: 8px 14px; background: rgba(255,255,255,0.04); border-radius: 12px; border-left: 2px solid #4a6aff; font-size: 13px; color: #96a7d9; }
    body.light .source-block { background: rgba(0,0,0,0.04); color: #3a4a6a; }
    .source-block a { color: #7a97ff; text-decoration: none; }
    .source-block a:hover { text-decoration: underline; }
    body.light .source-block a { color: #4a6aff; }

    .thinking-dots { display: flex; gap: 6px; align-items: center; padding: 6px 0; }
    .thinking-dots span { width: 8px; height: 8px; background: #8aa3ff; border-radius: 50%; animation: dotBounce 1.4s infinite; }
    .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotBounce { 0%,60%,100% { transform: translateY(0); opacity:0.4; } 30% { transform: translateY(-10px); opacity:1; } }

    .input-area { padding: 14px 24px 22px; display: flex; flex-direction: column; gap: 10px; background: rgba(8, 11, 20, 0.6); border-top: 1px solid rgba(255,255,255,0.04); flex-shrink: 0; }
    body.light .input-area { background: rgba(240, 242, 245, 0.6); border-top-color: rgba(0,0,0,0.06); }
    .input-row { display: flex; gap: 12px; align-items: center; }
    .input-wrapper { flex: 1; display: flex; align-items: center; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); border-radius: 40px; padding: 0 8px 0 18px; transition: border 0.25s, box-shadow 0.25s; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
    body.light .input-wrapper { background: rgba(255,255,255,0.6); border-color: rgba(0,0,0,0.08); }
    .input-wrapper:focus-within { border-color: #4a6aff; box-shadow: 0 0 0 3px rgba(74, 106, 255, 0.15), inset 0 2px 4px rgba(0,0,0,0.2); }
    .input-wrapper input { flex: 1; background: transparent; border: none; padding: 12px 0; color: #eef3ff; font-size: 15px; outline: none; font-family: inherit; }
    body.light .input-wrapper input { color: #1a1a2e; }
    .input-wrapper input::placeholder { color: #6a7ba8; font-weight: 300; }
    .input-wrapper .tool-btn { background: transparent; border: none; color: #b0c4ff; width: 40px; height: 40px; border-radius: 50%; font-size: 19px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
    .input-wrapper .tool-btn:hover { background: rgba(255,255,255,0.05); color:#d6e2ff; }
    body.light .input-wrapper .tool-btn { color: #4a5a7a; }
    body.light .input-wrapper .tool-btn:hover { background: rgba(0,0,0,0.04); color:#2a3a6a; }
    .input-wrapper .tool-btn:active { transform: scale(0.9); }
    .input-wrapper .tool-btn.mic-active { color: #ff6b8a; background: rgba(255,80,120,0.15); }
    .input-wrapper .tool-btn.has-attachment { color: #6bff6b; }
    .send-btn { background: linear-gradient(135deg, #4a6aff, #2f47c7); border: none; color: white; width: 48px; height: 48px; border-radius: 50%; font-size: 22px; cursor: pointer; box-shadow: 0 6px 20px rgba(56,98,255,0.3); transition: 0.2s; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .send-btn:hover { box-shadow: 0 8px 30px rgba(56,98,255,0.5); background: linear-gradient(135deg, #5a7aff, #3a57d7); }
    .send-btn:active { transform: scale(0.92); }
    .stop-btn { background: rgba(255,70,70,0.12); border: none; color: #ff6b6b; width: 48px; height: 48px; border-radius: 50%; font-size: 20px; cursor: pointer; display: none; align-items: center; justify-content: center; transition: 0.2s; }
    .stop-btn:hover { background: rgba(255,70,70,0.2); }
    .file-input-hidden { display: none; }

    /* ---------- MODAL ---------- */
    .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 999; }
    .modal-overlay.active { display: flex; }
    .modal { background: #1a2035; border-radius: 32px; padding: 32px 28px; max-width: 600px; width: 90%; box-shadow: 0 40px 80px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.06); max-height: 90vh; overflow-y: auto; transition: background 0.3s; }
    body.light .modal { background: #f0f2f5; border-color: rgba(0,0,0,0.06); }
    .modal h2 { font-size: 22px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
    .modal label { display: block; font-size: 13px; color: #96a7d9; margin-top: 16px; margin-bottom: 4px; }
    body.light .modal label { color: #4a5a7a; }
    .modal select, .modal input, .modal .range-wrap { width: 100%; padding: 10px 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; color: #eef3ff; font-size: 14px; outline: none; font-family: inherit; }
    body.light .modal select, body.light .modal input, body.light .modal .range-wrap { background: rgba(255,255,255,0.6); border-color: rgba(0,0,0,0.08); color: #1a1a2e; }
    .modal select option { background: #1a2035; }
    body.light .modal select option { background: #f0f2f5; }
    .modal .range-wrap { display: flex; align-items: center; gap: 12px; padding: 6px 14px; }
    .modal .range-wrap input[type="range"] { flex: 1; background: transparent; accent-color: #4a6aff; }
    .modal .range-wrap span { min-width: 32px; text-align: center; color: #b0c4ff; }
    body.light .modal .range-wrap span { color: #2a3a6a; }
    .modal .checkbox-group { display: flex; align-items: center; gap: 12px; padding: 6px 0; }
    .modal .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; accent-color: #4a6aff; cursor: pointer; }
    .modal .checkbox-group label { margin: 0; cursor: pointer; font-size: 14px; }
    .modal .help-text { font-size: 12px; color: #7a8bb5; margin-top: 6px; }
    body.light .modal .help-text { color: #4a5a7a; }
    .modal .help-text a { color: #4a6aff; text-decoration: none; }
    .modal .modal-actions { display: flex; gap: 12px; margin-top: 24px; justify-content: flex-end; }
    .modal .modal-actions button { padding: 10px 24px; border: none; border-radius: 30px; font-weight: 500; cursor: pointer; transition: 0.2s; }
    .modal .modal-actions .btn-primary { background: #4a6aff; color: white; }
    .modal .modal-actions .btn-primary:hover { background: #5a7aff; }
    .modal .modal-actions .btn-secondary { background: rgba(255,255,255,0.06); color: #b0c4ff; }
    body.light .modal .modal-actions .btn-secondary { background: rgba(0,0,0,0.06); color: #2a3a6a; }
    .modal .modal-actions .btn-secondary:hover { background: rgba(255,255,255,0.1); }
    body.light .modal .modal-actions .btn-secondary:hover { background: rgba(0,0,0,0.1); }

    /* ---------- AUTH OVERLAY ---------- */
    .auth-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.75); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .auth-overlay.hidden { display: none; }
    .auth-box { background: #1a2035; border-radius: 40px; padding: 40px 32px; max-width: 420px; width: 90%; box-shadow: 0 40px 80px rgba(0,0,0,0.9); border: 1px solid rgba(255,255,255,0.06); text-align: center; }
    body.light .auth-box { background: #f0f2f5; border-color: rgba(0,0,0,0.06); }
    .auth-box h2 { font-size: 24px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 12px; }
    .auth-box p { color: #96a7d9; font-size: 14px; margin-bottom: 24px; }
    body.light .auth-box p { color: #4a5a7a; }
    .auth-box input { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 30px; color: #eef3ff; font-size: 15px; outline: none; font-family: inherit; margin-bottom: 12px; transition: border 0.2s; }
    body.light .auth-box input { background: rgba(255,255,255,0.6); color: #1a1a2e; border-color: rgba(0,0,0,0.08); }
    .auth-box input:focus { border-color: #4a6aff; }
    .auth-box .auth-row { display: flex; gap: 10px; margin-bottom: 12px; }
    .auth-box .auth-row input { flex: 1; margin-bottom: 0; }
    .auth-box .auth-row button { padding: 10px 18px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 30px; color: #b0c4ff; cursor: pointer; transition: 0.2s; font-size: 14px; white-space: nowrap; }
    body.light .auth-box .auth-row button { background: rgba(0,0,0,0.04); color: #2a3a6a; border-color: rgba(0,0,0,0.08); }
    .auth-box .auth-row button:hover { background: rgba(255,255,255,0.1); }
    body.light .auth-box .auth-row button:hover { background: rgba(0,0,0,0.08); }
    .auth-box .btn-confirm { width: 100%; padding: 12px; background: linear-gradient(135deg, #4a6aff, #2f47c7); border: none; border-radius: 30px; color: white; font-size: 16px; font-weight: 500; cursor: pointer; transition: 0.2s; margin-top: 8px; }
    .auth-box .btn-confirm:hover { background: linear-gradient(135deg, #5a7aff, #3a57d7); }
    .auth-box .error-msg { color: #ff6b6b; font-size: 13px; margin-top: 8px; min-height: 20px; }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 280px;
        height: 100%;
        transform: translateX(-100%);
        box-shadow: 4px 0 24px rgba(0,0,0,0.6);

    function t(key, params = {}) {
      let str = translations[currentLang]?.[key] || translations['ru'][key] || key;
      for (let k in params) {

      }
      return str;

    // ---------- Инициализация IndexedDB для самообучения ----------
    let db = null;
    function initIndexedDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('JarvisMemory', 1);
        request.onupgradeneeded = function(e) {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('answers')) {
            const store = db.createObjectStore('answers', { keyPath: 'id', autoIncrement: true });
            store.createIndex('question', 'question', { unique: false });
          }
        };
        request.onsuccess = function(e) {
          db = e.target.result;
          resolve(db);
        };
        request.onerror = function(e) {
          reject(e);
        };
      });
    }

    function saveAnswerToMemory(question, answer) {
      if (!config.selfLearn || !db) return;
      const transaction = db.transaction(['answers'], 'readwrite');
      const store = transaction.objectStore('answers');
      store.add({ question, answer, timestamp: Date.now() });
    }

    function searchMemory(question) {
      return new Promise((resolve) => {
        if (!db) return resolve(null);
        const transaction = db.transaction(['answers'], 'readonly');
        const store = transaction.objectStore('answers');
        const index = store.index('question');
        const range = IDBKeyRange.only(question);
        const request = index.get(range);
        request.onsuccess = function() {
          resolve(request.result ? request.result.answer : null);
        };
        request.onerror = function() {
          resolve(null);
        };
      });
    }

        const transcript = e.results[e.results.length-1][0].transcript.trim();
        if (transcript) {
          // Проверка на голосовые команды
          if (config.voiceCommands) {
            const lower = transcript.toLowerCase();

      utterance.pitch = 0.6;
      utterance.volume = 1;
      if (config.voiceURI) {
        const voices = speechSynthesis.getVoices();
        const selected = voices.find(v => v.voiceURI === config.voiceURI);
        if (selected) utterance.voice = selected;
      } else {
        const voices = speechSynthesis.getVoices();

      }
      utterance.onstart = () => document.querySelector('.avatar')?.classList.add('pulse');
      utterance.onend = () => document.querySelector('.avatar')?.classList.remove('pulse');
      utterance.onerror = () => document.querySelector('.avatar')?.classList.remove('pulse');
      window.speechSynthesis.speak(utterance);
    }

    // ---------- Добавление кнопок и номеров строк ----------
    function addCodeFeatures(bubbleElement, showLineNumbers) {
      bubbleElement.querySelectorAll('pre').forEach(pre => {
        const code = pre.querySelector('code');
        if (!code) return;
        if (showLineNumbers) {
          const lines = code.textContent.split('\n').length - 1;
          if (lines > 1) {
            const lineNumbers = document.createElement('span');
            lineNumbers.className = 'line-numbers';
            let nums = '';
            for (let i = 1; i <= lines; i++) nums += i + '\n';
            lineNumbers.textContent = nums;
            pre.insertBefore(lineNumbers, code);
          }
        }
        const toolbar = document.createElement('div');
        toolbar.className = 'code-toolbar';
        const copyBtn = document.createElement('button');
        copyBtn.textContent = '📋 Копировать';
        copyBtn.addEventListener('click', () => {
          const text = code.textContent;
          navigator.clipboard.writeText(text).then(() => {
            copyBtn.textContent = '✅';
            setTimeout(() => copyBtn.textContent = '📋 Копировать', 2000);
          });
        });
        toolbar.appendChild(copyBtn);
        const downloadBtn = document.createElement('button');
        downloadBtn.textContent = '⬇ Скачать';
        downloadBtn.addEventListener('click', () => {
          const text = code.textContent;
          let ext = 'txt';
          const langClass = [...code.classList].find(c => c.startsWith('language-'));
          if (langClass) {
            const lang = langClass.replace('language-', '').toLowerCase();
            const map = { python:'py', javascript:'js', typescript:'ts', html:'html', css:'css', json:'json', xml:'xml', yaml:'yaml', yml:'yml', markdown:'md', bash:'sh', shell:'sh', sql:'sql', php:'php', java:'java', c:'c', cpp:'cpp', csharp:'cs', go:'go', rust:'rs', swift:'swift', ruby:'rb', perl:'pl', lua:'lua', r:'r', kotlin:'kt', scala:'scala', dart:'dart', plaintext:'txt' };
            ext = map[lang] || 'txt';
          }
          const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `code.${ext}`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        });
        toolbar.appendChild(downloadBtn);
        pre.appendChild(toolbar);
      });
    }

    // ---------- Рендеринг Markdown ----------
    function renderMarkdown(text) {
      const parts = text.split(/(```(?:\w+)?\n[\s\S]*?```)/g);
      let html = '';
      for (let part of parts) {
        if (part.startsWith('```')) {
          const match = part.match(/```(\w+)?\n([\s\S]*?)```/);
          if (match) {
            const lang = match[1] || 'plaintext';
            const code = escapeHtml(match[2]);
            html += `<pre><code class="language-${lang}">${code}</code></pre>`;
          }
        } else {
          let textPart = part;
          textPart = textPart.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
          textPart = textPart.replace(/\*(.*?)\*/g, '<em>$1</em>');
          textPart = textPart.replace(/`([^`]+)`/g, '<code>$1</code>');
          textPart = textPart.replace(/^# (.*$)/gm, '<h3>$1</h3>');
          textPart = textPart.replace(/^## (.*$)/gm, '<h4>$1</h4>');
          textPart = textPart.replace(/^> (.*$)/gm, '<blockquote>$1</blockquote>');
          textPart = textPart.replace(/^- (.*$)/gm, '<li>$1</li>');
          textPart = textPart.replace(/\n/g, '<br>');
          html += textPart;
        }
      }
      return html;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ---------- Web-поиск (DuckDuckGo) ----------
    async function webSearchQuery(query) {
      try {
        const resp = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`);
        if (!resp.ok) throw new Error('Ошибка поиска');
        const data = await resp.json();
        let answer = '';
        if (data.AbstractText) {
          answer += data.AbstractText + '\n';
        }
        if (data.RelatedTopics && data.RelatedTopics.length > 0) {
          answer += '\nСвязанные ссылки:\n';
          data.RelatedTopics.slice(0, 3).forEach(topic => {
            if (topic.Text) {
              answer += `- ${topic.Text}\n`;
            }
          });
        }
        if (!answer) answer = 'Ничего не найдено.';
        return answer;
      } catch (e) {
        return `Ошибка поиска: ${e.message}`;
      }
    }

    // ---------- Генерация изображений (Hugging Face) ----------
    async function generateImage(prompt) {
      const apiKey = config.imageApiKey;
      if (!apiKey) {
        addSystemMessage('⚠️ Укажите API-ключ для генерации изображений в настройках.');
        return null;
      }
      try {
        const resp = await fetch('https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-dev', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ inputs: prompt })
        });
        if (!resp.ok) {
          const err = await resp.text();
          throw new Error(`API error: ${resp.status} - ${err}`);
        }
        const blob = await resp.blob();
        return URL.createObjectURL(blob);
      } catch (e) {
        addSystemMessage(`❌ Ошибка генерации: ${e.message}`);
        return null;
      }
    }

    // ---------- Отправка сообщения ----------
    async function handleSend(text, speak = false) {
      const trimmed = text.trim();
      if (!trimmed && !pendingImage) {
        addSystemMessage('⚠️ Введите текст или прикрепите фото.');
        return;
      }
      if (isGenerating) return;

      // Проверка на плагины
      if (trimmed.toLowerCase().includes('погода') && config.pluginWeather) {
        const city = trimmed.replace(/погода\s*/i, '').trim() || 'Москва';
        const weather = await getWeather(city);
        addMessage('user', trimmed, false);
        addMessage('jarvis', weather, false);
        return;
      }
      if (trimmed.toLowerCase().includes('календарь') && config.pluginCalendar) {
        const events = await getCalendarEvents();
        addMessage('user', trimmed, false);
        addMessage('jarvis', events, false);
        return;
      }
      if (trimmed.toLowerCase().includes('новости') && config.pluginNews) {
        const news = await getNews();
        addMessage('user', trimmed, false);
        addMessage('jarvis', news, false);
        return;
      }

      // Web-поиск
      if (config.webSearch && (trimmed.includes('найти') || trimmed.includes('поиск') || trimmed.includes('search'))) {
        const query = trimmed.replace(/найти|поиск|search\s*/i, '').trim();
        if (query) {
          addMessage('user', trimmed, false);
          showThinking();
          const result = await webSearchQuery(query);
          hideThinking();
          addMessage('jarvis', result, false);
          return;
        }
      }

      if (pendingImage) {
        const imageData = pendingImage;
        const userText = trimmed || 'Опиши это изображение';
        if (trimmed) addMessage('user', trimmed, false);
        const imgHtml = `<div style="max-width:200px; border-radius:12px; overflow:hidden; margin:4px 0;"><img src="${imageData}" style="width:100%; display:block;" /></div>`;
        addMessage('user', imgHtml, true);
        pendingImage = null;
        attachBtn.classList.remove('has-attachment');
        await sendMultimodalRequest(userText, imageData, speak);
        return;
      }

      addMessage('user', trimmed, false);
      textInput.value = '';

      showThinking();
      document.querySelector('.avatar')?.classList.add('pulse');
      isGenerating = true;
      stopBtn.style.display = 'flex';
      sendBtn.style.display = 'none';

      const messages = [];
      updateSystemPrompt();
      const systemMsg = config.finalSystemPrompt || 'Ты — Jarvis 3.4, умный помощник.';
      messages.push({ role: 'system', content: systemMsg });

      const chat = chats.find(c => c.id === currentChatId);
      if (chat && config.selfLearn) {
        const history = chat.messages.filter(m => m.role !== 'system' && !m.image).slice(-10);
        history.forEach(m => {
          messages.push({ role: m.role, content: m.content });
        });
      }

      try {
        let answer;
        // Проверка памяти (самообучение)
        if (config.selfLearn && db) {
          const mem = await searchMemory(trimmed);
          if (mem) {
            answer = mem;
          }
        }
        if (!answer) {
          answer = await callAI(messages);
          if (config.selfLearn && db) {
            saveAnswerToMemory(trimmed, answer);
          }
        }

        hideThinking();
        document.querySelector('.avatar')?.classList.remove('pulse');

        let finalAnswer = answer;
        let sources = '';
        if (config.sourceCheck) {
          const urlRegex = /(https?:\/\/[^\s]+)/g;
          const urls = answer.match(urlRegex);
          if (urls && urls.length > 0) {
            sources = '<div class="source-block">📚 Источники:<ul>';
            const unique = [...new Set(urls)];
            unique.forEach(u => {
              sources += `<li><a href="${u}" target="_blank">${u}</a></li>`;
            });
            sources += '</ul></div>';
          }
        }

        const htmlContent = renderMarkdown(finalAnswer) + (sources || '');
        const bubble = addMessage('jarvis', htmlContent, true);
        if (bubble) {
          addCodeFeatures(bubble, config.showLineNumbers);
        }

        if (speak) {
          const plainText = finalAnswer.replace(/<[^>]+>/g, '');
          speakText(plainText);
        }

      } catch (error) {
        hideThinking();
        document.querySelector('.avatar')?.classList.remove('pulse');
        let errorMsg = error.message;
        if (errorMsg.includes('404')) errorMsg += ' Попробуйте другую модель.';
        addSystemMessage(`❌ Ошибка: ${errorMsg}`);
        console.error(error);
      } finally {
        isGenerating = false;
        stopBtn.style.display = 'none';
        sendBtn.style.display = 'flex';
        abortController = null;
        isVoiceInput = false;
      }
    }

    // ---------- Мультимодальный запрос ----------
    async function sendMultimodalRequest(text, imageBase64, speak) {
      showThinking();

      stopBtn.style.display = 'flex';
      sendBtn.style.display = 'none';

        { type: 'image_url', image_url: { url: imageBase64 } }
      ];

      try {
        const answer = await callAIMultimodal(messages, userContent);
        hideThinking();
        document.querySelector('.avatar')?.classList.remove('pulse');

        let finalAnswer = answer;
        let sources = '';
        if (config.sourceCheck) {
          const urlRegex = /(https?:\/\/[^\s]+)/g;
          const urls = answer.match(urlRegex);
          if (urls && urls.length > 0) {
            sources = '<div class="source-block">📚 Источники:<ul>';
            const unique = [...new Set(urls)];
            unique.forEach(u => {
              sources += `<li><a href="${u}" target="_blank">${u}</a></li>`;
            });
            sources += '</ul></div>';
          }
        }

        const htmlContent = renderMarkdown(finalAnswer) + (sources || '');
        const bubble = addMessage('jarvis', htmlContent, true);
        if (bubble) {
          addCodeFeatures(bubble, config.showLineNumbers);
        }

        if (speak) {
          const plainText = finalAnswer.replace(/<[^>]+>/g, '');
          speakText(plainText);
        }

      } catch (error) {
        hideThinking();
        document.querySelector('.avatar')?.classList.remove('pulse');
        addSystemMessage(`❌ Ошибка: ${error.message}`);
        console.error(error);
      } finally {
        isGenerating = false;
        stopBtn.style.display = 'none';
        sendBtn.style.display = 'flex';
        abortController = null;

    // ---------- Вызов AI (текст) ----------
    async function callAI(messages) {
      const provider = config.provider;
      const model = config.model;
      const temperature = config.temperature || 0.7;

      abortController = new AbortController();
      const signal = abortController.signal;

      if (provider === 'custom') {
        const url = config.customUrl;
        const apiKey = config.customApiKey;
        const customModelName = config.customModel || 'gpt-4';
        if (!url) throw new Error(t('customApiMissing'));
        if (!apiKey) throw new Error(t('customKeyMissing'));
        const payload = { model: customModelName, messages, temperature, max_tokens: 2048, stream: false };
        const resp = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
          body: JSON.stringify(payload),
          signal
        });
        if (!resp.ok) {
          const err = await resp.text();
          throw new Error(`Custom API error (${resp.status}): ${err}`);
        }
        const data = await resp.json();
        return data?.choices?.[0]?.message?.content || 'Ответ не получен.';
      }

      if (provider === 'openrouter') {
        const apiKey = DEFAULT_API_KEY;
        if (!apiKey) throw new Error(t('apiKeyMissing'));
        const resp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`,
            'HTTP-Referer': window.location.origin,
            'X-Title': 'Jarvis 3.4'
          },
          body: JSON.stringify({ model, messages, temperature, max_tokens: 2048 }),
          signal
        });
        if (!resp.ok) {
          const err = await resp.text();
          throw new Error(`OpenRouter error (${resp.status}): ${err}`);
        }
        const data = await resp.json();
        return data?.choices?.[0]?.message?.content || 'Ответ не получен.';
      }

      if (provider === 'google') {
        const apiKey = DEFAULT_API_KEY;
        if (!apiKey) throw new Error(t('googleApiMissing'));
        const contents = messages.map(msg => ({
          role: msg.role === 'assistant' ? 'model' : msg.role,
          parts: [{ text: msg.content }]
        }));
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
        const resp = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents, generationConfig: { temperature } }),
          signal
        });
        if (!resp.ok) {
          const err = await resp.text();
          throw new Error(`Google API error (${resp.status}): ${err}`);
        }
        const data = await resp.json();
        return data?.candidates?.[0]?.content?.parts?.[0]?.text || 'Извините, ответ не получен.';
      }

      if (provider === 'ollama') {
        let prompt = '';
        for (const msg of messages) {
          if (msg.role === 'system') prompt += `System: ${msg.content}\n`;
          else if (msg.role === 'user') prompt += `User: ${msg.content}\n`;
          else if (msg.role === 'assistant') prompt += `Assistant: ${msg.content}\n`;
        }
        prompt += 'Assistant: ';
        const resp = await fetch('http://localhost:11434/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model, prompt, stream: false, options: { temperature } }),
          signal
        });
        if (!resp.ok) throw new Error(`Ollama error (${resp.status})`);
        const data = await resp.json();
        return data.response || 'Нет ответа от модели.';
      }

      throw new Error(t('unknownProvider'));
    }

    // ---------- Мультимодальный вызов ----------
    async function callAIMultimodal(messages, userContent) {
      const provider = config.provider;
      const temperature = config.temperature || 0.7;

      abortController = new AbortController();
      const signal = abortController.signal;

      if (provider === 'custom') {
        const url = config.customUrl;
        const apiKey = config.customApiKey;
        const customModelName = config.customModel || 'gpt-4';
        if (!url) throw new Error(t('customApiMissing'));
        if (!apiKey) throw new Error(t('customKeyMissing'));
        const payload = {
          model: customModelName,
          messages: [
            { role: 'system', content: messages[0]?.content || 'Ты — Jarvis 3.4.' },
            { role: 'user', content: userContent }
          ],
          temperature,
          max_tokens: 2048,
        };
        const resp = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
          body: JSON.stringify(payload),
          signal
        });
        if (!resp.ok) {
          const err = await resp.text();
          throw new Error(`Custom API error (${resp.status}): ${err}`);
        }
        const data = await resp.json();
        return data?.choices?.[0]?.message?.content || 'Ответ не получен.';
      }

      if (provider === 'openrouter') {
        const apiKey = DEFAULT_API_KEY;
        if (!apiKey) throw new Error(t('apiKeyMissing'));
        const payload = {
          model: config.model,
          messages: [
            { role: 'system', content: messages[0]?.content || 'Ты — Jarvis 3.4.' },
            { role: 'user', content: userContent }
          ],
          temperature,
          max_tokens: 2048,
        };
        const resp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`,
            'HTTP-Referer': window.location.origin,
            'X-Title': 'Jarvis 3.4'
          },
          body: JSON.stringify(payload),
          signal
        });
        if (!resp.ok) {
          const err = await resp.text();
          throw new Error(`OpenRouter multimodal error (${resp.status}): ${err}`);
        }
        const data = await resp.json();
        return data?.choices?.[0]?.message?.content || 'Ответ не получен.';
      }

      // Для других провайдеров мультимодальность не поддерживается
      const textMsg = userContent.find(c => c.type === 'text');
      const text = textMsg ? textMsg.text : 'Опиши изображение';
      const msgs = [
        { role: 'system', content: messages[0]?.content || 'Ты — Jarvis 3.4.' },
        { role: 'user', content: text }
      ];
      return await callAI(msgs);
    }

    async function findPlace(query) {
      addSystemMessage(t('searchPlaces', { query }));
      try {
        const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=3`;
        const resp = await fetch(url, { headers: { 'User-Agent': 'JarvisAssistant/3.4' } });
        if (!resp.ok) throw new Error('Ошибка геокодера');
        const data = await resp.json();
        if (!data || data.length === 0) {
          addSystemMessage(t('nothingFound'));
          return;
        }
        let html = '<div style="margin:4px 0;"><strong>📍 Результаты:</strong><ul style="margin:6px 0; padding-left:18px;">';
        data.slice(0, 3).forEach(item => {
          const name = item.display_name || item.name || 'Без названия';
          const lat = parseFloat(item.lat).toFixed(4);
          const lon = parseFloat(item.lon).toFixed(4);
          const mapUrl = `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lon}&zoom=15`;
          html += `<li>${name}<br><a href="${mapUrl}" target="_blank">📍 Открыть карту</a> (${lat}, ${lon})</li>`;
        });
        html += '</ul>';
        const first = data[0];
        if (first) {
          const lat = parseFloat(first.lat).toFixed(4);
          const lon = parseFloat(first.lon).toFixed(4);
          html += `<iframe width="100%" height="200" style="border:0; border-radius:12px; margin-top:6px;" src="https://www.openstreetmap.org/export/embed.html?bbox=${parseFloat(lon)-0.01}%2C${parseFloat(lat)-0.01}%2C${parseFloat(lon)+0.01}%2C${parseFloat(lat)+0.01}&layer=mapnik&marker=${lat}%2C${lon}" allowfullscreen></iframe>`;
        }
        html += '</div>';
        const bubble = addMessage('jarvis', html, true);
        if (bubble) {
          bubble.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
        }
      } catch (error) {
        addSystemMessage(t('searchError', { error: error.message }));
      }
    }

    async function sendVerificationCode(email) {
      const serviceID = config.emailjs_service || 'service_xxxxx';
      const templateID = config.emailjs_template || 'template_xxxxx';
      const userID = config.emailjs_user || 'user_xxxxx';

      if (serviceID === 'service_xxxxx' || templateID === 'template_xxxxx' || userID === 'user_xxxxx') {
        const code = Math.floor(100000 + Math.random() * 900000).toString();
        generatedCode = code;
        authMessage.textContent = t('testCode', { code });
        authMessage.style.color = '#6bff6b';
        console.log(`📧 Код для ${email}: ${code}`);
        return true;
      }

      try {
        const code = Math.floor(100000 + Math.random() * 900000).toString();
        generatedCode = code;
        const templateParams = {
          to_email: email,
          code: code,
          user_name: 'Пользователь'
        };
        await emailjs.send(serviceID, templateID, templateParams, { publicKey: userID });
        authMessage.textContent = t('codeSent');
        authMessage.style.color = '#6bff6b';
        return true;
      } catch (error) {
        console.error('EmailJS error:', error);
        authMessage.textContent = t('codeError');
        authMessage.style.color = '#ff6b6b';
        return false;

        loadChats();
        addSystemMessage(t('welcome', { name: userName }));
        if (!DEFAULT_API_KEY && config.provider !== 'custom' && config.provider !== 'ollama') {
          addSystemMessage(t('noApiKey'));
        }
        initIndexedDB().catch(console.warn);
      } else {
        authOverlay.classList.remove('hidden');
      }
    }

    logoutBtn.addEventListener('click', function() {
      if (confirm('Выйти из аккаунта?')) {
        localStorage.removeItem('jarvis_auth');
        localStorage.removeItem('jarvis_user');
        localStorage.removeItem('jarvis_chats');
        location.reload();
      }
    });

    // ---------- Инициализация ----------
    loadConfig();
    setTimeout(populateVoiceList, 600);
    checkSession();

    if (!DEFAULT_API_KEY && config.provider !== 'custom' && config.provider !== 'ollama') {
      setTimeout(() => {
        if (!authOverlay.classList.contains('hidden')) return;
        addSystemMessage(t('noApiKey'));
      }, 1000);
    }

  })();
</script>
</body>
</html>
